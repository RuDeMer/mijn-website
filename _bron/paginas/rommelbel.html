<script>
(function () {
  const $ = id => document.getElementById(id);
  const KEY = 'rommelbel-v1';
  let opslag = { open: 1, sterren: {}, scores: {}, eindeloos: 0, geluid: true, gespeeld: 0 };
  try { opslag = Object.assign(opslag, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}

  const oneven = r => ((r + (G ? G.pariteit : 0)) % 2) === 1;
  const posVan = (r, c) => [R + c * 2 * R + (oneven(r) ? R : 0), R + r * RH + (G ? G.zak : 0)];
  const buren = (r, c) => { const o = oneven(r); return [[r, c - 1], [r, c + 1], [r - 1, o ? c : c - 1], [r - 1, o ? c + 1 : c], [r + 1, o ? c : c - 1], [r + 1, o ? c + 1 : c]].filter(([rr, cc]) => rr >= 0 && cc >= 0 && cc < kolommen(rr)); };

    const raster = [];
    for (let r = 0; r < rijen; r++) { raster.push([]); const k = (r % 2) ? COLS - 1 : COLS; for (let c = 0; c < k; c++) {
      let vol = true; if (patroon === 1) vol = (r + c) % 3 !== 0 || r < 2; else if (patroon === 2) vol = Math.abs(c - k / 2) < k / 2 - r * 0.35 + 1.5; else if (patroon === 3) vol = !(r > 1 && c % 4 === 1); else if (patroon === 4) vol = r < 2 || rnd() < 0.82;

  }
  // ---------------- een potje beginnen
  function start(modus, level) {
    opslag.gespeeld++; bewaar(); audio();
    const L = modus === 'avontuur' ? maakLevel(level) : { raster: [], kleuren: 5, zakElke: 5 };
    G = { modus, level, raster: [], pariteit: 0, zak: 0, kleuren: L.kleuren, zakElke: L.zakElke, schoten: 0, sindsZak: 0, score: 0, bal: null, huidig: null, volgende: null, hoek: -Math.PI / 2, deeltjes: [], teksten: [], vallers: [], knallers: [], klaar: false, combo: 0, rnd: maakRnd((Date.now() % 100000) + 7) };

  function telBellen() { let n = 0; for (const rij of G.raster) for (const v of rij || []) if (v !== undefined) n++; return n; }
  function aanwezigeKleuren() { const s = new Set(); for (const rij of G.raster) for (const v of rij || []) if (v !== undefined && v < 6) s.add(v); return [...s]; }
  function nieuweBel() {

    const x = G.rnd(), eind = G.modus === 'eindeloos'; if (G.schoten > 3 && x < (G.combo >= 2 ? (eind ? 0.05 : 0.12) : (eind ? 0.012 : 0.035))) return G.rnd() < 0.5 ? BOM : REGENBOOG;

  }
  const golfTempo = () => ({ schoten: Math.max(2, 5 - (G.golf - 1)), seconden: Math.max(4, 12 - (G.golf - 1) * 1.5) });
  function volgendeGolf() { G.golf++; G.kleuren = Math.min(6, 4 + G.golf); G.zakElke = golfTempo().schoten; const [x] = [W / 2]; G.teksten.push({ x, y: H / 2, t: 0, tekst: 'Golf ' + G.golf + '! Sneller en meer kleuren' }); geluid.zak(); }
  function nieuweRij() {

    // alles een rij omlaag, en bovenaan een nieuwe rij
    G.raster.unshift([]); G.pariteit = (G.pariteit + 1) % 2;
    const plak = G.modus === 'eindeloos' ? Math.max(0.12, 0.4 - (G.golf || 1) * 0.05) : 0.4; for (let c = 0; c < kolommen(0); c++) { let v = Math.floor(G.rnd() * G.kleuren); if (c > 0 && G.rnd() < plak) v = G.raster[0][c - 1]; G.raster[0][c] = v; }
  }

  const MIN = -Math.PI + 0.12, MAX = -0.12;
  function richtOp(px, py) { const [sx, sy] = [W / 2, SCHIET_Y]; G.hoek = Math.max(MIN, Math.min(MAX, Math.atan2(py - sy, px - sx))); }
  function schiet() {
    if (!G || G.klaar || G.bal || $('menu').hidden === false) return;
    G.bal = { x: W / 2, y: SCHIET_Y, vx: Math.cos(G.hoek) * 1150, vy: Math.sin(G.hoek) * 1150, v: G.huidig };
    G.huidig = G.volgende; G.volgende = nieuweBel(); G.schoten++; geluid.schiet();
  }
  function wissel() { if (!G || G.bal || G.klaar) return; [G.huidig, G.volgende] = [G.volgende, G.huidig]; geluid.tik(); }
  const naarVeld = e => { const r = doek.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  let ingedrukt = false;
  doek.addEventListener('pointerdown', e => { if (!G) return; e.preventDefault(); const [x, y] = naarVeld(e); if (Math.hypot(x - (W / 2 + 70), y - SCHIET_Y) < 26) { wissel(); return; } ingedrukt = true; doek.setPointerCapture(e.pointerId); richtOp(x, y); });
  doek.addEventListener('pointermove', e => { if (!G) return; if (e.pointerType === 'mouse' || ingedrukt) richtOp(...naarVeld(e)); });
  doek.addEventListener('pointerup', e => { if (!ingedrukt) return; ingedrukt = false; const [, y] = naarVeld(e); if (y < SCHIET_Y + 10) schiet(); });
  doek.addEventListener('pointercancel', () => { ingedrukt = false; });
  const toets = {};
  addEventListener('keydown', e => { if (!G || !$('menu').hidden) return; if (['ArrowLeft', 'ArrowRight', 'Space', 'ArrowUp'].includes(e.code)) e.preventDefault(); toets[e.code] = true; if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) schiet(); if (e.code === 'KeyX' || e.code === 'KeyS') wissel(); if (e.code === 'Escape') toonMenu(); });
  addEventListener('keyup', e => { toets[e.code] = false; });
  // ---------------- de vliegende bel: kaatst tegen de wanden en blijft plakken
  function beweeg(dt) {
    const b = G.bal; if (!b) return;
    const stappen = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 4);
    for (let i = 0; i < stappen; i++) {
      b.x += b.vx * dt / stappen; b.y += b.vy * dt / stappen;
      if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); geluid.kaats(); } if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx); geluid.kaats(); }

      if (!raak) for (let r = 0; r < G.raster.length && !raak; r++) for (let c = 0; c < kolommen(r); c++) { if (cel(r, c) === undefined) continue; const [x, y] = posVan(r, c); if (Math.hypot(b.x - x, b.y - y) < 2 * R * 0.86) { raak = true; break; } }

  function plak(b) {

    if (!beste) return;
    const [r, c] = beste; zet(r, c, b.v); geluid.plak();
    let weg = [];
    if (b.v === BOM) { weg = [[r, c]]; for (let rr = r - 2; rr <= r + 2; rr++) for (let cc = c - 2; cc <= c + 2; cc++) { if (rr < 0 || cel(rr, cc) === undefined) continue; const [x1, y1] = posVan(rr, cc), [x0, y0] = posVan(r, c); if (Math.hypot(x1 - x0, y1 - y0) < R * 4.3) weg.push([rr, cc]); } geluid.bom(); }

      G.combo++;

      const los = losseBellen();
      for (const [rr, cc] of los) { const v = cel(rr, cc), [x, y] = posVan(rr, cc); G.vallers.push({ x, y, v, vy: -60 - Math.random() * 80, vx: (Math.random() - 0.5) * 120 }); zet(rr, cc, undefined); }
      const punten = weg.length * 10 + los.length * 20 * Math.pow(2, Math.min(5, Math.floor(los.length / 4))) + (G.combo > 1 ? G.combo * 15 : 0);
      const punten2 = G.modus === 'eindeloos' ? punten * (G.golf || 1) : punten; G.score += punten2; const [x, y] = posVan(r, c);
      G.teksten.push({ x, y, t: 0, tekst: '+' + punten2 + (G.modus === 'eindeloos' && G.golf > 1 ? ' (×' + G.golf + ')' : '') + (los.length ? '  ' + los.length + ' vallen!' : '') + (G.combo > 1 ? '  combo ×' + G.combo : '') });
      geluid.knal(weg.length); if (los.length) setTimeout(() => geluid.val(los.length), 120);
    } else { G.combo = 0; G.sindsZak++; }
    if (weg.length && G.modus === 'eindeloos') G.sindsZak++;
    opruimen();

    if (G.sindsZak >= G.zakElke && (G.modus === 'eindeloos' || !weg.length)) { G.sindsZak = 0; G.klok = 0; if (G.modus === 'eindeloos') { nieuweRij(); if (G.golf >= 4 && G.rnd() < Math.min(0.85, 0.3 + (G.golf - 4) * 0.1)) nieuweRij(); } else G.zak += RH; geluid.zak(); }

  // ---------------- tekenen

    const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#2C3A72'); bg.addColorStop(1, '#141C3E'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,.04)'; for (let i = 0; i < 30; i++) { g.beginPath(); g.arc((i * 97) % W, (i * 173) % H, 2 + (i % 3), 0, 7); g.fill(); }

    g.fillStyle = '#5E5643'; g.beginPath(); g.arc(W / 2, SCHIET_Y + 8, 30, Math.PI, 0); g.fill();

    // de tellers

    g.font = '700 12px system-ui, sans-serif'; g.fillStyle = 'rgba(251,246,233,.75)'; g.fillText(G.modus === 'avontuur' ? 'Level ' + G.level : 'Eindeloos · golf ' + G.golf, 12, H - 36);

    if (welk === 'regels') { venster('<h2>Zo speel je</h2><p>Mik met je muis of vinger, en laat los (of klik) om te schieten. Op een toetsenbord: pijltjes om te mikken, spatie om te schieten, X om te wisselen.</p><p>Raak je <b>drie of meer bellen van dezelfde kleur</b>, dan knallen ze. Bellen die daarna nergens meer aan vastzitten, <b>vallen</b>: dat levert extra veel punten op.</p><p>In <b>Avontuur</b> zakt het plafond na een paar schoten zonder knal (de stippen rechtsonder tellen af). In <b>Eindeloos</b> komt er na elke paar schoten een nieuwe rij bij, raak of mis, en ook als je te lang wacht (het balkje). Elke golf gaat sneller en brengt meer kleuren, en vanaf golf 4 komen er soms twee rijen tegelijk. Je punten tellen keer je golf. Raken de bellen de rode lijn, dan is het afgelopen.</p><p>Een <b>bom</b> laat alles eromheen knallen, een <b>regenboogbel</b> past bij elke kleur. Tik op de kleine bel rechts om te wisselen.</p><div class="rij"><button class="knop" data-menu="hoofd" type="button">Terug</button></div>'); return; }

})();
