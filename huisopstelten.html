<style>
/* ===== Huis op stelten: een kattenlijstje op papier, met labeltape en pootafdrukjes ===== */
:root { --papier: #FBF6E9; --papier2: #F2EAD6; --inkt: #231A26; --rood: #C8323C; --goud: #E9B949; --blauw: #2F4C8F; --tape: #23252B; --groen: #3D8C6A; --moeki: #E9B949; --floortje: #E8A0C0; --pix: "Pixelify Sans", "Bricolage Grotesque", system-ui, sans-serif; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; background: #16141C; color: var(--inkt); font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-tap-highlight-color: transparent; }
.kop { display: flex; align-items: center; gap: .7rem; padding: .4rem .8rem; z-index: 5; flex: none; }
.kop a { font-weight: 700; font-size: .85rem; }
.titel { display: flex; align-items: center; gap: .4rem; font-weight: 800; white-space: nowrap; } .titel svg { width: 26px; height: 26px; display: block; }
.kop .rechts { margin-left: auto; display: flex; gap: .35rem; }
.knop { font: inherit; font-weight: 800; font-size: .9rem; border: 0; border-radius: 999px; padding: .42rem .9rem; cursor: pointer; background: var(--papier); color: var(--inkt); box-shadow: inset 0 0 0 2px var(--inkt), 0 3px 0 rgba(0,0,0,.25); }
.knop:hover:not(:disabled) { filter: brightness(1.05); } .knop:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--inkt), 0 1px 0 rgba(0,0,0,.25); }
.knop.hoofd { background: var(--rood); color: #FFF6E8; } .knop.goud { background: var(--goud); } .knop[aria-pressed="false"] { opacity: .6; } .knop:disabled { opacity: .45; cursor: default; }
.knop:focus-visible { outline: 3px solid #2F6FB5; outline-offset: 2px; }
#veld { position: relative; flex: 1; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: #16141C; }
#doek { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
/* ---- kaarten: een vel papier met een inktrand, de kop op labeltape */
.scherm { position: absolute; inset: 0; display: grid; place-items: center; padding: .8rem; z-index: 20; background: radial-gradient(ellipse at center, rgba(22,20,28,.25), rgba(22,20,28,.72)); overflow: auto; }
.scherm.licht { background: none; pointer-events: none; } .scherm.licht .kaart { pointer-events: auto; }
.kaart { position: relative; max-width: 34rem; width: 100%; max-height: calc(100% - .5rem); overflow: auto; padding: 1.3rem 1.35rem 1.2rem; color: var(--inkt); border-radius: 6px;
  background: var(--papier) repeating-linear-gradient(0deg, transparent 0 25px, rgba(47,76,143,.08) 25px 26px);
  box-shadow: inset 0 0 0 3px var(--inkt), 0 6px 0 rgba(0,0,0,.35); }
.kaart.breed { max-width: 46rem; }
.kaart.onder { padding: .8rem 1rem .9rem; } .kaart.onder h2 { margin-bottom: .3rem; } .kaart.onder .rij { margin-top: .5rem; }
.kaart h1 { margin: 0 0 .5rem; font-family: var(--pix); font-weight: 700; font-size: clamp(2rem, 8vw, 3rem); line-height: 1; }
.kaart h1 small { display: block; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 1rem; font-weight: 700; color: #6A5A44; margin-top: .45rem; }
.kaart h2 { display: inline-block; margin: 0 0 .7rem; padding: .2rem .7rem .25rem; font-family: var(--pix); font-weight: 600; font-size: 1.3rem; letter-spacing: .03em; color: #F4F1E8; background: var(--tape); transform: rotate(-1deg); box-shadow: 0 2px 0 rgba(0,0,0,.25); clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 50%, 100% 100%, 0 100%, 5px 50%); }
.kaart h3 { margin: .9rem 0 .3rem; font-family: var(--pix); font-weight: 600; font-size: 1.05rem; color: var(--blauw); }
.kaart p { margin: .45rem 0; line-height: 1.5; } .kaart ul { margin: .4rem 0; padding-left: 1.2rem; line-height: 1.5; }
.rij { display: flex; gap: .55rem; flex-wrap: wrap; margin-top: .9rem; align-items: center; } .rij .knop { font-size: 1.02rem; }
.klein { font-size: .87rem; color: #5E5040; }
.kaart > .rij:last-child { position: sticky; bottom: -1.2rem; margin: .9rem -1.35rem -1.2rem; padding: .8rem 1.35rem 1rem; background: linear-gradient(rgba(251,246,233,0), var(--papier) .6rem); }
/* het lijstje met streken */
.streken { list-style: none; padding: 0; margin: .5rem 0; display: grid; gap: .35rem; }
.streken li { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: .5rem; align-items: center; padding: .35rem .5rem; background: #FFFDF6; border-radius: 4px; box-shadow: inset 0 0 0 2px rgba(35,26,38,.75); }
.streken li.gedaan { background: #E4F2DE; } .streken li.gedaan .naam { text-decoration: line-through; text-decoration-thickness: 2px; color: #3A5A3A; }
.streken .vink { width: 1.4rem; height: 1.4rem; border-radius: 3px; box-shadow: inset 0 0 0 2px var(--inkt); background: #FFFFFF; display: grid; place-items: center; font-size: .9rem; }
.streken li.gedaan .vink::after { content: ""; width: 1.05rem; height: 1.05rem; background: no-repeat center/contain url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%3E%3Cg%20fill%3D%22%232E7A54%22%3E%3Cellipse%20cx%3D%2210%22%20cy%3D%2213.4%22%20rx%3D%224.6%22%20ry%3D%223.9%22%2F%3E%3Cellipse%20cx%3D%224.2%22%20cy%3D%228.6%22%20rx%3D%221.9%22%20ry%3D%222.4%22%2F%3E%3Cellipse%20cx%3D%228%22%20cy%3D%225.4%22%20rx%3D%221.9%22%20ry%3D%222.5%22%2F%3E%3Cellipse%20cx%3D%2212%22%20cy%3D%225.4%22%20rx%3D%221.9%22%20ry%3D%222.5%22%2F%3E%3Cellipse%20cx%3D%2215.8%22%20cy%3D%228.6%22%20rx%3D%221.9%22%20ry%3D%222.4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"); }
.streken .wie { font-family: var(--pix); font-size: .78rem; padding: .05rem .4rem; border-radius: 999px; background: var(--papier2); box-shadow: inset 0 0 0 1.5px var(--inkt); white-space: nowrap; }
.streken .wie.moeki { background: #F6DFA0; } .streken .wie.floortje { background: #F6D0DE; } .streken .wie.samen { background: #CFE2F2; }
.streken .tip { grid-column: 2 / 4; font-size: .85rem; color: #5E5040; }
/* kaartjes in een raster: kamers, foto's */
.tegels { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.6rem, 1fr)); gap: .6rem; margin: .5rem 0; }
.polaroid { background: #FFFFFF; padding: .45rem .45rem .5rem; box-shadow: 0 0 0 2px var(--inkt), 0 4px 0 rgba(0,0,0,.25); transform: rotate(var(--draai, -1.5deg)); text-align: center; font-size: .8rem; font-weight: 700; line-height: 1.25; }
.polaroid:nth-child(3n+1) { --draai: 1.2deg; } .polaroid:nth-child(3n+2) { --draai: -.8deg; }
.polaroid canvas { width: 100%; image-rendering: pixelated; display: block; margin-bottom: .35rem; background: #E8E2D6; }
.polaroid.dicht canvas { filter: grayscale(1) brightness(.5); } .polaroid.dicht { color: #8A7E6E; }
.sterren { font-size: 1.7rem; letter-spacing: .1em; color: #CFC4AE; text-shadow: 0 2px 0 rgba(0,0,0,.15); } .sterren b { color: #E3A82E; font-weight: 400; text-shadow: 0 2px 0 #8A5A1A; }
.uitslag { display: grid; grid-template-columns: auto 1fr; gap: .2rem .9rem; margin: .6rem 0; font-size: 1rem; } .uitslag dt { font-weight: 700; } .uitslag dd { margin: 0; }
.stempel { display: inline-block; transform: rotate(-6deg); border: 3px solid var(--rood); color: var(--rood); font-family: var(--pix); font-weight: 700; padding: .05rem .5rem; letter-spacing: .06em; border-radius: 4px; }
.toets { display: inline-block; min-width: 1.6em; padding: .05rem .35rem; border-radius: 4px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px var(--inkt), 0 2px 0 rgba(0,0,0,.2); font-family: var(--pix); font-size: .85rem; text-align: center; }
.katkaart { display: grid; grid-template-columns: 4.5rem 1fr; gap: .8rem; align-items: center; margin: .5rem 0; } .katkaart canvas { width: 4.5rem; image-rendering: pixelated; border-radius: 50%; background: #E8DCC4; box-shadow: inset 0 0 0 2px var(--inkt); }
/* ---- in het spel: het lijstje, de klok en de katten */
#hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#lijstje { position: absolute; left: .5rem; top: .5rem; max-width: min(19rem, 60%); pointer-events: auto; background: var(--papier); border-radius: 4px; box-shadow: inset 0 0 0 2px var(--inkt), 0 3px 0 rgba(0,0,0,.3); padding: .3rem .5rem .4rem; font-size: .82rem; transform: rotate(-.6deg); }
#lijstje > button { all: unset; cursor: pointer; display: flex; gap: .4rem; align-items: center; font-family: var(--pix); font-weight: 700; font-size: .95rem; width: 100%; }
#lijstje > button:focus-visible { outline: 2px solid #2F6FB5; }
#lijstje ul { list-style: none; margin: .25rem 0 0; padding: 0; display: grid; gap: .15rem; }
#lijstje li { display: grid; grid-template-columns: 1rem 1fr; gap: .35rem; align-items: start; line-height: 1.25; }
#lijstje li .vink { width: .95rem; height: .95rem; margin-top: .1rem; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--inkt); background: #FFF; }
#lijstje li.gedaan .vink { background: #FFF no-repeat center/80% url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%3E%3Cg%20fill%3D%22%232E7A54%22%3E%3Cellipse%20cx%3D%2210%22%20cy%3D%2213.4%22%20rx%3D%224.6%22%20ry%3D%223.9%22%2F%3E%3Cellipse%20cx%3D%224.2%22%20cy%3D%228.6%22%20rx%3D%221.9%22%20ry%3D%222.4%22%2F%3E%3Cellipse%20cx%3D%228%22%20cy%3D%225.4%22%20rx%3D%221.9%22%20ry%3D%222.5%22%2F%3E%3Cellipse%20cx%3D%2212%22%20cy%3D%225.4%22%20rx%3D%221.9%22%20ry%3D%222.5%22%2F%3E%3Cellipse%20cx%3D%2215.8%22%20cy%3D%228.6%22%20rx%3D%221.9%22%20ry%3D%222.4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"); } #lijstje li.gedaan span { text-decoration: line-through; color: #4A6A4A; }
#l-tel, #lijstje li .teller { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; }
#lijstje li .teller { font-family: var(--pix); color: var(--blauw); }
#lijstje.dicht ul { display: none; }
#klok { position: absolute; right: .5rem; top: .5rem; display: flex; gap: .35rem; pointer-events: auto; }
.hud-blok { background: var(--papier); border-radius: 999px; padding: .2rem .65rem; box-shadow: inset 0 0 0 2px var(--inkt), 0 3px 0 rgba(0,0,0,.3); font-family: var(--pix); font-weight: 700; font-size: .95rem; white-space: nowrap; display: flex; align-items: center; gap: .3rem; }
.hud-blok.laag { background: #FFD9D6; }
.hud-blok, .kaart h1.getal { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; }
#klok button.hud-blok { border: 0; cursor: pointer; color: var(--inkt); }
#katten { position: absolute; left: .5rem; bottom: .5rem; display: flex; gap: .4rem; pointer-events: auto; }
#katten.boven { bottom: auto; top: 2.9rem; } #katten.boven button { width: 2.9rem; height: 2.9rem; }
#katten button { all: unset; cursor: pointer; position: relative; width: 3.4rem; height: 3.4rem; border-radius: 50%; background: #E8DCC4; box-shadow: inset 0 0 0 2px var(--inkt), 0 3px 0 rgba(0,0,0,.3); opacity: .62; }
#katten button canvas { width: 100%; height: 100%; border-radius: 50%; image-rendering: pixelated; }
#katten button[aria-pressed="true"] { opacity: 1; box-shadow: inset 0 0 0 3px var(--inkt), 0 0 0 3px var(--goud), 0 3px 0 rgba(0,0,0,.3); }
#katten button:focus-visible { outline: 3px solid #2F6FB5; }
#katten .bijschrift { position: absolute; left: 50%; bottom: -.35rem; transform: translateX(-50%); font-family: var(--pix); font-size: .7rem; background: var(--tape); color: #F4F1E8; padding: 0 .35rem; border-radius: 3px; white-space: nowrap; }
#katten .lading { position: absolute; right: -.2rem; top: -.2rem; min-width: 1.2rem; height: 1.2rem; padding: 0 .2rem; border-radius: 999px; background: var(--papier); box-shadow: inset 0 0 0 1.5px var(--inkt); font-family: var(--pix); font-size: .7rem; display: grid; place-items: center; }
/* ---- aanraakknoppen */
#stuur { position: absolute; left: 0; bottom: 0; width: 45%; height: 55%; z-index: 12; touch-action: none; }
#stuur .ring { position: absolute; width: 108px; height: 108px; margin: -54px 0 0 -54px; border-radius: 50%; background: rgba(251,246,233,.12); box-shadow: inset 0 0 0 3px rgba(251,246,233,.6); pointer-events: none; }
#stuur .pook { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #FFF3C4, #E9B949 60%, #B98C25); box-shadow: 0 0 0 3px var(--inkt), 0 4px 0 2px rgba(0,0,0,.3); pointer-events: none; }
#knoppen { position: absolute; right: .6rem; bottom: .8rem; z-index: 13; display: grid; grid-template-columns: auto auto auto; gap: .5rem; align-items: end; }
#knoppen button { font-family: var(--pix); font-weight: 700; border: 0; width: 60px; height: 60px; border-radius: 50%; background: var(--papier); color: var(--inkt); font-size: .78rem; touch-action: none; box-shadow: inset 0 0 0 3px var(--inkt), 0 4px 0 rgba(0,0,0,.35); line-height: 1.05; }
#knoppen button.groot { width: 76px; height: 76px; background: var(--rood); color: #FFF6E8; font-size: .9rem; grid-row: span 2; align-self: center; }
#knoppen [data-k="spring"] { grid-column: 3; grid-row: 1 / span 2; }
#knoppen button.aan { transform: translateY(2px); box-shadow: inset 0 0 0 3px var(--inkt), 0 2px 0 rgba(0,0,0,.35); filter: brightness(.94); }
/* ---- meldingen: labeltape */
#meldingen { position: absolute; left: 50%; top: 3.2rem; transform: translateX(-50%); z-index: 22; display: grid; gap: .4rem; justify-items: center; pointer-events: none; width: min(32rem, 92%); }
.melding { background: var(--tape); color: #F4F1E8; padding: .4rem 1rem .45rem; font-family: var(--pix); font-weight: 600; letter-spacing: .02em; box-shadow: 0 3px 0 rgba(0,0,0,.35); text-align: center; clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 50%, 100% 100%, 0 100%, 6px 50%); }
.melding.goud { background: var(--goud); color: var(--inkt); } .melding.rood { background: var(--rood); color: #FFF6E8; } .melding.groen { background: #3D8C6A; color: #FFFFFF; }
@media (prefers-reduced-motion: no-preference) { .melding { animation: inkomen .25s ease-out; } @keyframes inkomen { from { translate: 0 -10px; opacity: 0; } } }
/* titelscherm */
.titelkaart h1 { font-size: clamp(2.6rem, 11vw, 4rem); color: #F2C85A; text-shadow: 3px 0 0 var(--inkt), -3px 0 0 var(--inkt), 0 3px 0 var(--inkt), 0 -3px 0 var(--inkt), 3px 3px 0 var(--inkt), -3px 3px 0 var(--inkt), 3px -3px 0 var(--inkt), -3px -3px 0 var(--inkt), 0 7px 0 var(--rood), 3px 7px 0 var(--rood), -3px 7px 0 var(--rood); margin-bottom: .7rem; }
.titelkaart h1 small { color: var(--blauw); text-shadow: none; margin-top: 1rem; }
.duo { display: flex; gap: .6rem; margin: .4rem 0 .2rem; } .duo canvas { width: 5.6rem; image-rendering: pixelated; border-radius: 50%; background: #E8DCC4; box-shadow: inset 0 0 0 2px var(--inkt); }
.blokje-plek { margin-top: .6rem; }
.kaart.breed .streken { grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); }
@media (max-height: 520px) {
  .kaart { padding: .8rem 1rem .9rem; } .kaart > .rij:last-child { margin: .6rem -1rem -.9rem; padding: .55rem 1rem .7rem; } .rij { margin-top: .55rem; }
  .titelkaart { display: grid; grid-template-columns: 1fr auto; column-gap: 1rem; max-width: 44rem; } .titelkaart > * { grid-column: 1 / -1; } .titelkaart h1 { grid-column: 1; font-size: 2.3rem; margin-bottom: .3rem; } .titelkaart h1 small { margin-top: .6rem; font-size: .9rem; } .titelkaart .duo { grid-column: 2; grid-row: 1; margin: 0; } .titelkaart .duo canvas { width: 3.8rem; }

    J.veelhoek([[X - br - 1, sh + 2], [X - br + 1, sh], [XV - 1, sh], [XV - 1, hp + jl], [X - br - 1 - buik, hp + jl]], jas);
    J.veelhoek([[XV + 1, sh], [X + br - 1, sh], [X + br + 1, sh + 2], [X + br + 1 + buik, hp + jl], [XV + 1, hp + jl]], jas);
    belicht(J, 1);
    J.lijn(XV - 1, sh, XV - 3, sh + 6, tint(jas, -.3)); J.lijn(XV + 1, sh, XV + 3, sh + 6, tint(jas, .2));
    if (!o.labjas) { J.p(XV - 2, sh + 9, '#E9D9A0'); J.p(XV - 2, sh + 12, '#E9D9A0'); } else { J.blok(X - br + 1, sh + 9, X - br + 4, sh + 11, tint(jas, -.12)); J.p(X - br + 2, sh + 8, '#2F6FB5'); }
    rand(J); T.plak(J, 0, 0);
  }
  if (!jas) { T.rij(sh - 1, XV - 3, XV + 2, tint(shirt, -.06)); T.rij(sh, XV - 4, XV + 3, tint(shirt, -.26)); T.p(XV - 4, sh - 1, tint(shirt, -.26)); T.p(XV + 3, sh - 1, tint(shirt, -.26)); }
  if (o.riem && !o.jurk) T.rij(hp - 1, X - br, X + br, o.riem);
  if (o.ketting) { T.lijn(XV - 3, sh, XV, sh + 5, '#E9B949'); T.lijn(XV, sh + 5, XV + 3, sh, '#C99A2E'); T.blok(XV - 1, sh + 5, XV + 1, sh + 7, '#E9B949'); T.p(XV, sh + 6, '#FFF0B0'); }
  if (o.das) { T.blok(XV - 1, sh, XV, sh + 1, o.das); T.lijn(XV - 1, sh + 2, XV - 1, sh + 9, o.das); T.lijn(XV, sh + 2, XV, sh + 9, tint(o.das, -.2)); }
  if (o.strikje) { T.blok(XV - 3, sh, XV + 2, sh + 1, o.strikje); T.p(XV - 1, sh, tint(o.strikje, -.3)); T.p(XV, sh, tint(o.strikje, -.3)); }
  if (o.sjaal) { T.blok(XV - 5, sh - 2, XV + 4, sh + 1, o.sjaal); T.rij(sh - 2, XV - 5, XV + 4, tint(o.sjaal, .2)); T.blok(XV + 2, sh + 1, XV + 4, sh + 8, o.sjaal); T.rij(sh + 8, XV + 2, XV + 4, tint(o.sjaal, -.3)); }
  if (extra.schort || o.schort) {
    const sk = o.schortKleur || '#F2DDA0', lang = zit ? 4 : beenL + 2, S = laag();
    S.veelhoek([[XV - 4, sh + 2], [XV + 4, sh + 2], [XV + 5, hp - 3], [X + br + 1, hp + lang], [X - br - 1, hp + lang], [XV - 5, hp - 3]], sk);
    belicht(S, 1);
    S.rij(Math.round(hp + lang), X - br - 1, X + br + 1, o.id === 'ruben' ? '#C8323C' : tint(sk, -.3));
    S.blok(XV - 2, hp + 2, XV + 2, hp + 5, tint(sk, -.12)); S.rij(hp + 2, XV - 2, XV + 2, tint(sk, -.25));
    S.lijn(XV - 4, sh + 2, XV - 3, sh - 1, tint(sk, -.2)); S.lijn(XV + 4, sh + 2, XV + 3, sh - 1, tint(sk, -.2));
    rand(S); T.plak(S, 0, 0);
    T.rij(hp - 3, X - br, XV - 5, tint(sk, -.2)); T.rij(hp - 3, XV + 5, X + br, tint(sk, -.2));
  }
  rand(T);
  // ---- armen en hoofd. Lopen: de verre arm (rechts) achter het lijf, dan het lijf, het hoofd en de nabije arm (links) ervoor.
  const links = armLaag(X - br - 1, sh + 2, aL[0], aL[1], tint(mouw, lopen ? 0 : -.08));
  const rechts = armLaag(X + br + 1, sh + 2, aR[0], aR[1], lopen ? tint(mouw, -.14) : mouw);
  const uitdr = extra.uitdr || ({ blij: 'blij', zwaai: 'blij', smul: 'smul', schrik: 'schrik', boos: 'boos', eten: fase % 2 ? 'eet' : 'gewoon', denk: 'denk' })[pose] || 'gewoon';
  const Hd = o.hoofd ? o.hoofd(uitdr, knip, D) : persoonHoofd(o, uitdr, knip, D);
  if (lopen) { R.plak(rechts.P, 0, 0); R.plak(T, 0, 0); R.plak(Hd, XV - 15, sh - 26); R.plak(links.P, 0, 0); }
  else {
    const armenBoven = pose === 'blij' || pose === 'schrik' || pose === 'smul';
    R.plak(T, 0, 0);
    if (!armenBoven) R.plak(links.P, 0, 0);
    R.plak(Hd, X - 15, sh - 26);
    if (armenBoven) R.plak(links.P, 0, 0);
    R.plak(rechts.P, 0, 0);
  }
  const uit = { pix: R, hand: rechts.hand, handA: links.hand, voet: [X, zit ? heup + 2 : voetY], zitHoogte: heup, schouder };
  const cv = R.doek(); R.doek = () => cv;
  MENSEN_BUF.set(sleutel, uit);
  return uit;
}

// ===================== DE KATTEN: Moeki en Floortje =====================

// bij het tekenen); de kop is een kwartslag naar de speler gedraaid, zodat je allebei de ogen ziet, en blijft altijd rechtop.

  // Moeki: grijsbruine cyperse kater met zwarte strepen, een M op het voorhoofd, een wit vlekje op de borst, een roze neusje,
  // geelgroene ogen, grote oren, ringen om de staart en een donker puntje. Wat te dik, en een echte slaapkop.

    vacht: '#7F796B', licht: '#A49E8D', buik: '#C7C2B4', streep: '#2C2822', donker: '#57524A', wit: '#EEEDE7', snuit: '#D3CBB8', kopLicht: '#B3A78E',
    oog: '#D0CC7C', oogD: '#9A9446', neus: '#D88F7E', oorIn: '#C9A090', snor: '#F4F1EA',
    L: 6.2, R: 5.4, hang: 2.4, poot: 5.2, pootR: 1.8, dij: 3.4, kopR: 6.4, kopRy: 5.4, oor: 5.8, oorB: 2.7, staartL: 14, staartR: 1.9,
  },
  // Floortje: lapjes-cyperse poes (torbie): donkerbruin en zwart met warme oranje en karamel vlekken, vooral op het gezicht.
  // Groene ogen, lange snorharen, slank en mager, en heel energiek.
  floortje: {
    id: 'floortje', naam: 'Floortje', zaad: 11,
    vacht: '#40342A', licht: '#5C4B3A', buik: '#4C3E31', streep: '#1A1510', donker: '#2C241C', oranje: '#946236', karamel: '#B28B5C', snuit: '#9C8468', kopLicht: '#6E5A46',
    oog: '#9DB45E', oogD: '#66783A', neus: '#7E544C', oorIn: '#9A7466', snor: '#F7F3EB',
    L: 6, R: 4.3, hang: .5, poot: 6.6, pootR: 1.45, dij: 2.8, kopR: 5.8, kopRy: 5, oor: 5.2, oorB: 2.4, staartL: 16, staartR: 1.5,

// ---- een kat in een houding: het skelet. f = beeldje (0..)
// pose: staan, lopen, sluipen, rennen (zoomies), zitten, geeuw, miauw, staartop, liggen (broodje), plof (op de zij), slapen
// (opgerold), duwen, springen, vallen, klimmen, stuiter, schrik, opgetild, krabben, glippen
function katHouding(k, pose, f = 0) {
  const fl = k.id === 'floortje', L = k.L, R = k.R, P = k.poot;
  const ay = -(P + R - 1.4);                       // hoogte van het lijf als de kat staat
  const H = { rot: 0, piv: [0, ay], lijf: [[-L, ay], [L, ay - .4]], R, hang: k.hang, kop: [L + 3.8, ay - R - 1.2],
    ogen: 'open', mond: 'dicht', oren: 0, poten: [], staartFn: null, staart: null, staartVoor: false, puf: 0, snor: 1, vorm: 'gewoon' };
  const voet = (x, op = 0) => [x, -op];
  // poten: [schouder of heup, knie of elleboog, voet]; ver = aan de andere kant (achter het lijf, donkerder)
  const poot = (soort, ver, top, knie, eind, o = {}) => H.poten.push(Object.assign({ soort, ver, top, knie, eind }, o));
  const sx = L - .6, hx = -L + .6;
  const ty = () => H.lijf[0][1] + H.R * .3;
  // de staart: een functie die vanaf de staartwortel een rij punten maakt (de wortel volgt het lijf)
  const staart = fn => { H.staartFn = fn; };
  const laag = (a = .1, b = .8, c = 0) => staart(u => [-u * k.staartL * .82, u * u * k.staartL * a * 3 - Math.sin(u * Math.PI) * 2.2 + Math.sin(u * 3.4 + c) * b * u]);
  const op = (krul = 1, w = 0) => staart(u => [-u * 2.6 + Math.sin(u * 2.4 + w) * 1.2 + (u > .74 ? (u - .74) * 11 * krul : 0), -u * k.staartL * .94]);
  switch (pose) {
    case 'lopen': case 'sluipen': {
      const n = 8, ph = (f % n) / n * Math.PI * 2, s = pose === 'sluipen', zak = s ? 2.4 : 0, stap = s ? 2.4 : 2.2, dein = Math.sin(ph * 2) * .3;
      H.lijf = [[-L, ay + zak + dein], [L, ay - .4 + zak * 1.15 - dein * .6]];
      H.kop = [L + 4 + (s ? 1.2 : 0), ay - R - .8 + zak * 1.7 + Math.sin(ph * 2 + 1) * .3];
      if (s) H.oren = -1;
      const been = (x0, off, ver, voor) => {
        const q = ph + off, dx = Math.cos(q) * stap, lift = Math.max(0, Math.sin(q)) * (fl ? 2.2 : 1.5), xv = ver ? -1 : 0;
        const top = [x0 + xv, ty() + (voor ? .4 : 0)], eind = voet(x0 + dx + xv, lift);
        const knie = voor ? [(top[0] + eind[0]) / 2 - .3 + dx * .15, (top[1] + eind[1]) / 2] : [(top[0] + eind[0]) / 2 + 1.2, (top[1] + eind[1]) / 2 + .3];
        poot(voor ? 'voor' : 'achter', ver, top, knie, eind);
      };
      been(hx, Math.PI, true, false); been(sx, Math.PI * 1.5, true, true); been(hx, 0, false, false); been(sx, Math.PI * .5, false, true);
      if (s) staart(u => [-u * k.staartL * .95, u * 1.6 + Math.sin(u * 3 + ph) * .7]);
      else if (fl) op(1, ph * .5); else laag(.12, .7, ph);
      break;
    }
    case 'rennen': { // galop: om en om gestrekt en gebundeld, de oren plat (zoomies)
      const i = f % 6, s = [1, .55, -.25, -1, -.45, .45][i], h = [3.2, 2.2, .6, 0, .6, 2.2][i], lang = L + s * 1.5;
      H.lijf = [[-lang, ay - h + s * .4], [lang, ay - h - s * .6]];
      H.kop = [lang + 3.6, ay - R - .2 - h - s * .7]; H.oren = -1;
      const y0 = ay - h + R * .3;
      poot('achter', true, [-lang + .6, y0], [-lang - 1.2 - s * 2, -h + 2.6], voet(-lang - s * 5.2 - 1, h * .3 + (s < 0 ? 0 : 1)));
      poot('voor', true, [lang - 1.2, y0], [lang + s * 2.4, -h + 3], voet(lang + s * 6 - 1.2, h * .3 + (s > 0 ? 1.2 : 0)));
      poot('achter', false, [-lang + 1, y0], [-lang - s * 2 + .8, -h + 2.6], voet(-lang - s * 5 + 1, h * .3 + (s < 0 ? 0 : .6)));
      poot('voor', false, [lang - .6, y0], [lang + s * 2.8 + 1, -h + 3.2], voet(lang + s * 6.4 + .4, h * .3 + (s > 0 ? .4 : 0)));
      staart(u => [-u * k.staartL * .9, -u * 2.4 + Math.sin(u * 4 + i) * 1.1]);
      break;
    }
    case 'zitten': case 'geeuw': case 'miauw': case 'staartop': {
      // zitten: de achterhand op de grond, de borst omhoog, de voorpoten recht, de staart om de voetjes
      H.vorm = 'zit'; H.R = R;
      H.lijf = [[-2.2, -R - .2], [1.6, -R * 2.05]];
      H.kop = [3, -R * 2.05 - kopHoogte(k) - .6];
      poot('voor', true, [1.6, -R * 1.5], [2, -3], voet(2.6, 0));
      poot('voor', false, [2.8, -R * 1.45], [3.2, -3], voet(3.8, 0));
      H.achterVoet = [1.6, 0];
      if (pose === 'staartop') op(1.2, f * .6);
      else { H.staartVoor = true; const w = Math.sin(f * .9); H.staart = [[-7, -2.2], [-7.6, -1.2], [-6.6, -.3], [-4, 0], [-1, -.2], [2, -.4], [4.6, -.8], [6.4, -1.6 + w * .4], [7.4, -2.8 + w * .7]]; }
      if (pose === 'geeuw') { // geeuwen: kop omhoog, ogen dicht, bek wijd open
        const g = [0, .5, 1, 1, 1, .6, .2][f % 7]; H.kop[1] -= g * 1.4; H.kop[0] -= g * .5; H.ogen = g > .3 ? 'dicht' : 'half'; H.mond = g > .7 ? 'geeuw' : g > .3 ? 'open' : 'dicht'; H.oren = g > .7 ? -1 : 0;
      }
      if (pose === 'miauw') { H.mond = (f % 4) < 2 ? 'open' : 'dicht'; H.kop[1] -= .5; }
      if (fl && pose === 'zitten') H.oren = [0, 0, 1, 0][f % 4];
      break;
    }
    case 'liggen': { // een broodje: pootjes eronder
      H.vorm = 'brood'; H.R = R * .95; H.hang = 0;
      H.lijf = [[-L + .4, -R * .95], [L - 1, -R * 1.05]];
      H.kop = [L + 3, -R * 1.05 - kopHoogte(k) + 1.6];
      H.pootjes = [[L + 1.6, -.8], [L + .2, -.6]];
      H.staartVoor = true; H.staart = [[-L - .6, -2.4], [-L - 2.6, -1.4], [-L - 2.4, -.3], [-L + 1, 0], [-L + 4.6, 0], [-L + 8, -.2], [-L + 10.4, -.6]];
      H.ogen = (f % 6) < 4 ? 'half' : 'open';
      break;
    }
    case 'plof': { // op de zij: de buik naar de speler, de poten gestrekt, de kop op de grond. f 0..3 is het ploffen zelf
      const s = Math.min(f, 3) / 3;
      H.vorm = s > .5 ? 'zij' : 'gewoon'; H.zij = s; H.hang = k.hang * (1 - s);
      const ly = lerp(ay, -R * .95, s);
      H.lijf = [[-L, ly], [L, ly + lerp(-.4, .2, s)]]; H.R = R + s * .4;
      H.kop = [L + lerp(3.8, 4.4, s), lerp(ay - R - 1.2, -kopHoogte(k) + .8, s)];
      const py = ly + H.R * lerp(.3, .1, s), zw = f >= 4 ? Math.sin(f * .7) * .5 : 0;
      // op de zij met de pootjes in de lucht (de nabije poten over het lijf, de verre erachter)
      poot('achter', true, [hx, py], [hx + lerp(.6, 2, s), lerp(-2.4, ly - 2.6, s)], [lerp(hx, hx + 4.4, s), lerp(0, ly - 3.6 + zw, s)]);
      poot('voor', true, [sx, py], [sx + lerp(0, 1.6, s), lerp(-2.6, ly - 3, s)], [lerp(sx, sx + 3.6, s), lerp(0, ly - 4.6 - zw, s)]);
      poot('achter', false, [hx + .6, py], [hx + lerp(1.6, 3, s), lerp(-2.4, ly - 1.6, s)], [lerp(hx, hx + 6, s), lerp(0, ly - 2.2 - zw, s)]);
      poot('voor', false, [sx, py], [sx + lerp(0, 2.4, s), lerp(-2.6, ly - 2, s)], [lerp(sx, sx + 5, s), lerp(0, ly - 3.4 + zw, s)]);
      staart(u => [-u * k.staartL * .9, lerp(u * 2, (-ly - 1.2) * u, s) + Math.sin(u * 3 + f * .4) * .5 * u]);
      H.ogen = f >= 4 ? ((f % 8) < 6 ? 'half' : 'dicht') : 'open';
      if (f >= 4) H.mond = 'dicht';
      break;
    }
    case 'slapen': { // opgerold als een balletje, de staart om de neus
      const adem = [0, .3, .5, .3][f % 4];
      H.vorm = 'bol'; H.R = R + .6 + adem * .25; H.hang = 0;
      H.lijf = [[-3.4, -H.R], [2.4, -H.R - .2]];
      H.kop = [5, -kopHoogte(k) + 1.4]; H.ogen = 'dicht'; H.oren = 0;
      H.staartVoor = true; H.staart = [[-8.6, -2.6], [-9, -1], [-6.8, 0], [-3, .2], [1, 0], [4.6, -.4], [7.6, -1.2], [9.6, -2.2]];
      H.zzz = true;
      break;
    }
    case 'duwen': { // kop omlaag, met de schouder tegen iets aan, achterpoten zetten af
      const w = [0, .5, 1, .5][f % 4];
      H.lijf = [[-L, ay + .4], [L, ay + 1.6]]; H.kop = [L + 3, ay - R + 2.6 + w * .4]; H.oren = -1; H.ogen = 'half';
      const t = ty();
      poot('achter', true, [hx, t], [hx - 1.6, -2.2], voet(hx - 3.2 - w));
      poot('voor', true, [sx - 1, t + 1], [sx + 1, -2.4], voet(sx + 2.4));
      poot('achter', false, [hx + .6, t], [hx - 1.2, -2.2], voet(hx - 2.6 - w * 1.4));
      poot('voor', false, [sx, t + 1], [sx + 2, -2.4], voet(sx + 3.2));
      laag(.08, .6, f);
      break;
    }
    case 'springen': case 'vallen': { // in de lucht: op = gestrekt omhoog, neer = poten naar voren voor de landing
      const opw = pose === 'springen';
      H.rot = opw ? -.42 : .16; H.piv = [0, ay];
      H.kop = [L + 3.8, ay - R - 1]; H.oren = opw ? 0 : 1;
      const t = ty();
      if (opw) {
        poot('achter', true, [hx, t], [hx - 2.6, t + 3], [hx - 6, t + 4.6]);
        poot('voor', true, [sx, t], [sx + 2.4, t - .6], [sx + 4.4, t + .6]);
        poot('achter', false, [hx + .6, t], [hx - 2, t + 3.4], [hx - 5.2, t + 5.4]);
        poot('voor', false, [sx + .5, t], [sx + 3, t - 1], [sx + 5.2, t]);
        staart(u => [-u * k.staartL * .9, u * 3]);
      } else {
        poot('achter', true, [hx, t], [hx + 1, t + 3], [hx + 2.2, t + 5.2]);
        poot('voor', true, [sx, t], [sx + 2, t + 2.6], [sx + 3, t + 5]);
        poot('achter', false, [hx + .6, t], [hx + 1.8, t + 3], [hx + 2.8, t + 5.4]);
        poot('voor', false, [sx + .5, t], [sx + 2.8, t + 2.6], [sx + 3.8, t + 5.2]);
        staart(u => [-u * k.staartL * .85, -u * 4.2 + Math.sin(u * 3) * 1]);
      }
      break;
    }
    case 'klimmen': { // tegen een gordijn of plant omhoog: het lijf rechtop, de buik naar rechts, de klauwen erin
      const i = f % 4, s = [0, 1, 0, -1][i];
      H.rot = -Math.PI / 2 + .1; H.piv = [0, ay]; H.kop = [L + 2.6, ay - R + 1]; H.oren = 0; H.kopOpzij = 1;
      const t = ty();
      poot('achter', true, [hx, t], [hx + 2, t + 2.4], [hx + 3.6 + s, t + 3.4]);
      poot('voor', true, [sx, t], [sx + 2, t + 1.6], [sx + 3.8 - s, t + 1.8]);
      poot('achter', false, [hx + .6, t - .6], [hx + 2.4, t + 1.8], [hx + 4 - s, t + 2.4]);
      poot('voor', false, [sx + .5, t - .6], [sx + 2.4, t + 1], [sx + 4 + s, t + .8]);
      staart(u => [-u * k.staartL * .85, Math.sin(u * 3 + i) * 1.4 + u * 1.6]);
      break;
    }
    case 'stuiter': { // stuiteren: alle vier de poten stijf, rug bol, staart recht omhoog
      const i = f % 4, h = [0, 4, 6, 3][i];
      H.lijf = [[-L, ay - h + .6], [L, ay - h - .2]]; H.bochel = 1.4; H.kop = [L + 3.6, ay - R - 1.4 - h]; H.oren = 1; H.ogen = 'groot';
      const t = ty();
      for (const [x, ver] of [[hx, true], [sx, true], [hx + .6, false], [sx + .6, false]]) { const xx = x + (ver ? -1 : 0); poot(x < 0 ? 'achter' : 'voor', ver, [xx, t], [xx, -h - P * .4], voet(xx, h)); }
      op(.6, i); H.puf = .4;
      break;
    }
    case 'schrik': { // hoge rug, dikke staart omhoog, oren plat

  const uit = { pix: U, kop: [Math.round(kx), Math.round(ky)], bek: [nx + 1, ny + 3] };
  const cv = U.doek(); U.doek = () => cv;
  KAT_BUF.set(sl, uit);
  return uit;
}

// ===================== PORTRETTEN: Moeki en Floortje groot (titelscherm, kiezen, fotoalbum) =====================
// Recht van voren, kop en schouders, op een doekje van 64 x 60. uitdr: gewoon, blij, slaap, ondeugend, schrik
// Schattig: een ronde kop, grote ronde ogen met lichtpuntjes, een klein neusje, een mondje als een ω en blosjes.
// Herkenbaar aan de vacht: Moeki grijs gestreept met een M, een witte kin en een wit vlekje; Floortje donker met karamel.
function katPortret(k, uitdr = 'gewoon') {
  const W = 64, Hh = 60, fl = k.id === 'floortje', cx = 32;
  const P = new Pix(W, Hh), B = new Pix(W, Hh);
  const ky = 27;                                       // midden van de kop
  const kr = fl ? 16.5 : 18.5, kry = fl ? 14 : 15;     // Moeki: een dikke, brede katerkop
  // ---- vorm: lijf achter de kop, ronde kop met plukjes op de wangen, zachte oren
  B.ovaal(cx, 57, fl ? 15 : 19, 14, k.vacht);
  P.ovaal(cx, ky, kr, kry, k.vacht);
  for (const s of [-1, 1]) { P.ovaal(cx + s * (kr - 2.5), ky + 6, 4, 3.6, k.vacht); P.p(cx + s * (kr + 1.4), ky + 6, k.vacht); P.p(cx + s * (kr + .6), ky + 8, k.vacht); }
  const oorPt = s => {
    const bx = cx + s * (fl ? 9.5 : 11), h = fl ? 12.5 : 16.5, b = fl ? 6.4 : 8, by = ky - kry + 6;
    return [[bx - b, by + (s < 0 ? 1 : -1)], [bx + b, by + (s < 0 ? -1 : 1)], [bx + s * 2.6, by - h]];
  };
  for (const s of [-1, 1]) { const pt = oorPt(s); P.veelhoek(pt, k.vacht); P.ovaal(pt[2][0] - s * .6, pt[2][1] + 2.4, 2, 2, k.vacht); }
  const kopVorm = P.d.slice();
  for (let i = 0; i < B.d.length; i++) if (!P.d[i] && B.d[i]) P.d[i] = B.d[i];
  const vorm = P.d.slice(), binnen = (x, y) => vorm[y * W + x];
  // ---- vacht
  for (let y = 0; y < Hh; y++) for (let x = 0; x < W; x++) {
    if (!binnen(x, y)) continue;
    const dx = x - cx, dy = y - ky, adx = Math.abs(dx), kop = !!kopVorm[y * W + x];
    const fijn = hashf(x, y, fl ? 7 : 3), n = ruis(x * .4, y * .4, fl ? 2 : 5);
    let c = fijn > .93 ? k.licht : k.vacht;
    const snuitje = ((adx - 3.2) / 4.4) ** 2 + ((dy - 9.2) / 3.4) ** 2 < 1 || (dx / 4) ** 2 + ((dy - 12.4) / 2.6) ** 2 < 1; // twee wangkussentjes en een kin
    if (fl) {
      // Floortje: donkerbruin met zachte strepen; karamel op de neusrug, boven de ogen en op de wangen; een licht snuitje
      const st = (y * .7 + adx * .3 + n * 3) % 5; if (st < 1 && (kop ? dy < -6 || adx > 11 : true)) c = k.donker;
      const warm = ruis(x * .45 + 9, y * .45 + 4, 3) + (kop ? .22 * (1 - Math.min(1, Math.hypot(dx, dy + 3) / 15)) : 0);
      if (warm > .8) c = fijn > .4 ? k.karamel : k.oranje; else if (warm > .7 && fijn > .7) c = k.oranje;
      if (kop && adx < 1.6 && dy > -8 && dy < 4) c = fijn > .3 ? k.karamel : k.oranje;          // neusrug
      if (kop && Math.abs(dy + 6.5) < 1.2 && Math.abs(adx - 7) < 3.5) c = k.karamel;           // wenkbrauwtjes
      if (kop && snuitje) c = dy > 11 ? '#B9A58A' : k.snuit; // snuit en kin
    } else {
      // Moeki: grijs met zwarte strepen, de M op het voorhoofd, streepjes op de wangen, witte snuit en kin, wit vlekje op de borst
      if (!kop) {
        const r = (y * .7 + adx * .3 + n * 2.4) % 4.4; if (r < 1.2 && adx > 2) c = k.streep;
        if (Math.hypot(dx * .8, y - 50.5) < 3.4 + ruis(x * .9, y * .9, 8) * 1.6 - .8) c = k.wit;
      } else {
        const fy = dy + 9;  // 0 = net boven de ogen
        if (fy < 0 && fy > -11) {
          for (const lx of [-6, -2, 2, 6]) if (Math.abs(dx - lx - lx * fy * .04) < .8 && fy < (Math.abs(lx) > 4 ? -2 : 0)) c = k.streep; // strepen naar de kruin
          if (fy > -3 && Math.abs(adx - 4 + fy * .9) < .8) c = k.streep;                          // de schuine benen van de M
        }
        if (adx > 12 && Math.abs(dy - (adx - 12) * .45) < .8) c = k.streep;                      // vanaf de ooghoek
        if (adx > 11.5 && Math.abs(dy - 5 - (adx - 11.5) * .3) < .75) c = k.streep;              // wangstreep
        if (snuitje) c = dy > 11 || fijn > .5 ? k.wit : '#E6E0D2'; // snuit en kin
      }
    }
    P.d[y * W + x] = c;
  }
  // binnenkant van de oren: roze, met een paar witte haartjes
  for (const s of [-1, 1]) {
    const [a, b, t] = oorPt(s), m = (u, v, w) => [a[0] * u + b[0] * v + t[0] * w, a[1] * u + b[1] * v + t[1] * w];
    P.veelhoek([m(.7, .18, .12), m(.18, .7, .12), m(.14, .14, .72)], k.oorIn);
    for (let i = 0; i < 4; i++) { const [hx, hy] = m(.44 - i * .05, .44 - i * .05, .12 + i * .1); P.p(hx + (i % 2) * s, hy, '#F2EADF'); }
  }
  // lijf en kop elk een eigen randje
  for (let i = 0; i < P.d.length; i++) if (!kopVorm[i] && P.d[i]) { B.d[i] = P.d[i]; P.d[i] = null; }
  belicht(B, 1); B.omlijn(); belicht(P, 1); P.omlijn();
  const K = P.d.slice(); P.d = B.d; for (let i = 0; i < K.length; i++) if (K[i]) P.d[i] = K[i];
  // ---- ogen: groot en rond, met twee lichtpuntjes
  const OD = '#1A1410', oy = ky + 1, ox = fl ? 7.4 : 8;
  const oog = s => {
    const ex = cx + s * ox;
    if (uitdr === 'blij' || uitdr === 'slaap' || (uitdr === 'ondeugend' && s > 0)) {
      // dicht: blij als boogje (^), slapend als boogje omlaag; ondeugend = knipoog met het rechteroog
      const boog = uitdr === 'slaap' ? [[-3, -1], [-2, 0], [-1, 1], [0, 1], [1, 1], [2, 0], [3, -1]] : [[-3, 1], [-2, 0], [-1, -1], [0, -1], [1, -1], [2, 0], [3, 1]];
      for (const [i, j] of boog) { P.p(ex + i, oy + j, OD); P.p(ex + i, oy + j + (uitdr === 'slaap' ? -1 : 1), Math.abs(i) < 3 ? OD : P.g(ex + i, oy + j + 1)); }
      return;
    }
    const groot = uitdr === 'schrik', rx = 4.4, ry = 5;
    for (let y = -6; y <= 6; y++) for (let x = -5; x <= 5; x++) {
      const a = (x / rx) ** 2 + (y / ry) ** 2; if (a > 1.12) continue;
      if (a > .7) { P.p(ex + x, oy + y, OD); continue; }
      P.p(ex + x, oy + y, y > 2 ? tint(k.oog, .28) : y < -1 ? k.oogD : k.oog);           // onderaan lichter: een glanzend oog
    }
    // pupil: groot en rond (schattig); bij schrik klein
    const pr = groot ? 1.2 : 1.8, pry = groot ? 1.6 : 3.4;
    for (let y = -4; y <= 4; y++) for (let x = -3; x <= 3; x++) if ((x / pr) ** 2 + (y / pry) ** 2 <= 1) P.p(ex + x, oy + y, OD);
    // twee lichtpuntjes
    P.blok(ex + 1, oy - 3, ex + 2, oy - 2, '#FFFFFF'); P.p(ex - 2, oy + 2, '#FFFFFF');
    if (fl) { for (let x = -3; x <= 3; x++) P.p(ex + x, oy - 5, OD); } // Floortje: een zacht ooglid, zoals op de foto
  };
  oog(-1); oog(1);
  // blosjes
  for (const s of [-1, 1]) for (const [a, b] of [[0, 0], [1, 0], [2, 0], [1, -1]]) P.p(cx + s * (ox + 3 + a), oy + 6 + b, fl ? '#B86E62' : '#E8A49A');
  // ---- neusje en mondje (ω)
  const ny = ky + 7, nd = tint(k.neus, -.4);
  P.rij(ny, cx - 2, cx + 2, k.neus); P.rij(ny + 1, cx - 1, cx + 1, k.neus); P.p(cx, ny + 2, nd); P.p(cx - 1, ny, tint(k.neus, .3));
  if (uitdr === 'schrik') { P.ovaal(cx, ny + 5, 1.6, 1.6, '#5A1E26'); P.p(cx, ny + 6, '#E8707A'); }
  else if (uitdr === 'blij') { P.blok(cx - 2, ny + 3, cx + 2, ny + 4, '#5A1E26'); P.rij(ny + 5, cx - 1, cx + 1, '#5A1E26'); P.rij(ny + 4, cx - 1, cx + 1, '#E8707A'); }
  else { P.p(cx - 1, ny + 3, nd); P.p(cx - 2, ny + 3, nd); P.p(cx - 3, ny + 2, nd); P.p(cx + 1, ny + 3, nd); P.p(cx + 2, ny + 3, nd); P.p(cx + 3, ny + 2, nd); }
  if (uitdr === 'ondeugend') { P.p(cx + 2, ny + 4, '#E8707A'); } // tongetje
  // snorharen
  const lang = fl ? 22 : 19;
  for (const s of [-1, 1]) for (const [dy, hoek] of [[0, -.16], [2, .02], [4, .18]]) {
    const x0 = cx + s * (kr - 4), y0 = ny + 1 + dy;
    for (let i = 0; i < lang; i++) { const X = Math.round(x0 + s * i), Y = Math.round(y0 + i * hoek); if (X >= 0 && X < W && !(P.g(X, Y) && i < 3)) P.p(X, Y, i > lang - 5 ? mix(k.snor, '#A8A090', .45) : k.snor); }
  }
  return P;
}

// ===================== HET HUIS: een loft in een oude fabriek, van opzij gezien (een poppenhuis zonder voorkant) =====================
// Witgeverfde bakstenen muren, grote zwarte stalen ramen met uitzicht over de stad, houten balken, een stalen buis langs het
// plafond, betonnen vensterbanken. Alles wordt pixel voor pixel getekend; meubels zijn lagen (Pix) met licht van rechtsboven
// en een donker randje. Licht en donker gaan via een lichtkaart met getrapte schaduw (zie lichtLaag).

const HUISKLEUR = {
  muur: '#ECE8DF', muurL: '#F5F2EB', muurD: '#DCD6CA', voeg: '#CFC8BA', voegD: '#BDB4A4', steen: '#D4B496', steenD: '#BF9C7C', steenL: '#E2C8AE',
  plafond: '#D8D5CE', plafondD: '#C6C2BA', balk: '#8A6644', balkL: '#A8805A', balkD: '#5E4430', ring: '#76563A',
  vloer: '#474A51', vloerL: '#5A5E66', vloerD: '#383A40', doorsnede: '#2A2C34', arcering: '#363944', gevel: '#8C4A34', gevelD: '#6E3826', gevelL: '#A2583E',
  staal: '#1E2126', staalL: '#3E434C', staalD: '#121418', beton: '#B9B5AC', betonL: '#D0CCC3', betonD: '#9A958B',
};
const TAPE = '#23252B';

// ---- de witgeverfde bakstenen muur: stenen van 10 x 5; elke steen net anders wit, met een lichte bovenrand en een schaduwrand
// onder; hier en daar een afgebrokkeld hoekje of een vlek waar de verf dun is en de steen erdoor komt
function muurPixelLoft(x, y) {
  const rij = Math.floor(y / 5), ox = (rij % 2) * 5, bx = Math.floor((x + ox) / 10), lx = (x + ox) % 10, ly = y % 5;
  const dun = ruis(x * .045, y * .065, 21) * .72 + ruis(x * .14, y * .18, 5) * .28;   // waar de verf dun is
  const s = hashf(bx, rij, 4), s2 = hashf(bx, rij, 8);
  const kaal = dun > .8 || (dun > .74 && s > .6);
  if (ly === 4 || lx === 9) return kaal ? '#BFA58A' : (ly === 4 && lx === 9 ? HUISKLEUR.voegD : HUISKLEUR.voeg);
  if (kaal) { if (ly === 0) return HUISKLEUR.steenL; if (ly === 3) return HUISKLEUR.steenD; return s2 > .6 ? HUISKLEUR.steenD : HUISKLEUR.steen; }
  // afgebrokkeld hoekje
  if (s2 > .93 && lx === 0 && ly === 0) return HUISKLEUR.voegD;
  if (s2 > .9 && lx === 8 && ly === 3) return HUISKLEUR.steenD;
  const basis = s > .84 ? HUISKLEUR.muurD : s < .1 ? HUISKLEUR.muurL : HUISKLEUR.muur;
  if (ly === 0) return mix(basis, '#FFFFFF', .35);
  if (ly === 3) return mix(basis, '#B8B0A0', .22);
  if (dun > .68 && hashf(x, y, 2) > .7) return '#E6D8C6';   // een zweem van de steen eronder
  return hashf(x, y, 9) > .95 ? HUISKLEUR.muurL : basis;
}
// een stuk muur vullen (snel, met ImageData)
function vulMuur(ctx, x0, y0, w, h, f = muurPixelLoft) {
  const im = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const c = rgbVan(f(x0 + x, y0 + y)), i = (y * w + x) * 4; im.data[i] = c[0]; im.data[i + 1] = c[1]; im.data[i + 2] = c[2]; im.data[i + 3] = 255; }
  ctx.putImageData(im, x0, y0);
}

// ---- de stad door het raam: lucht met wolken of sterren, grachtenpanden met trapgevels, een kerktoren met een klok,
// bomen, een hijskraan en vogeltjes. nacht = 0 (dag) .. 1 (nacht)
function tekenStad(T, x0, y0, w, h, nacht, t = 0) {
  const ctx = T.ctx; ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  const N = nacht > .5;
  for (let y = 0; y < h; y++) { const u = y / h; T.rect(x0, y0 + y, w, 1, N ? mix('#0C1430', '#2E2D5E', u) : mix('#5E9ED8', '#D8E8F2', u * u)); }
  const r = rng(7);
  if (N) {
    for (let i = 0; i < 60; i++) { const sx = x0 + r() * w, sy = y0 + r() * h * .55; T.px(sx, sy, r() > .75 ? '#FFFFFF' : '#8E9CD0'); }
    const mx = x0 + w * .8, my = y0 + 16; T.gloed(mx, my, 14, '#C8D0F0', .25, 4); T.ovaal(mx, my, 5, 5, '#F2EBC8'); T.ovaal(mx + 2.2, my - 1, 4.4, 4.4, '#0C1430');
  } else {
    T.gloed(x0 + 24, y0 + 10, 26, '#FFF6D8', .5, 5);
    for (let i = 0; i < 5; i++) { const cx = x0 + ((r() * w + t * 3) % (w + 40)) - 20, cy = y0 + 8 + r() * 30, sch = .6 + r() * .6; for (const [dx, dy, rr] of [[0, 0, 7], [7, 1, 6], [-7, 2, 5], [13, 3, 4], [-12, 3, 3]]) { T.ovaal(cx + dx * sch, cy + dy + 1, rr * sch, rr * .55 * sch, '#C8DCEA'); T.ovaal(cx + dx * sch, cy + dy, rr * sch, rr * .55 * sch, '#F8FBFD'); } }
    for (let i = 0; i < 3; i++) { const vx = x0 + ((r() * w + t * 9) % w), vy = y0 + 20 + r() * 20; T.px(vx - 1, vy, '#3A4050'); T.px(vx + 1, vy, '#3A4050'); T.px(vx, vy + 1, '#3A4050'); }
  }
  // de hijskraan in de verte
  const kk = N ? '#262A52' : '#C9A040';
  T.rect(x0 + w * .22, y0 + 18, 2, h * .55, kk); T.rect(x0 + w * .1, y0 + 18, w * .32, 2, kk); T.rect(x0 + w * .34, y0 + 20, 1, 12, kk); T.rect(x0 + w * .34 - 1, y0 + 32, 3, 2, kk);
  for (let i = 0; i < 6; i++) T.lijn(x0 + w * .22, y0 + 20 + i * 8, x0 + w * .22 + 1, y0 + 24 + i * 8, N ? '#1C2044' : '#A88830');
  if (N) T.px(x0 + w * .22, y0 + 16, '#FF5050');
  // drie lagen panden, van ver naar dichtbij: lagere stad met trapgevels en puntdaken, een kerktoren, bomen
  const lagen = N ? [['#1E2448', '#2A3060', 3, .5], ['#161B38', '#20264A', 9, .62], ['#0F1328', '#181C36', 15, .74]]
                  : [['#A4B6C6', '#B8C8D6', 3, .5], ['#8C98A6', '#9EAAB8', 9, .62], ['#6E747E', '#808892', 15, .74]];
  lagen.forEach(([kl, kl2, zaad, basis], li) => {
    const R = rng(zaad); let x = x0 - 4;
    while (x < x0 + w) {
      const bw = 7 + Math.floor(R() * 10), bh = Math.round(h * (1 - basis) + R() * 10 + li * 4), top = y0 + h - bh, soort = R();
      T.rect(x, top, bw, bh, kl); T.rect(x + bw - 1, top, 1, bh, kl2);
      if (soort > .92 && li === 1) { // kerktoren met een klok en een spits
        const tx = x + (bw >> 1) - 3; T.rect(tx, top - 22, 6, 22, kl); T.veelhoek([[tx - 1, top - 22], [tx + 7, top - 22], [tx + 3, top - 38]], kl); T.px(tx + 3, top - 40, kl);
        T.ovaal(tx + 2.5, top - 16, 1.6, 1.6, N ? '#E9C06A' : '#E8E2D0');
      } else if (soort > .55) { // trapgevel
        for (let i = 0; i < 4; i++) T.rect(x + i, top - 2 - i * 2, bw - i * 2, 2, kl);
      } else if (soort > .3) T.veelhoek([[x, top + 1], [x + bw, top + 1], [x + bw / 2, top - bw * .55]], kl);
      // ramen
      for (let wy = top + 3; wy < y0 + h - 3; wy += 5) for (let wx = x + 2; wx < x + bw - 2; wx += 3) {
        const aan = hashf(Math.round(wx), Math.round(wy), zaad);
        if (N) { if (aan > .5) T.rect(wx, wy, 1, 2, aan > .82 ? '#FFE0A0' : '#D99A3E'); }
        else if (aan > .45) T.rect(wx, wy, 1, 2, mix(kl, li === 2 ? '#2A303A' : '#FFFFFF', .28));
      }
      x += bw + (R() > .7 ? 1 : 0);
    }
  });
  // boomkruinen langs de gracht
  const br = rng(31);
  for (let i = 0; i < 6; i++) { const bx = x0 + br() * w, by = y0 + h - 4 - br() * 3; T.ovaal(bx, by, 5 + br() * 3, 4, N ? '#0C1A1E' : '#5E7E4A'); T.ovaal(bx - 1, by - 1, 3, 2, N ? '#12242A' : '#7A9A5A'); }
  ctx.restore();
}

// ---- het grote zwarte stalen raam: smalle T-profielen, een klapraampje met een hendel, een diepe betonnen vensterbank
function tekenRaam(T, x0, y0, w, h, nacht, t) {
  tekenStad(T, x0, y0, w, h, nacht, t);
  const S = HUISKLEUR.staal, SL = HUISKLEUR.staalL, SD = HUISKLEUR.staalD, kol = 3, rijen = 4;
  const kx = i => x0 + Math.round(w * i / kol), ry = j => y0 + Math.round(h * j / rijen);
  // glas: een lichte zweem en schuine glansstrepen per ruit
  if (nacht < .5) for (let i = 0; i < kol; i++) for (let j = 0; j < rijen; j++) { const gx = kx(i) + 3, gy = ry(j) + 3; T.lijn(gx, gy + 5, gx + 5, gy, '#EEF6FB'); T.lijn(gx + 2, gy + 6, gx + 7, gy + 1, '#E2EEF6'); }
  else for (let i = 0; i < kol; i++) for (let j = 0; j < rijen; j++) { const gx = kx(i) + 3, gy = ry(j) + 3; T.lijn(gx, gy + 4, gx + 4, gy, '#2A3258'); }
  // kozijn en roeden
  T.rect(x0 - 4, y0 - 4, w + 8, 4, S); T.rect(x0 - 4, y0 + h, w + 8, 4, S); T.rect(x0 - 4, y0, 4, h, S); T.rect(x0 + w, y0, 4, h, S);
  for (let i = 1; i < kol; i++) { T.rect(kx(i) - 1, y0, 3, h, S); T.rect(kx(i) + 1, y0, 1, h, SL); }
  for (let j = 1; j < rijen; j++) { T.rect(x0, ry(j) - 1, w, 3, S); T.rect(x0, ry(j) - 1, w, 1, SL); }
  T.rect(x0 - 4, y0 - 4, w + 8, 1, SL); T.rect(x0 + w + 3, y0 - 4, 1, h + 8, SD);
  // klapraampje bovenin het middelste vak, met een hendel; en de grendels van de onderste ruiten
  const k1 = kx(1), k2 = kx(2), r1 = ry(1);
  T.rect(k1 + 2, y0 + 2, k2 - k1 - 3, 1, SL); T.rect(k1 + 2, r1 - 3, k2 - k1 - 3, 1, SD);
  T.rect(((k1 + k2) >> 1) - 2, r1 - 4, 5, 2, '#8A8E96'); T.px(((k1 + k2) >> 1) - 2, r1 - 5, '#B8BCC4');
  for (const i of [1, 2]) { T.rect(kx(i) - 3, ry(3) + 6, 2, 5, '#6A6E76'); T.px(kx(i) - 3, ry(3) + 6, '#A8ACB4'); }
  // de vensterbank van beton, met een schaduwrand en kleine putjes

// monstera in een koperen pot: hartvormige bladeren met diepe splitten vanaf de rand en gaatjes langs de nerf

  const blad = (cx, cy, r, a, steel) => {
    const ca = Math.cos(a), sa = Math.sin(a), b = r * .78;
    P.lijn(steel[0], steel[1], cx - ca * r * .9, cy - sa * r * .9, '#3E5E32');
    for (let y = Math.floor(cy - r - 2); y <= cy + r + 2; y++) for (let x = Math.floor(cx - r - 2); x <= cx + r + 2; x++) {
      const dx = x - cx, dy = y - cy, u = (dx * ca + dy * sa) / r, v = (-dx * sa + dy * ca) / b;   // u langs de nerf (-1 steel .. 1 punt)
      const breed = Math.sqrt(Math.max(0, 1 - u * u)) * (1 + .25 * (1 - u)) * (u < -.82 ? Math.min(1, (Math.abs(v) - .06) * 4) : 1); // hartvorm met een inkeping bij de steel
      if (Math.abs(v) > breed) continue;
      const t = Math.abs(v) / Math.max(.01, breed);
      let gat = false;
      for (const uk of [-.58, -.2, .18, .54]) if (t > .38 && Math.abs((u - uk) - (t - .38) * .3) < .07) gat = true;   // splitten
      for (const uk of [-.4, 0, .36]) if (Math.abs(u - uk) < .07 && Math.abs(t - .24) < .09) gat = true;             // gaatjes

// hertshoornvaren in een zwarte hangpot: lange, platte bladen als een gewei, die naar buiten en omlaag buigen en zich aan het
// eind splitsen, grijsgroen en een beetje donzig; bovenop een rond schildblad
function hertshoornPix() {

  const blad = (x, y, a, l, buig, lobben) => {
    for (let i = 0; i < l; i++) { x += Math.cos(a) * .9; y += Math.sin(a) * .9; a += buig; const d = .8 + i / l * 1.8; capsule(P, x, y, x + Math.cos(a), y + Math.sin(a), d, d, G); }
    for (let k = 0; k < lobben; k++) { let b = a + (k - (lobben - 1) / 2) * .46, lx = x, ly = y; for (let i = 0; i < 7; i++) { lx += Math.cos(b) * .9; ly += Math.sin(b) * .9; b += buig * 1.4; const d = 1.4 - i * .12; capsule(P, lx, ly, lx + Math.cos(b), ly + Math.sin(b), d, d, G); } }
  };

// een vloerkleed: Berbers, crème met zwarte ruitjes en franjes (plat op de vloer, iets in perspectief)
function tekenKleed(T, x0, x1, y0, y1) {
  for (let y = y0; y <= y1; y++) { const ins = (y1 - y) * .8, a = Math.round(x0 + ins), b = Math.round(x1 - ins); T.rect(a, y, b - a, 1, '#E8E0D0'); for (let x = a; x < b; x++) { const u = (x - x0) % 10, v = Math.abs(u - 5); if (v === (y - y0) % 5 || v === 5 - (y - y0) % 5) T.px(x, y, '#2A2420'); } }
  for (let x = Math.round(x0); x < x1; x += 2) T.px(x - 1, y1 + 1, '#E8E0D0');
  T.rect(x0, y1, x1 - x0, 1, '#C8BEAA');
}

// ---- licht: een lichtkaart over het hele beeld. Overdag zonlicht door het raam (schuine stralen met stofjes),
// 's avonds donker met warme plekken bij lampen en kaarsjes. Getrapt (in kleine stapjes, met een raster), zoals pixelkunst.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function lichtLaag(ctx, w, h, nacht, bronnen, stralen) {
  const im = ctx.getImageData(0, 0, w, h), d = im.data;
  const amb = nacht ? [.36, .38, .58] : [1, 1, 1];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let r = amb[0], g = amb[1], b = amb[2];
    for (const L of bronnen) { const dx = x - L.x, dy = (y - L.y) * (L.plat || 1), a = 1 - Math.sqrt(dx * dx + dy * dy) / L.r; if (a > 0) { const k = a * a * L.k; r += k * L.c[0]; g += k * L.c[1]; b += k * L.c[2]; } }
    if (stralen) for (const S of stralen) { const u = (x - S.x0 - (y - S.y0) * S.schuin); if (y > S.y0 && y < S.y1 && u > 0 && u < S.w) { const k = S.k * (1 - (y - S.y0) / (S.y1 - S.y0)) * (Math.floor(u / (S.w / 3)) % 1 === 0 ? 1 : 1); r += k; g += k * .92; b += k * .7; } }
    // getrapt naar stapjes van 1/8, met een 4x4-raster
    const drempel = (BAYER[(y & 3) * 4 + (x & 3)] / 16 - .5) / 8, st = v => Math.max(0, Math.round((v + drempel) * 8) / 8);
    const i = (y * w + x) * 4; d[i] = Math.min(255, d[i] * st(r)); d[i + 1] = Math.min(255, d[i + 1] * st(g)); d[i + 2] = Math.min(255, d[i + 2] * st(b));
  }
  ctx.putImageData(im, 0, 0);
}

// ---- zonnestralen overdag: zachte schuine banen licht van het raam naar de vloer, met stofjes die erin zweven
function zonnestralen(ctx, x0, y0, w, y1, schuin, t = 0) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 3; i++) {
    const bx = x0 + i * w / 3 + 3, bw = w / 3 - 6;
    ctx.fillStyle = 'rgba(255, 236, 190, .1)';
    ctx.beginPath(); ctx.moveTo(bx, y0); ctx.lineTo(bx + bw, y0); ctx.lineTo(bx + bw + (y1 - y0) * schuin, y1); ctx.lineTo(bx + (y1 - y0) * schuin, y1); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255, 240, 200, .9)'; const r = rng(5);
  for (let i = 0; i < 26; i++) { const yy = y0 + r() * (y1 - y0), xx = x0 + r() * w + (yy - y0) * schuin + Math.sin(t * .7 + i) * 3; ctx.fillRect(Math.round(xx), Math.round(yy + Math.sin(t * .5 + i * 2) * 2), 1, 1); }
  ctx.restore();
}

// ---- de woonkamer (610 x 214): muur, plafond met balken, buis en hanglampen, raam met radiator, vloer, en de doorsnede
// ===================== HET HUIS IN DOORSNEDE (het menu om een kamer te kiezen) =====================
// Een oude fabriek van rode baksteen, de voorkant weg zodat je in alle kamers kijkt. 420 x 320.
function tekenStadSilhouet(T, x0, y0, w, h, N) {
  const R = rng(17); let x = x0;
  while (x < x0 + w) { const bw = 10 + R() * 18, bh = 30 + R() * 50, top = y0 + h - bh; T.rect(x, top, bw, bh, N ? '#141A38' : '#9AB0C2'); if (R() > .7) T.veelhoek([[x, top], [x + bw, top], [x + bw / 2, top - 10]], N ? '#141A38' : '#9AB0C2'); for (let wy = top + 4; wy < y0 + h; wy += 6) for (let wx = x + 3; wx < x + bw - 2; wx += 4) if (hashf(wx | 0, wy | 0, 4) > (N ? .5 : .7)) T.rect(wx, wy, 2, 2, N ? '#E9B04A' : '#B4C6D4'); x += bw + 2; }

// ===================== HET GEBOUW: een oude fabriek met een witte betonnen gevel =====================
// Rijen grote zwarte stalen ramen (4 x 4 ruitjes) in een wit betonnen raster, een blauwe rand langs het dak, een glazen
// opbouw op het dak met lichtjes, en ervoor een laag glazen paviljoen met een groen dak (een bioscoop). Geen echte namen of
// logo's: op het dak staat een lichtreclame met HUIS OP STELTEN en een kattenkopje.
const GEBOUW = { W: 420, H: 320, VAK: 24, VERDIEP: 22, STRAAT: 300, PLINT: 30, VERDIEPINGEN: 9 };
const BETON = { licht: '#EFECE5', mid: '#E2DED5', schaduw: '#CBC6BB', donker: '#B4AEA2', rand: '#3E66A8' };

// een stuk gevel: x0..x1, van y0 (bovenkant) tot y1, met ramen per vak. raam(i, j) mag een raam zelf invullen.
function tekenGevel(T, x0, y0, x1, y1, N, opties = {}) {
  const { VAK, VERDIEP } = GEBOUW, zaad = opties.zaad || 1, kl = N ? { licht: '#9C9CB4', mid: '#8C8CA6', schaduw: '#76768E', donker: '#62627A' } : BETON;
  T.rect(x0, y0, x1 - x0, y1 - y0, kl.mid);
  const vakken = Math.ceil((x1 - x0) / VAK), rijen = Math.floor((y1 - y0) / VERDIEP);
  for (let j = 0; j < rijen; j++) {
    const fy = y0 + j * VERDIEP;
    T.rect(x0, fy, x1 - x0, 1, kl.licht); T.rect(x0, fy + VERDIEP - 1, x1 - x0, 1, kl.schaduw); // vloerband
    for (let i = 0; i < vakken; i++) {
      const bx = x0 + i * VAK;
      T.rect(bx, fy + 1, 1, VERDIEP - 2, kl.licht); T.rect(bx + VAK - 1, fy + 1, 1, VERDIEP - 2, kl.schaduw); // kolommen
      if (opties.raam && opties.raam(i, j, bx + 4, fy + 2)) continue;
      raamVak(T, bx + 4, fy + 2, N, hashf(i, j, zaad), opties);
    }
  }
  // vlekjes en strepen van de regen onder de ramen
  for (let k = 0; k < (x1 - x0) * (y1 - y0) / 90; k++) { const x = x0 + hashf(k, 1, zaad) * (x1 - x0), y = y0 + hashf(k, 2, zaad) * (y1 - y0); T.px(x, y, kl.schaduw); }
}

  const aan = N && h > .6;
  for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) {
    const px = x + a * 3 + 1, py = y + b * 3 + 1;
    let c;
    if (N) c = aan ? (b < 1 && h > .86 ? '#F6E2A8' : mix('#F0C870', '#E0A048', hashf(a, b, h * 99) * .45)) : h > .4 ? '#262A46' : '#181C34';
    else c = mix('#D2E2EE', '#7A94AC', (b + hashf(a, b, h * 77) * .9) / 4.3);
    T.rect(px, py, 2, 2, c);
    if (!N && (a + b) % 3 === 0) T.px(px, py, '#F0F7FB');

  T.rect(0, DAK - 4, W, 4, BETON.rand); T.rect(0, DAK - 4, W, 1, '#5A84C4');

  T.rect(X0 - 6, bg[1], X1 - X0 + 12, 4, '#CFCAC0');

  // de ramen in de buitenmuur zie je in doorsnede: een zwart stalen kozijn

  // trappen van zwart staal

// het platform waar iets op staat (op hoogte y, op plek x); de vloer als er niets anders is
function platformOnder(S, x, yBoven, yOnder, negeer) {
  let best = null;
  for (const p of S.platforms) { if (p.id === negeer) continue; if (x < p.x0 - 1 || x > p.x1 + 1) continue; if (p.y >= yBoven - .01 && p.y <= yOnder + .01 && (!best || p.y < best.y)) best = p; }

// ---- het scherm op het bureau: Rommelblok als Ruben werkt, het videogesprek, of jjjjjjjj als Moeki op het toetsenbord ligt

// ---- beeld: een klein doek, met een heel getal vergroot (in het spel); menu's passen het hele plaatje in
const BEELD = { S: 1, W: 320, H: 214, dpr: 1, staand: false };
function maat() {
  const r = VELD.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const dw = Math.max(1, Math.round(r.width * dpr)), dh = Math.max(1, Math.round(r.height * dpr));
  if (SCENE.vast) { // een plaatje van vaste maat (titel, huis): zo groot mogelijk, liefst met een heel getal
    // liefst een heel getal; kost dat meer dan een vijfde van de grootte, dan mag het ook een gebroken getal zijn
    const [w, h] = SCENE.vast, onder = (SCENE.onder || 0) * dpr, f = Math.min(dw / w, Math.max(40, dh - onder) / h), s = f >= 1 && Math.floor(f) >= f * .8 ? Math.floor(f) : f;

    const cw = w * s / dpr, ch = h * s / dpr; DOEK.style.width = cw + 'px'; DOEK.style.height = ch + 'px'; DOEK.style.left = ((r.width - cw) / 2) + 'px'; DOEK.style.top = Math.max(0, (r.height - (SCENE.onder || 0) - ch) / 2) + 'px';
  } else {

    DOEK.style.width = (BEELD.W * S / dpr) + 'px'; DOEK.style.height = (BEELD.H * S / dpr) + 'px'; DOEK.style.left = '0px'; DOEK.style.top = '0px';

  if (aan) h[sl] = 1; else delete h[sl];

      if (!reduce && st.animate) st.animate([{ transform: 'rotate(var(--r)) scale(1)' }, { transform: 'rotate(360deg) scale(1.4)', offset: .5 }, { transform: 'rotate(720deg) scale(1)' }], { duration: 1200, easing: 'ease-in-out' });
      const b = document.createElement('div'); b.className = 'gr-ballon'; b.textContent = 'Oké, oké! Je mag me hebben.'; const r = st.getBoundingClientRect(); b.style.left = (r.left + scrollX - 40) + 'px'; b.style.top = (r.bottom + scrollY + 6) + 'px'; document.body.appendChild(b); setTimeout(() => b.remove(), 2800);
    }
    const ham = e.target.closest && e.target.closest('.gs-hamer, .tg-rommel[aria-label="Geef de dobbelsteen een zetje"]'); // vroeger de hamer, nu het rommeltje dobbelsteen
    if (ham && tel('hamer', 6, 3500)) {
      vind('duim'); toon(110, 0, 0.3, 'square', 0.06); toon(90, 0.08, 0.3, 'square', 0.05);
      if (!reduce) document.body.style.animation = 'gr-schud .5s'; setTimeout(() => { document.body.style.animation = ''; }, 520);
      grootWoord('Au!');
    }
    const ver = e.target.closest && e.target.closest('.versie');
    if (ver && tel('versie', 5, 3000)) {
      vind('bouwplaats');
      boek.innerHTML = `<h2>De geheime bouwplaats</h2><p>Welkom achter de schermen van het rommelhoekje. Een paar eerlijke cijfers:</p><ul><li>Vlaaien gegeten tijdens het bouwen: 37</li><li>Kopjes koffie: veel te veel</li><li>Keren dat Harrie zijn sok kwijt was: 15</li><li>Rommeltjes die een zetje kregen: ${Math.floor(Date.now() / 86400000) % 900 + 120}</li><li>Rommelbeesten die op een theepot lijken: 2</li></ul><button type="button">Terug naar de voorkant</button>`;
      boek.querySelector('button').addEventListener('click', () => boek.close()); boek.showModal();
    }
  });

  // ---------- alleen op de homepage: het muisje, de nachtuil en de elfde van de elfde
  function homepage() {
    if (!opHome) return;
    const main = document.querySelector('main') || document.body;
    // muizengat onder aan de pagina
    const gat = document.createElement('div'); gat.className = 'gr-gat'; gat.setAttribute('aria-label', 'Een muizengaatje'); gat.setAttribute('role', 'button'); gat.tabIndex = 0;
    gat.innerHTML = '<svg class="gr-muis" viewBox="0 0 22 14" aria-hidden="true"><ellipse cx="11" cy="10" rx="9" ry="6" fill="#9AA0A6"/><circle cx="5" cy="5" r="3" fill="#C9CED6"/><circle cx="17" cy="5" r="3" fill="#C9CED6"/><circle cx="8" cy="9" r="1.2" fill="#1F2333"/><circle cx="14" cy="9" r="1.2" fill="#1F2333"/><circle cx="11" cy="12" r="1.3" fill="#E8577A"/></svg>';
    const zetGat = () => { const voet = document.querySelector('footer') || main; const r = voet.getBoundingClientRect(); gat.style.left = Math.max(10, r.right + scrollX - 70) + 'px'; gat.style.top = (r.top + scrollY - 20) + 'px'; };
    document.body.appendChild(gat); zetGat(); addEventListener('resize', zetGat); setTimeout(zetGat, 1500);
    let uit = false;
    const kijk = () => { uit = true; gat.classList.add('uit'); setTimeout(() => { uit = false; gat.classList.remove('uit'); }, 2600); setTimeout(kijk, 9000 + Math.random() * 12000); };
    setTimeout(kijk, 5000 + Math.random() * 6000);
    const pak = () => { if (!uit) return; vind('muis'); toon(2200, 0, 0.08, 'sine', 0.05); toon(2600, 0.08, 0.08, 'sine', 0.05); gat.classList.remove('uit'); uit = false; const b = document.createElement('div'); b.className = 'gr-ballon'; b.textContent = 'Piep!'; b.style.left = (parseFloat(gat.style.left) - 40) + 'px'; b.style.top = (parseFloat(gat.style.top) - 30) + 'px'; document.body.appendChild(b); setTimeout(() => b.remove(), 2000); };
    gat.addEventListener('click', pak); gat.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') pak(); });
    // nachtuil tussen middernacht en vijf uur
    const uur = new Date().getHours();
    if (uur < 5) {
      const uil = document.createElement('div'); uil.className = 'gr-uil'; uil.setAttribute('role', 'button'); uil.tabIndex = 0; uil.setAttribute('aria-label', 'Een uil');
      uil.innerHTML = '<svg viewBox="0 0 56 64" aria-hidden="true"><path d="M8 20l6-14 8 10h12l8-10 6 14v26q0 14-20 14T8 46z" fill="#8C6A44" stroke="#3A2414" stroke-width="2.5"/><ellipse cx="28" cy="46" rx="12" ry="11" fill="#E8D5A8"/><circle cx="19" cy="27" r="8" fill="#FBF6E9" stroke="#3A2414" stroke-width="2"/><circle cx="37" cy="27" r="8" fill="#FBF6E9" stroke="#3A2414" stroke-width="2"/><circle cx="20" cy="28" r="4" fill="#1F2333"/><circle cx="36" cy="28" r="4" fill="#1F2333"/><path d="M25 34l3 5 3-5z" fill="#E9B949"/><path d="M20 58v4M36 58v4" stroke="#E9B949" stroke-width="3"/></svg>';
      const held = document.querySelector('.held') || main; const r = held.getBoundingClientRect(); uil.style.left = (r.left + scrollX + Math.min(r.width - 70, 460)) + 'px'; uil.style.top = (r.top + scrollY + 150) + 'px';
      document.body.appendChild(uil);
      const oehoe = () => { vind('uil'); toon(392, 0, 0.35, 'sine', 0.06); toon(330, 0.4, 0.5, 'sine', 0.06); const b = document.createElement('div'); b.className = 'gr-ballon'; b.textContent = 'Oehoe! Jij bent ook laat op, hè?'; b.style.left = (parseFloat(uil.style.left) - 60) + 'px'; b.style.top = (parseFloat(uil.style.top) - 34) + 'px'; document.body.appendChild(b); setTimeout(() => b.remove(), 3000); };
      uil.addEventListener('click', oehoe); uil.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') oehoe(); });
    }
    // de elfde van de elfde: vlaggetjes in rood, geel en groen
    const d = new Date();
    if (d.getMonth() === 10 && d.getDate() === 11) {
      const v = document.createElement('div'); v.className = 'gr-vlaggen';
      let svg = '<svg width="100%" height="34" preserveAspectRatio="none" viewBox="0 0 1000 34" aria-hidden="true"><path d="M0 4Q500 22 1000 4" stroke="#F2DDA0" stroke-width="2" fill="none"/>';
      for (let i = 0; i < 40; i++) { const x = i * 25 + 5, y = 4 + Math.sin(Math.PI * x / 1000) * 14; svg += `<path d="M${x} ${y.toFixed(1)}l14 0l-7 16z" fill="${['#C8323C', '#F6CB2F', '#2E8B62'][i % 3]}"/>`; }
      v.innerHTML = svg + '</svg>'; document.body.appendChild(v);
      setTimeout(() => { grootWoord('Alaaf!'); vind('elfelf'); }, 1200);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', homepage); else homepage();

  // ---------- voor wie in de console kijkt
  try { console.log('%cHé, nieuwsgierig aagje!', 'font: 800 20px sans-serif; color: #C8323C'); console.log('%cHier valt niks te zien. Of toch wel?', 'font: 600 13px sans-serif; color: #2F4C8F'); } catch (e) {}
  window.Grapjes = true;
})();
