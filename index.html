<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn website</title>
  <style>
    :root {
      --bg: #EAF0EC;
      --ink: #16302A;
      --soft: #4D6660;
      --accent: #0E7C66;
      --line: #C5D4CD;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12201C;
        --ink: #E4EEEA;
        --soft: #A3B8B1;
        --accent: #5CC9AE;
        --line: #2C3F39;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding: 18vh 1.5rem 3rem;
    }
    h1 {
      font-size: clamp(2.75rem, 9vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.03em;
      font-weight: 700;
      margin: 0 0 1.5rem;
    }
    .intro {
      font-size: 1.25rem;
      color: var(--soft);
      max-width: 32rem;
      margin: 0 0 3rem;
    }
    h2 {
      font-size: 1.1rem;
      margin: 0 0 0.75rem;
    }
    .leeg {
      border: 2px dashed var(--line);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      color: var(--soft);
      margin: 0;
    }
    footer {
      max-width: 44rem;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: var(--soft);
      border-top: 1px solid var(--line);
    }
    .versie { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Mijn website</h1>
    <p class="intro">Deze pagina staat live op internet. Hier komen binnenkort mijn eigen tools en projecten.</p>
    <h2>Mijn tools</h2>
    <p class="leeg">Nog geen tools. De eerste komt eraan.</p>
  </main>
  <footer>
    <span class="versie">Versie 1</span>
  </footer>
</body>
</html>
