<style>

*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; background: #0B1C2C; color: var(--inkt); font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-tap-highlight-color: transparent; }
.kop { display: flex; align-items: center; gap: .7rem; padding: .4rem .8rem; background: var(--nacht); color: var(--papier); z-index: 5; flex: none; }

/* ===== de interface: een havenlogboek met pixelranden, labeltape en koperen instrumenten ===== */
:root { --pix: "Pixelify Sans", "Bricolage Grotesque", system-ui, sans-serif; --inktrand: #1A1420; --koper: #C9A040; --koperlicht: #F0D27A; --marine: #14233A; --marine2: #1C3150; --tape: #23252B; }

.knop.hoofd { background: var(--rood); color: #fff; } .knop.goud { background: var(--goud); } .knop[aria-pressed="false"] { opacity: .6; } .knop:disabled { opacity: .45; cursor: default; }

.pixhoek { clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 2px 4px, 2px 2px, 4px 2px); }

#veld .knop { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 1rem; letter-spacing: .01em; border-radius: 0; padding: .5rem .95rem .6rem; background: #FBF4E2; color: var(--inkt); border: 3px solid var(--inktrand); box-shadow: inset 0 -4px 0 rgba(60,40,30,.22), inset 0 3px 0 rgba(255,255,255,.7); transition: transform .06s; }

#veld .knop.hoofd { background: #C8323C; color: #FFF6E8; box-shadow: inset 0 -4px 0 #8E1F2A, inset 0 3px 0 #E8606A; text-shadow: 0 2px 0 #7A1A24; }
#veld .knop.goud { background: #E9B949; color: #2A1E10; box-shadow: inset 0 -4px 0 #B98C25, inset 0 3px 0 #FFE29A; }
#veld .knop:disabled { opacity: .5; filter: grayscale(.5); }
#veld .knop:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #FFFFFF, inset 0 0 0 6px #2F6FB5; }
.kop .knop:focus-visible { outline: 3px solid #2F6FB5; outline-offset: 2px; }
#veld { position: relative; flex: 1; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: #06121E; }
#doek { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
#zwart { position: absolute; inset: 0; background: #06121E; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 19; } /* onder de vensters (20) en gesprekken (25): die zijn altijd te zien */
#zwart.aan { opacity: 1; }
/* ---- kaarten: papier in een inktrand, met een koperen lijntje en de kop op labeltape */
.scherm { position: absolute; inset: 0; display: grid; place-items: center; padding: .8rem; z-index: 20; background: radial-gradient(ellipse at center, rgba(6,18,30,.35), rgba(6,18,30,.72)); overflow: auto; }
.kaart { --kx: 1.35rem; --kb: 1.2rem; position: relative; max-width: 34rem; width: 100%; max-height: calc(100% - .5rem); overflow: auto; padding: 1.25rem var(--kx) var(--kb); color: var(--inkt);
  background: #FBF4E2 repeating-linear-gradient(0deg, transparent 0 23px, rgba(47,76,143,.07) 23px 24px);
  border: 4px solid var(--inktrand); border-bottom-width: 9px;
  box-shadow: inset 0 0 0 3px #FFFBF0, inset 0 0 0 5px var(--koper), inset 0 0 0 7px #FBF4E2; }
.kaart.breed { max-width: 46rem; }

.kaart h2:not([style]) { display: inline-block; margin: 0 0 .7rem; padding: .2rem .7rem .25rem; font-family: var(--pix); font-weight: 600; font-size: 1.3rem; letter-spacing: .04em; color: #F4F1E8; background: var(--tape); transform: rotate(-1deg); box-shadow: 0 2px 0 rgba(0,0,0,.25); clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 50%, 100% 100%, 0 100%, 5px 50%); text-shadow: 0 -1px 0 #000; }
.kaart h3 { margin: .9rem 0 .3rem; font-family: var(--pix); font-weight: 600; font-size: 1.05rem; color: #2F4C8F; } .kaart p { margin: .45rem 0; line-height: 1.5; }
.rij { display: flex; gap: .55rem; flex-wrap: wrap; margin-top: .9rem; } .rij .knop { font-size: 1.05rem; }
/* de knoppen onderaan een venster blijven altijd in beeld, ook als het venster moet scrollen (liggende telefoon) */
.kaart > .rij:last-child { position: sticky; z-index: 1; bottom: calc(7px - var(--kb)); margin: .9rem calc(7px - var(--kx)) calc(7px - var(--kb)); padding: .7rem calc(var(--kx) - 7px) calc(var(--kb) - 7px); background: linear-gradient(rgba(251,244,226,0), #FBF4E2 .6rem); }
.klein { font-size: .87rem; color: #5E5040; }
.lijst { display: grid; gap: .45rem; margin: .55rem 0; }
.regel { display: flex; align-items: center; gap: .65rem; background: #FFFDF6; padding: .5rem .7rem; box-shadow: inset 0 0 0 2px #3A2E3A, inset 0 -4px 0 2px #E9DFC6; }
.regel canvas, .tegel canvas { image-rendering: pixelated; flex: none; }
.regel .naam { font-weight: 800; } .regel .meer { margin-left: auto; text-align: right; font-weight: 700; white-space: nowrap; font-family: var(--pix); }
.regel.kies { cursor: pointer; transition: transform .06s; } .regel.kies:hover { background: #FFF6DE; } .regel.kies:active { transform: translateY(1px); }
.regel.kies[aria-pressed="true"] { background: #FFE9A8; box-shadow: inset 0 0 0 3px var(--inktrand), inset 0 -4px 0 3px #E9B949; }
.regel.kies[aria-pressed="true"] .naam::before { content: "✓ "; color: #2E6A2E; }
.regel.kies:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #2F6FB5, inset 0 -4px 0 3px #9FC4E8; }
.regel.uit { opacity: .55; filter: grayscale(.4); }
.tegels { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.2rem, 1fr)); gap: .5rem; margin: .5rem 0; }
.tegel { background: #FFFDF6; padding: .55rem; text-align: center; font-size: .85rem; box-shadow: inset 0 0 0 2px #3A2E3A, inset 0 -4px 0 2px #E9DFC6; }
.tegel b { display: block; } .tegel.onbekend { opacity: .55; }
.geld { font-weight: 800; color: #2E6A2E; }
.tabs { display: flex; gap: .25rem; flex-wrap: wrap; margin: .2rem 0 .7rem; border-bottom: 3px solid var(--inktrand); padding-bottom: 0; }
.tabs button { font-family: var(--pix); font-weight: 600; font-size: .98rem; border: 0; padding: .4rem .85rem .35rem; background: #EDE2C6; color: #4A3E30; cursor: pointer; box-shadow: inset 0 0 0 2px #3A2E3A; clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%, 0 4px); }
.tabs button[aria-selected="true"] { background: var(--marine); color: #F4E2B0; box-shadow: inset 0 0 0 2px var(--inktrand), inset 0 3px 0 2px #2E4A6E; }
.tabs button:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #2F6FB5; }
.sterren { color: #C99A2E; font-size: 1.6rem; letter-spacing: .08em; text-shadow: 0 2px 0 #7A5A1A; }
.stempel { display: inline-block; transform: rotate(-6deg); border: 3px solid var(--rood); color: var(--rood); font-family: var(--pix); font-weight: 700; padding: .1rem .55rem; letter-spacing: .08em; box-shadow: inset 0 0 0 2px rgba(200,50,60,.25); }
/* titelscherm */
.kaart.titelkaart { text-align: left; max-width: 36rem; }
.kaart.titelkaart h1 { font-size: clamp(2.6rem, 10vw, 4rem); color: #F2C85A; text-shadow: 3px 0 0 #1A1420, -3px 0 0 #1A1420, 0 3px 0 #1A1420, 0 -3px 0 #1A1420, 3px 3px 0 #1A1420, -3px 3px 0 #1A1420, 3px -3px 0 #1A1420, -3px -3px 0 #1A1420, 0 7px 0 #2F4C8F, 3px 7px 0 #2F4C8F, -3px 7px 0 #2F4C8F; margin-bottom: .6rem; }
.kaart.titelkaart h1 small { color: #2F4C8F; text-shadow: none; margin-top: .9rem; }
/* ---- gesprek: patrijspoort met het portret, de naam op labeltape */
#gesprek { position: absolute; left: 50%; bottom: .7rem; transform: translateX(-50%); width: min(46rem, calc(100% - 1rem)); z-index: 25; display: flex; gap: .9rem; align-items: center; padding: .85rem 1rem .85rem .85rem; cursor: pointer;
  background: #FBF4E2; border: 4px solid var(--inktrand); border-bottom-width: 8px; box-shadow: inset 0 0 0 3px #FFFBF0, inset 0 0 0 5px var(--koper); }

/* ---- HUD: koperen instrumentplaatjes met pixel-iconen */

.hud-blok span, .regel .meer, .bon, .geld { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud-blok small { font-family: var(--pix); }
.hud-blok small { display: block; font-weight: 500; font-size: .8rem; color: #F0D27A; letter-spacing: .04em; margin-bottom: .1rem; }
.hud-blok .ik { width: 26px; height: 26px; flex: none; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.zuurstof { width: min(16rem, 46vw); } .zuurstof > div { flex: 1; }
.balk { height: .72rem; background: #0A1424; overflow: hidden; margin-top: .25rem; box-shadow: inset 0 0 0 2px #050A12; padding: 2px; }

/* ---- aanraakbediening: koperen knoppen */
#stuur { position: absolute; left: 0; bottom: 0; width: 50%; height: 60%; z-index: 12; touch-action: none; }

// ===================== RUBEN (klein hoofd voor in het duikpak) =====================
// het hoofd in driekwart, naar rechts kijkend: kuif die naar achteren zwiept, pilotenbril, snorretje, sikje
// uitdr: 'gewoon', 'blij', 'schrik', 'denk'; knip: ogen dicht
function rubenHoofd(uitdr = 'gewoon', knip = false) {
  const R = new Pix(22, 20);
  // haar: achterhoofd, kruin en kuif voorop
  R.ovaal(9.5, 6, 7, 5.2, 'H');
  R.ovaal(14, 3.6, 4.6, 3, 'H');
  R.blok(3, 5, 7, 12, 'H');
  // gezicht
  const gez = { 5: [11, 16], 6: [9, 17], 7: [8, 17], 8: [8, 17], 9: [8, 17], 10: [8, 18], 11: [8, 17], 12: [8, 17], 13: [9, 17], 14: [9, 17], 15: [10, 16], 16: [11, 16], 17: [12, 15] };
  for (const [y, [a, b]] of Object.entries(gez)) R.rij(+y, a, b, 'S');
  // oor
  R.blok(5, 9, 7, 12, 'S'); R.p(5, 9, 'H'); R.p(6, 10, 'r'); R.p(6, 11, 'r'); R.p(7, 12, 's');
  // nek
  R.blok(8, 15, 11, 19, 'S'); R.rij(18, 8, 11, 's'); R.rij(19, 8, 11, 's'); R.p(11, 16, 's'); R.p(11, 17, 's');
  R.omlijn();
  // haarlokken: zwiep van voorboven naar achteren
  for (const [x, y] of [[16, 1], [15, 1], [14, 1], [13, 2], [12, 2], [11, 3], [10, 3], [9, 4], [8, 4], [7, 5], [6, 6], [5, 7], [17, 3], [16, 3], [15, 4], [14, 4], [13, 5], [12, 5], [4, 9], [4, 10]]) R.p(x, y, 'h');
  for (const [x, y] of [[13, 1], [12, 1], [11, 2], [10, 2], [16, 2], [15, 2], [9, 3]]) R.p(x, y, 'j');
  R.p(17, 5, 'H'); R.p(17, 6, 'h'); R.p(16, 5, 'h'); // kuif valt iets over het voorhoofd
  R.p(8, 6, 'H'); R.p(8, 7, 'H'); R.p(8, 8, 'h'); // bakkebaard
  // schaduw onder de kaak en achterkant van het gezicht
  R.p(9, 13, 's'); R.p(9, 14, 's'); R.p(10, 15, 's'); R.p(8, 11, 's'); R.p(8, 12, 's');
  // wenkbrauwen
  R.rij(6, 10, 12, 'B'); R.rij(6, 15, 16, 'B'); if (uitdr === 'schrik') { R.rij(5, 10, 12, 'B'); R.rij(6, 10, 12, 'S'); R.rij(5, 15, 16, 'B'); R.rij(6, 15, 16, 'S'); }
  // bril: bovenbalk, groot glas dichtbij, smaller glas verderop, pootje naar het oor
  R.rij(7, 9, 17, 'G'); R.p(12, 7, 'g'); R.p(13, 7, 'g');
  R.lijn(8, 8, 6, 9, 'G');
  for (const y of [8, 9, 10]) { R.p(9, y, 'G'); R.rij(y, 10, 12, 'L'); R.p(13, y, 'G'); R.rij(y, 15, 16, 'L'); R.p(17, y, 'G'); }

// ---- een vis uit een paar getallen; beeldje 0-3 = staartslag
function visPix(o, beeld = 0) {
  const L = o.len, H = o.h, R = new Pix(L + 12, H * 2 + 10), kl = o.kl;
  const cy = H + 4, sx = 8, buig = [-1, 0, 1, 0][beeld % 4];
  const prof = t => Math.pow(Math.sin(Math.PI * Math.pow(klem(t, 0, 1), o.kop || .8)), .7);
  const dy = x => Math.round(buig * Math.max(0, .45 - x / L) / .45 * 1.6);
  // staart
  const st = o.staart || 'vork', ty = buig * 2;
  for (let i = 0; i <= 6; i++) {
    let hw = st === 'vork' ? (i < 2 ? 1 + i * .6 : 2 + i * .75) : st === 'rond' ? 1.2 + Math.sin(i / 6 * Math.PI) * 2.4 + i * .3 : st === 'haai' ? 1 + i * .4 : 1 + i * .6;
    for (let y = -Math.round(hw); y <= Math.round(hw * (st === 'haai' ? .4 : 1)); y++) {
      if (st === 'vork' && i > 3 && Math.abs(y) < (i - 3) * 1.1) continue;
      R.p(sx - i + 1, cy + y + Math.round(ty * i / 6) + (st === 'haai' ? -Math.round(i * .4) : 0), kl.v);
    }
  }
  // lijf met tegenkleuring
  for (let x = 0; x < L; x++) {
    const t = x / (L - 1), hw = Math.max(1, prof(t) * H), d = dy(x);
    for (let y = -Math.round(hw); y <= Math.round(hw * (o.buik || 1)); y++) R.p(sx + x, cy + y + d, y < -hw * .2 ? kl.R : y > hw * .4 ? kl.U : kl.M);
  }
  // rugvin en buikvin
  if (o.rugvin !== false) for (let x = Math.round(L * .32); x < Math.round(L * .62); x++) { const hw = prof(x / (L - 1)) * H; R.p(sx + x, cy - Math.round(hw) - 1 + dy(x), kl.v); if (x % 2 === 0 && x < L * .55) R.p(sx + x, cy - Math.round(hw) - 2 + dy(x), kl.v); }
  for (let x = Math.round(L * .4); x < Math.round(L * .52); x++) { const hw = prof(x / (L - 1)) * H; R.p(sx + x, cy + Math.round(hw * (o.buik || 1)) + 1 + dy(x), kl.v); }
  // patroon
  if (o.patroon === 'strepen') for (let x = 4; x < L - 5; x++) for (let y = -H; y < 0; y++) if (R.g(sx + x, cy + y + dy(x)) === kl.R && ((x + y * 1.5) % 5 + 5) % 5 < 1.6) R.p(sx + x, cy + y + dy(x), kl.D);
  if (o.patroon === 'vlekken') for (let x = 3; x < L - 4; x += 3) for (let y = -H; y <= H; y += 3) { const px = sx + x + (y & 1), v = R.g(px, cy + y + dy(x)); if (v === kl.R || v === kl.M) R.p(px, cy + y + dy(x), kl.D); }
  // zijlijn
  for (let x = 3; x < L - 4; x++) if (R.g(sx + x, cy + dy(x)) === kl.M) R.p(sx + x, cy + dy(x), mix(kl.M, kl.R, .45));
  R.omlijn();
  // kieuw, oog met glimlicht, bek
  const ox = sx + L - Math.max(3, Math.round(L * .17)), oy = cy - Math.max(1, Math.round(H * .3));
  for (let y = -Math.round(H * .45); y <= Math.round(H * .5); y++) { const v = R.g(ox - 3, cy + y); if (v === kl.R || v === kl.M || v === kl.U) R.p(ox - 3, cy + y, donker(v, .25)); }
  if (o.groot) { R.blok(ox - 1, oy - 1, ox + 1, oy, '#FFFFFF'); R.p(ox, oy, '#1A1418'); R.p(ox + 1, oy, '#1A1418'); }
  else { R.p(ox, oy, '#FFFFFF'); R.p(ox + 1, oy, '#1A1418'); }
  R.p(sx + L - 1, cy + 1, donker(kl.M, .5));
  if (o.tanden) { R.p(sx + L - 1, cy + 2, '#FFFFFF'); R.p(sx + L - 3, cy + 2, '#FFFFFF'); }
  return R;
}

// ---- bijzondere vormen
function vormPix(vorm, kl, beeld = 0) {
  const b = beeld % 4, golf = [-1, 0, 1, 0][b];
  let R;
  switch (vorm) {

      R = new Pix(26, 10);
      R.ovaal(12, 6, 11, 2.6, kl.R); for (let x = 2; x < 23; x += 2) { R.p(x, 3 + (x % 4 ? 0 : -1), kl.M); R.p(x, 9, kl.M); }
      R.veelhoek([[2, 6], [-1, 3 + golf], [-1, 9 + golf]], kl.M);
      for (const [x, y] of [[6, 5], [10, 6], [14, 5], [17, 7], [8, 7]]) R.p(x, y, kl.D);
      R.omlijn(); R.p(19, 4, '#FFFFFF'); R.p(20, 4, '#1A1418'); R.p(21, 5, '#FFFFFF'); R.p(22, 5, '#1A1418');
      break;
    }
    case 'krab': {

      R.ovaal(3, 3 + (b % 2), 2.4, 2, kl.R); R.ovaal(17, 3 + ((b + 1) % 2), 2.4, 2, kl.R); R.p(2, 2 + (b % 2), kl.D); R.p(18, 2 + ((b + 1) % 2), kl.D);
      R.omlijn(); R.p(8, 3, '#1A1418'); R.p(12, 3, '#1A1418'); R.p(8, 2, kl.M); R.p(12, 2, kl.M);
      break;

    case 'mossel': {
      R = new Pix(22, 10);
      for (const [x, y, r] of [[4, 6, 1], [8, 5, 0], [12, 6, 1], [16, 5, 0], [7, 8, 0], [14, 8, 1], [18, 7, 0]]) { R.ovaal(x, y, 2.6, 1.6, r ? '#24304E' : '#2E3A5E'); R.p(x - 1, y - 1, '#5E6E9A'); }
      R.omlijn(); R.p(9, 6, '#E89A5C'); R.p(13, 7, '#E89A5C');
      break;
    }

// ---- Ruben in duikpak: masker met de pilotenbril erachter, haar dat meewappert, rode bies en een gele fles
function duikHoofd(beeld = 0, uitdr = 'gewoon') {
  const R = rubenHoofd(uitdr === 'schrik' ? 'schrik' : 'gewoon', false);
  // masker over de ogen: rubber rand, glas, de bril blijft erachter zichtbaar
  for (let y = 6; y <= 12; y++) for (let x = 8; x <= 19; x++) {
    const rand = y === 6 || y === 12 || x === 8 || x === 19, v = R.g(x, y);
    if (rand) { if (v || x < 19) R.p(x, y, 'P'); continue; }
    if (v === 'G' || v === 'g' || v === 'E' || v === 'w') continue;
    R.p(x, y, (x + y) % 7 === 0 ? 'O' : 'Q');
  }
  R.p(18, 7, 'O'); R.p(17, 7, 'O'); R.p(10, 11, 'p');
  // band om het hoofd
  R.lijn(7, 9, 2, 7, 'P'); R.lijn(7, 10, 2, 8, 'p');
  // ademautomaat in de mond, slang naar achteren
  R.blok(15, 13, 18, 15, 'P'); R.p(18, 13, 'p'); R.p(16, 14, 'p'); R.lijn(15, 16, 10, 19, 'P');
  // haar wappert naar achteren
  const w = [0, 1, 0, -1][beeld % 4];
  for (const [x, y] of [[2, 3 + w], [1, 4 + w], [3, 2], [1, 6 + w], [2, 5], [0, 5 + w]]) R.p(x, y, 'H');
  R.p(2, 4 + w, 'h');
  if (uitdr === 'blij') { R.p(19, 15, 'O'); R.p(20, 13, 'O'); }
  return R;
}
// pose: zwem, richt, net, pak, schrik, blij, rust; kantel -2..2 (positief = kop omlaag); hoek = richting van de arm
function rubenDuik(pose = 'zwem', beeld = 0, kantel = 0, hoek = 0) {
  const ha = pose === 'richt' || pose === 'net' ? Math.round(hoek / (Math.PI / 8)) : 0;
  const sleutel = pose + '|' + (beeld % 8) + '|' + kantel + '|' + ha;
  return zeeBuf('rd|' + sleutel, () => {
    const R = new Pix(80, 64), cx = 40, cy = 32;
    const a = kantel * .32, ax = Math.cos(a), ay = Math.sin(a), bx = ay, by = -ax; // as (vooruit) en rug (omhoog)
    const P = (u, v) => [cx + ax * u + bx * v, cy + ay * u + by * v]; // u langs de as, v naar de rug
    const fase = beeld / 8 * Math.PI * 2, kick = pose === 'rust' ? .15 * Math.sin(fase * .5) : pose === 'schrik' ? .55 * Math.sin(fase * 2) : .42 * Math.sin(fase);
    // benen (achterste eerst), met brede vliezen
    const been = (k, kleur, vin, vinD) => {
      const [hx, hy] = P(-12, 1);
      const dir1 = Math.PI + a + k, dir2 = dir1 - k * .8;
      const kx = hx + Math.cos(dir1) * 9, ky = hy + Math.sin(dir1) * 9, vx = kx + Math.cos(dir2) * 9, vy = ky + Math.sin(dir2) * 9;
      R.lijn(hx, hy, kx, ky, kleur, 5); R.lijn(kx, ky, vx, vy, kleur, 4);
      const d3 = dir2 - k * .7, nx = -Math.sin(d3), ny = Math.cos(d3);
      const f1x = vx + Math.cos(d3) * 13, f1y = vy + Math.sin(d3) * 13;
      R.veelhoek([[vx + nx * 1.5, vy + ny * 1.5], [f1x + nx * 3.5, f1y + ny * 3.5], [f1x - nx * 3.5, f1y - ny * 3.5], [vx - nx * 1.5, vy - ny * 1.5]], vin);
      R.lijn(vx, vy, f1x, f1y, vinD, 1);
    };
    been(-kick, 'W', 'f', 'f');
    // fles op de rug
    const [t1x, t1y] = P(-9, 6), [t2x, t2y] = P(9, 6);
    R.lijn(t1x, t1y, t2x, t2y, 'T', 6); const [u1x, u1y] = P(-8, 8), [u2x, u2y] = P(8, 8); R.lijn(u1x, u1y, u2x, u2y, 'u', 1);
    const [b1x, b1y] = P(-4, 4), [b2x, b2y] = P(-4, 9); R.lijn(b1x, b1y, b2x, b2y, 't', 1); const [c1x, c1y] = P(3, 4), [c2x, c2y] = P(3, 9); R.lijn(c1x, c1y, c2x, c2y, 't', 1);
    const [vx0, vy0] = P(12, 6); R.blok(vx0 - 1, vy0 - 1, vx0 + 1, vy0 + 1, 'x');
    // romp
    const [r1x, r1y] = P(-13, 0), [r2x, r2y] = P(10, 0); R.lijn(r1x, r1y, r2x, r2y, 'W', 10); const [q1x, q1y] = P(0, -1), [q2x, q2y] = P(8, -1); R.lijn(q1x, q1y, q2x, q2y, 'W', 11);
    const [s1x, s1y] = P(-12, 3), [s2x, s2y] = P(9, 3); R.lijn(s1x, s1y, s2x, s2y, 'V', 1);
    const [x1x, x1y] = P(-12, -1), [x2x, x2y] = P(10, -1); R.lijn(x1x, x1y, x2x, x2y, 'X', 1);
    been(kick, 'V', 'F', 'f');
    // hoofd
    const H = duikHoofd(beeld, pose === 'schrik' ? 'schrik' : pose === 'blij' ? 'blij' : 'gewoon');
    const [hx, hy] = P(15, 2); R.plak(H, Math.round(hx - 11), Math.round(hy - 12));
    R.omlijn();
    // voorste arm
    const A = new Pix(R.w, R.h), [sx, sy] = P(7, -2);
    let ex, ey, hx2, hy2;
    if (pose === 'richt' || pose === 'net') { const h = ha * Math.PI / 8; ex = sx + Math.cos(h) * 7; ey = sy + Math.sin(h) * 7; hx2 = ex + Math.cos(h) * 6; hy2 = ey + Math.sin(h) * 6; }
    else if (pose === 'pak') { [ex, ey] = P(13, -6); [hx2, hy2] = P(20, -8); }
    else if (pose === 'blij') { [ex, ey] = P(10, 6); [hx2, hy2] = P(13, 14); }
    else if (pose === 'schrik') { [ex, ey] = P(10, -8); [hx2, hy2] = P(16, -12 - Math.sin(fase * 2) * 2); }
    else { const s = Math.sin(fase) * 1.5; [ex, ey] = P(1, -6); [hx2, hy2] = P(-6 + s, -6); }
    A.lijn(sx, sy, ex, ey, 'W', 3); A.lijn(ex, ey, hx2, hy2, 'W', 3); A.blok(hx2 - 1, hy2 - 1, hx2 + 1, hy2 + 1, 'S');
    if (pose === 'richt') { const h = ha * Math.PI / 8; A.lijn(hx2, hy2, hx2 + Math.cos(h) * 12, hy2 + Math.sin(h) * 12, 'Y', 2); A.lijn(hx2 + Math.cos(h) * 4, hy2 + Math.sin(h) * 4 - 1, hx2 + Math.cos(h) * 16, hy2 + Math.sin(h) * 16 - 1, 'x', 1); }
    if (pose === 'net') { const h = ha * Math.PI / 8; A.ovaal(hx2 + Math.cos(h) * 4, hy2 + Math.sin(h) * 4, 3, 3, '#C9B48A'); A.ovaal(hx2 + Math.cos(h) * 4, hy2 + Math.sin(h) * 4, 1.6, 1.6, null); }
    A.omlijn(); R.plak(A, 0, 0);
    return { pix: R, doek: R.doek(), mond: P(19, -4), hand: [hx2, hy2] };
  });
}

// het vaste deel van de zaal, eenmaal getekend (ramen blijven doorzichtig)
function tekenKombuisZaal(st) {
  const H = KB.H, { cv, ctx } = maakDoek(KB.LINKS + KB.W + KB.RECHTS, H), T = tekenaar(ctx);
  ctx.translate(KB.LINKS, 0);
  const V = KB.VLOER, WAND = KB.WAND, X0 = -KB.LINKS, W = KB.W + KB.RECHTS;
  // ---- achterwand: gewitte baksteen
  for (let y = WAND; y < V; y++) {
    const rij = Math.floor((y - WAND) / 6), off = (rij % 2) * 9;
    for (let x = X0; x < W; x++) {
      const bx = Math.floor((x + off + 1800) / 18), voeg = (y - WAND) % 6 === 5 || (x + off + 1800) % 18 === 17;
      const h = hashf(bx, rij, 3), slijt = ruis(x / 26, y / 18, 7) * .7 + ruis(x / 9, y / 7, 8) * .3;
      let c = voeg ? '#D6CCBA' : (slijt > .66 && h > .25 ? mix('#B8664A', '#9C5440', h) : mix('#F1EBDD', '#E6DDCB', h));
      if (voeg && slijt > .66) c = '#C9B9A4';
      T.px(x, y, c);
    }

const LUCHT_UREN = [[17, '#7FB8E0', '#F6D9A0'], [18.5, '#6A8FCF', '#F6B07A'], [19.5, '#5A5A9A', '#F2805A'], [20.5, '#2E2F66', '#B85A6A'], [21.5, '#161A44', '#3E3468'], [23, '#0A0E26', '#1A2148'], [25, '#070A1C', '#141A3A']];
function luchtOp(uur) {
  let a = LUCHT_UREN[0], b = LUCHT_UREN[LUCHT_UREN.length - 1];

// ---- een rond tafeltje met een kleed (stand: 'ruit' of 'linnen')

// ---- de zee vullen met vissen, zeedieren en vondsten

  vloer('schol', 60, 600, 10, 31, 6); vloer('krab', 60, 600, 8, 31, 4); vloer('mossel', 60, 600, 8, 31, 4); vloer('oester', 200, 600, 14, 31, 2);
  vloer('pieterman', 150, 600, 20, 31, 2);
  los('kwal', 40, 1560, 2, 40, 6); los('zeebaars', 60, 1500, 5, 38, 4);

  school('haring', 1030, 1560, 6, 26);
  los('wijting', 1030, 1560, 30, 70, 5); los('kabeljauw', 1030, 1560, 34, 78, 4); los('zeekat', 1030, 1560, 32, 78, 3);
  vloer('krab', 1030, 1560, 60, 80, 3); vloer('pieterman', 1030, 1560, 60, 80, 2); vloer('oester', 1030, 1560, 60, 80, 2);
  los('zeewolf', 1030, 1560, 55, 79, 1); los('hondshaai', 1030, 1560, 55, 80, 1);
  // kreeften in het wrak
  for (const [hx, hy] of D.Z.wrak.ruimen) maak('kreeft', hx, hy + 3, { vloer: true, thuis: { x: hx, y: hy + 3 } });

  const leg = (x0, x1, m0, m1, n) => { for (let i = 0; i < n; i++) { const p = opVloer(x0, x1, m0, m1); if (!p) continue; const id = kies(y2m(p[1])); if (id) D.vondsten.push({ id, x: p[0], y: p[1] - 5, t: r() * 5 }); } };

function bubbels(x, y, n, groot) { for (let i = 0; i < n; i++) D.deeltjes.push({ t: 'bel', x: x + (Math.random() - .5) * 4, y, vx: (Math.random() - .5) * 8, vy: -20 - Math.random() * 25, l: 2 + Math.random() * 2, g: groot && Math.random() < .4 ? 2 : 1 }); }
function zandwolk(x, y) { for (let i = 0; i < 14; i++) D.deeltjes.push({ t: 'zand', x: x + (Math.random() - .5) * 10, y, vx: (Math.random() - .5) * 40, vy: -Math.random() * 25, l: .8 + Math.random() * .6 }); }
function raakRuben(n, x) {
  const R = D.ruben; if (R.onkw > 0 || D.klaar) return;
  D.o2 = Math.max(0, D.o2 - n); R.onkw = 1; R.pose = 'schrik'; R.poseT = .6; D.rood = .5;
  const dx = R.x - x; R.vx += Math.sign(dx || 1) * 90; R.vy -= 30;
  GELUID.sfx('au'); tekstOp(R.x, R.y - 16, '-' + n + ' s', '#FF9A9A'); bubbels(R.x + 8 * R.kijk, R.y - 4, 8, true);
}
function inTas(item) {
  const kg = item.v ? VONDSTEN[item.v].kg : SOORTEN[item.s].kg;
  if (D.tasKg + kg > D.tasMax + 1e-6) { melding('Je tas is vol! Zwem naar de boot om hem te legen.', 'rood'); GELUID.sfx('fout'); return false; }
  D.tas.push(item); D.tasKg += kg;
  if (item.s) {
    D.gevangen[item.s] = (D.gevangen[item.s] || 0) + 1;
    if (!ST.boek[item.s] && !D.nieuwSoort.includes(item.s)) { D.nieuwSoort.push(item.s); melding('Nieuw in je Zeeboek: ' + SOORTEN[item.s].naam + '!', 'goud groot', 3200); GELUID.sfx('nieuw'); D.ruben.pose = 'blij'; D.ruben.poseT = .9; }
    else GELUID.sfx('vang');
  } else GELUID.sfx(VONDSTEN[item.v].rommel ? 'pak' : 'nieuw');

// ---- Ruben bewegen
function updateRuben(dt) {
  const R = D.ruben, Z = D.Z;
  R.onkw = Math.max(0, R.onkw - dt); R.poseT = Math.max(0, R.poseT - dt);
  let ix = 0, iy = 0;
  if (!D.klaar && R.intro <= 0) {
    if (INV.toets.links) ix -= 1; if (INV.toets.rechts) ix += 1; if (INV.toets.op) iy -= 1; if (INV.toets.neer) iy += 1;
    if (INV.stuur.aan) { ix += INV.stuur.x; iy += INV.stuur.y; }
  }
  const l = Math.hypot(ix, iy); if (l > 1) { ix /= l; iy /= l; }
  const sprint = (INV.toets.sprint || (INV.stuur.aan && Math.hypot(INV.stuur.x, INV.stuur.y) > .97)) && l > .2;
  R.sprint = sprint;
  const max = 62 * uitW('vinnen') * (sprint ? 1.55 : 1) * (D.tasKg > D.tasMax * .8 ? .85 : 1);
  if (R.intro > 0) { R.intro -= dt; R.vy += 260 * dt; }
  else { R.vx += (ix * max - R.vx) * Math.min(1, dt * 3.2); R.vy += (iy * max - R.vy) * Math.min(1, dt * 3.2); }
  if (l < .1 && R.intro <= 0) R.vy += Math.sin(D.tijd * 1.3) * 2 * dt; // zacht dobberen
  // botsen met de bodem: per as schuiven
  const r = 6, vast = (x, y) => Z.vast(Math.round(x), Math.round(y));
  const raak = (x, y) => vast(x - r, y) || vast(x + r, y) || vast(x, y - r + 1) || vast(x, y + r) || vast(x - r * .7, y + r * .7) || vast(x + r * .7, y + r * .7) || vast(x + r * .7, y - r * .7) || vast(x - r * .7, y - r * .7);
  let nx = R.x + R.vx * dt; if (raak(nx, R.y)) { R.vx *= -.2; nx = R.x; } R.x = nx;
  let ny = R.y + R.vy * dt; if (raak(R.x, ny)) { R.vy *= -.2; ny = R.y; } R.y = ny;
  if (raak(R.x, R.y)) { for (let k = 1; k < 12; k++) { if (!raak(R.x, R.y - k)) { R.y -= k; break; } if (!raak(R.x + k, R.y)) { R.x += k; break; } if (!raak(R.x - k, R.y)) { R.x -= k; break; } } }
  if (R.y < 2 && R.intro <= 0) { R.y = 2; R.vy = Math.max(0, R.vy); }
  R.x = klem(R.x, 20, ZEE.W - 20);
  // richting en kanteling
  const muis = !INV.aanraak || performance.now() - INV.muisGebruikt < 2500;
  if (Math.abs(R.vx) > 8) R.kijk = R.vx > 0 ? 1 : -1;
  R.kantel = Math.abs(R.vx) + Math.abs(R.vy) > 20 ? klem(Math.round(R.vy / (Math.abs(R.vx) + 30) * 1.6), -2, 2) : 0;
  if (R.y < 8) R.kantel = 0;
  R.beeld = (R.beeld + dt * (l > .1 ? (sprint ? 16 : 10) : 4)) % 8;
  // mikken
  if (muis && INV.muis.in && performance.now() - INV.muisGebruikt < 2500) {
    const sx = R.x - D.cam.x, sy = R.y - D.cam.y; R.hoek = Math.atan2(INV.muis.y - sy, INV.muis.x - sx); R.mikMuis = true;
  } else {
    R.mikMuis = false;
    let a = R.kijk > 0 ? 0 : Math.PI; if (iy) a += (R.kijk > 0 ? 1 : -1) * iy * .6;
    // een beetje vanzelf mikken: de dichtstbijzijnde vis in een kegel
    let beste = null, bd = 1e9; const bereik = 110 + ST.uit.harpoen * 15;
    for (const f of D.vissen) { if (f.dood || f.def.nietVangen || f.verstopt || f.staat === 'hol') continue; const dx = f.x - R.x, dy = f.y - R.y, dd = Math.hypot(dx, dy); if (dd > bereik) continue; let da = Math.atan2(dy, dx) - a; da = Math.atan2(Math.sin(da), Math.cos(da)); if (Math.abs(da) < .55 && dd < bd) { bd = dd; beste = f; } }
    R.mikDoel = beste; R.hoek = beste ? Math.atan2(beste.y - R.y, beste.x - R.x) : a;
  }
  if (R.mikMuis && Math.abs(Math.cos(R.hoek)) > .2 && R.poseT <= 0) R.kijk = Math.cos(R.hoek) > 0 ? 1 : -1;
  // bubbels uit de ademautomaat
  R.adem = (R.adem || 0) - dt; if (R.adem <= 0 && R.y > 6) { R.adem = 1.6 + Math.random() * .8; bubbels(R.x + R.kijk * 12, R.y - 10, 3 + (sprint ? 2 : 0)); if (Math.random() < .4) GELUID.sfx('bubbel'); }
}

// ---- de harpoen, het net en pakken
function schiet() {
  const R = D.ruben; if (D.harpoen || D.harpoenT > 0 || D.klaar || R.intro > 0) return;
  const a = R.hoek, hx = R.x + Math.cos(a) * 12, hy = R.y + Math.sin(a) * 8;
  D.harpoen = { x: hx, y: hy, vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, weg: 0, bereik: 105 + ST.uit.harpoen * 18, terug: false, vis: null };
  R.pose = 'richt'; R.poseT = .35; if (Math.cos(a) !== 0) R.kijk = Math.cos(a) > 0 ? 1 : -1;
  GELUID.sfx('harpoen'); bubbels(hx, hy, 4);
}
function gooiNet() {
  const R = D.ruben; if (D.netP || D.klaar || R.intro > 0) return;
  if (D.net <= 0) { melding('Je net is op voor deze duik.', 'rood'); GELUID.sfx('fout'); return; }

// ---- het gedrag van de vissen
function updateVissen(dt) {

  const rubenSnel = Math.hypot(R.vx, R.vy) > 50 || R.sprint;
  // scholen: middelpunt en snelheid
  const sch = {};
  for (const f of D.vissen) if (f.school && !f.dood) { const s = sch[f.school] || (sch[f.school] = { x: 0, y: 0, vx: 0, vy: 0, n: 0, leden: [] }); s.x += f.x; s.y += f.y; s.vx += f.vx; s.vy += f.vy; s.n++; s.leden.push(f); }
  for (const id in sch) { const s = sch[id]; s.x /= s.n; s.y /= s.n; s.vx /= s.n; s.vy /= s.n; if (!D.schoolDoel) D.schoolDoel = {}; let dl = D.schoolDoel[id]; if (!dl || Math.hypot(dl.x - s.x, dl.y - s.y) < 20 || Math.random() < dt * .1) { const a = Math.random() * Math.PI * 2; dl = D.schoolDoel[id] = { x: s.x + Math.cos(a) * 120, y: s.y + Math.sin(a) * 40 }; } s.doel = dl; }
  for (const f of D.vissen) {
    if (f.dood || f.aanLijn || f.inNet) continue;
    if (Math.abs(f.x - cx) > actief || Math.abs(f.y - cy) > actief) continue;
    const def = f.def, g = def.gedrag, dx = R.x - f.x, dy = R.y - f.y, dr = Math.hypot(dx, dy);
    f.t += dt; f.flits = Math.max(0, f.flits - dt); f.cd = Math.max(0, f.cd - dt);

    const vlucht = (afstand, kracht = 1) => { if (dr < afstand) { ax -= dx / (dr + 1) * 260 * kracht; ay -= dy / (dr + 1) * 200 * kracht; f.vluchtT = Math.max(f.vluchtT || 0, .8); } };

        for (const o of s.leden) { if (o === f) continue; const ox = f.x - o.x, oy = f.y - o.y, od = ox * ox + oy * oy; if (od < 64 && od > .01) { ax += ox / od * 300; ay += oy / od * 300; } }

        if (g === 'zwerm') { const vl = Z.vloer(f.x | 0, f.y | 0); if (f.y < vl - 18) ay += 60; max = f.vluchtT > 0 ? 70 : 14; }

        if (f.staat === 'vlucht') { vlucht(160, 1.4); max = def.snel * 1.6; if (f.vluchtT <= 0) f.staat = 'rust'; }
        else { if (!f.doel || Math.hypot(f.doel.x - f.x, f.doel.y - f.y) < 10 || Math.random() < dt * .15) { f.doel = { x: f.thuis.x + (Math.random() - .5) * 220, y: f.thuis.y + (Math.random() - .5) * 70 }; } ax += (f.doel.x - f.x) * .9; ay += (f.doel.y - f.y) * .9; max = def.snel * .45; }
        break;

        else { if (!f.doel || Math.abs(f.doel.x - f.x) < 4 || Math.random() < dt * .2) f.doel = { x: f.thuis.x + (Math.random() - .5) * 60, y: f.y }; ax += Math.sign(f.doel.x - f.x) * 60; max = def.snel; if (dr < 26 && rubenSnel) { f.staat = 'vlucht'; f.vluchtT = 1; } }

        else if (f.staat === 'aanval') { const u = Math.min(1, f.t / .25); f.x = h.x + (h.links ? 1 : -1) * u * 34; f.y = h.y + (R.y - h.y) * u * .5; if (dr < 14 && f.cd <= 0) { f.cd = 2.2; raakRuben(def.bijt, f.x); } if (f.t > 1.1) { f.staat = 'hol'; f.cd = 2; } }

// ---- deeltjes, zuurstof, einde
function updateRest(dt) {
  const R = D.ruben;
  for (const p of D.deeltjes) { p.l -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t === 'bel') { p.vx += Math.sin(D.tijd * 9 + p.y) * 20 * dt; if (p.y < 0) p.l = 0; } else if (p.t === 'zand') { p.vy += 20 * dt; p.vx *= .96; } else { p.vx *= .9; p.vy *= .9; } }

  for (const k of D.inkt) { k.t += dt; k.r = 6 + k.t * 14; } D.inkt = D.inkt.filter(k => k.t < 2.4);
  for (const t of D.teksten) { t.t += dt; t.y -= dt * 14; } D.teksten = D.teksten.filter(t => t.t < 1.4);
  D.rood = Math.max(0, D.rood - dt);

  D.waarschuwT -= dt;
  if (te && D.waarschuwT <= 0) { D.waarschuwT = 3; melding('Te diep voor je duikpak! (max ' + uitW('pak') + ' m)', 'rood'); GELUID.sfx('kraak'); }
  if (D.o2 < D.o2max * .2 && D.waarschuwT <= 0) { D.waarschuwT = 4; GELUID.sfx('alarm'); }
  if (D.o2 <= 0) eindeDuik('flauw');
  GELUID.sfeerDiepte(m);
}

function eindeDuik(hoe) {
  if (D.klaar) return; D.klaar = hoe;
  if (hoe === 'flauw') { GELUID.sfx('alarm'); melding('Je zuurstof is op! Trien trekt je aan de lijn naar boven.', 'rood groot', 3500); }
  else GELUID.sfx('plons');
  setTimeout(() => DAG.eindeDuik(hoe), hoe === 'flauw' ? 1400 : 300);
}
