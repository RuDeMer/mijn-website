<style>
/* ================================================================ OP GEVOEL · stijl Kleurvlak
   Elke uitdaging heeft een eigen felle kleur over het hele scherm. Wit (of inkt op lichte kleuren) is van jou,
   donker of wit-gestippeld is het echte antwoord. */
:root { --creme: #FFF2DE; --inkt: #2A1A2E; --wit: #FFFFFF; --vlak: #D63F24; --tekst: #FFFFFF; --zacht: rgba(255,255,255,.22); --sterk: #2A1A2E;
  font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--creme); color: var(--inkt); overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
body[data-scherm="spel"] { background: var(--vlak); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--inkt); outline-offset: 3px; border-radius: 10px; }
.spel :focus-visible { outline-color: var(--tekst); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- vaste knoppen: terug naar de homepage (linksboven) en geluid (rechtsboven), op elk scherm */
.terug, .rondje { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 0; padding: 0; text-decoration: none; }
.terug { position: fixed; z-index: 50; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); background: var(--inkt); color: #fff; }
.terug svg, .rondje svg { width: 22px; height: 22px; }
.hoek { position: fixed; z-index: 50; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); display: flex; gap: 8px; }
.rondje { background: var(--inkt); color: #fff; }
body[data-scherm="spel"] .terug, body[data-scherm="spel"] .rondje { background: var(--tekst); color: var(--vlak); }
#b-geluid[aria-pressed="false"] .golfjes, #b-geluid[aria-pressed="true"] .streep { display: none; }
#b-stop { display: none; }
body[data-scherm="spel"] #b-stop { display: grid; }

/* ---------- schermen */
.scherm { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.licht { background: var(--creme); color: var(--inkt); }
.binnen { max-width: 34rem; margin: 0 auto; padding: calc(70px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }

/* ---------- start */
.logo { margin: 6px 0 0; font-size: clamp(2.9rem, 13vw, 4.4rem); font-weight: 700; letter-spacing: -.03em; line-height: .95; display: flex; align-items: center; justify-content: center; gap: .02em; }
.logo svg { width: .86em; height: .86em; margin-right: .02em; overflow: visible; }
.logo .ring { fill: none; stroke: #D63F24; stroke-width: 11; stroke-linecap: round; }
.logo .stipje { fill: var(--inkt); }
.slogan { text-align: center; margin: 10px 0 22px; font-size: 1.12rem; font-weight: 500; }
.kaart { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; width: 100%; text-align: left; border: 0; border-radius: 22px; padding: 18px 18px 18px 20px; margin: 0 0 12px; color: #fff; }
.kaart b { font-size: 1.5rem; font-weight: 700; line-height: 1.05; }
.kaart span { font-size: 1rem; font-weight: 500; grid-column: 1; }
.kaart .pijl { grid-column: 2; grid-row: 1 / span 3; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.95); color: var(--inkt); display: grid; place-items: center; font-size: 1.4rem; font-weight: 600; }
.kaart.dag { background: #D63F24; }
.kaart.vrij { background: #2B59E0; }
.kaart.oefen { background: #0A8656; }
.kaart .emojis { font-size: 1.35rem; letter-spacing: .12em; margin-top: 4px; }
.kaart .klein { font-size: .92rem; opacity: .95; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 16px 0 4px; }
.chips span { background: #fff; border-radius: 99px; padding: .38rem .85rem; font-weight: 600; font-size: .95rem; box-shadow: 0 2px 0 rgba(42,26,46,.12); }
.voet { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

/* ---------- knoppen */
.pil { border: 0; border-radius: 99px; padding: .78rem 1.4rem; font-weight: 600; font-size: 1.05rem; background: #fff; color: var(--inkt); min-height: 48px; }
.pil.donker { background: var(--inkt); color: #fff; }
.pil.rand { background: transparent; border: 2.5px solid currentColor; }
.pil.breed { width: 100%; }
.pil:disabled { opacity: .45; cursor: default; }
.spel .pil.donker { background: var(--sterk); color: var(--vlak); }
.spel .pil.rand { color: var(--tekst); }
.pil.groot { font-size: 1.3rem; padding: .95rem 2.4rem; min-width: 12rem; }
@media (prefers-reduced-motion: no-preference) {
  .pil, .kaart, .tegel, .rondje, .terug, .volgende { transition: transform .12s ease; }
  .pil:active, .kaart:active, .tegel:active, .rondje:active, .volgende:active { transform: scale(.96); }
}

/* ---------- spel */
.spel { background: var(--vlak); color: var(--tekst); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.spel-kop { height: calc(68px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 120px 0 70px; display: flex; align-items: center; justify-content: center; }
.voortgang { background: rgba(0,0,0,.18); padding: .32rem .9rem; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.donker .voortgang { background: rgba(42,26,46,.12); }
.opdracht { text-align: center; padding: 0 18px; max-width: 46rem; margin: 0 auto; width: 100%; }
.opdracht h2 { margin: 0; font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 700; line-height: 1.05; letter-spacing: -.01em; }
.opdracht p { margin: .3rem 0 0; font-size: 1.05rem; font-weight: 500; line-height: 1.3; min-height: 1.3em; }
.veld { position: relative; min-height: 0; margin: 8px 12px 6px; }
.veld canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; border-radius: 18px; }
.veld canvas:focus-visible { outline: 3px dashed var(--tekst); outline-offset: -3px; }
.melding { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); max-width: calc(100% - 24px); background: #fff; color: var(--inkt); font-weight: 600; padding: .45rem 1rem; border-radius: 99px; text-align: center; pointer-events: none; box-shadow: 0 3px 0 rgba(0,0,0,.15); z-index: 2; }
.melding:empty { display: none; }
.melding.boos { background: var(--inkt); color: #fff; }
@media (prefers-reduced-motion: no-preference) { .melding.boos { animation: schud .35s; } }
@keyframes schud { 25% { transform: translateX(calc(-50% - 6px)); } 75% { transform: translateX(calc(-50% + 6px)); } }
.tijdbalk { position: absolute; left: 12%; right: 12%; bottom: 0; height: 6px; border-radius: 3px; background: var(--zacht); overflow: hidden; pointer-events: none; }
.tijdbalk i { display: block; height: 100%; width: 100%; background: var(--tekst); transform-origin: left center; }
@media (prefers-reduced-motion: no-preference) { .tijdbalk.bijna i { animation: bijna .45s ease-in-out infinite alternate; } }
@keyframes bijna { to { opacity: .35; } }
.onder { position: relative; min-height: 158px; padding: 6px 16px calc(14px + env(safe-area-inset-bottom)); max-width: 46rem; width: 100%; margin: 0 auto; display: grid; align-items: center; }
.bedien { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.bedien .rij { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; }
.bedien .tip { margin: 0; font-weight: 500; text-align: center; opacity: .95; }
.melding-blok { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; background: rgba(0,0,0,.16); border-radius: 16px; padding: .5rem .5rem .5rem .9rem; font-weight: 500; max-width: 30rem; }
.donker .melding-blok { background: rgba(42,26,46,.1); }
.melding-blok .pil { padding: .45rem 1rem; min-height: 40px; font-size: .95rem; }

/* schuifjes (kleur) en getal (stippen) */
.schuifjes { width: 100%; max-width: 28rem; display: grid; gap: 8px; }
.schuif { display: grid; grid-template-columns: 6.5rem 1fr; align-items: center; gap: 10px; font-weight: 600; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; border-radius: 99px; background: #888; margin: 0; border: 3px solid rgba(255,255,255,.9); touch-action: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 4px solid var(--inkt); box-shadow: 0 2px 4px rgba(0,0,0,.35); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--inkt); }
input[type=range]:focus-visible { outline: 3px solid var(--tekst); outline-offset: 3px; }
.getal { display: flex; align-items: center; gap: 12px; justify-content: center; }
.getal input { width: 6.5rem; text-align: center; font-size: 2.2rem; font-weight: 700; border: 0; border-radius: 16px; padding: .1rem .3rem; background: #fff; color: var(--inkt); font-variant-numeric: tabular-nums; }
.getal .rondje { width: 52px; height: 52px; font-size: 1.8rem; font-weight: 600; background: #fff; color: var(--inkt); }
.getal-schuif { width: 100%; max-width: 24rem; background: linear-gradient(90deg, rgba(255,255,255,.25), rgba(255,255,255,.6)) !important; }

/* terugblik na een uitdaging */
.terugblik { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 14px; }
.terugblik .score { font-size: clamp(3.2rem, 15vw, 4.6rem); font-weight: 700; line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; grid-row: span 2; }
.terugblik .score small { font-size: .42em; letter-spacing: 0; }
.terugblik .zin { grid-column: 2; margin: 0; align-self: end; justify-self: start; background: #fff; color: var(--inkt); font-weight: 600; padding: .38rem .95rem; border-radius: 99px; line-height: 1.2; font-size: 1.02rem; }
.terugblik .regel { grid-column: 2; margin: 2px 0 0 4px; align-self: start; font-weight: 500; font-size: .98rem; line-height: 1.25; }
.terugblik .record { display: inline-block; margin-left: .3rem; background: var(--sterk); color: var(--vlak); border-radius: 99px; padding: .05rem .55rem; font-size: .8rem; font-weight: 600; vertical-align: 2px; }
.volgende { grid-column: 3; grid-row: 1 / span 2; width: 66px; height: 66px; border-radius: 50%; border: 0; background: var(--sterk); color: var(--vlak); display: grid; place-items: center; }
.volgende svg { width: 28px; height: 28px; }
.terugblik .knoppen-oefen { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
@media (max-width: 420px) {
  .terugblik { grid-template-columns: auto 1fr; }
  .terugblik .volgende { grid-column: 2; grid-row: auto; justify-self: end; width: 58px; height: 58px; margin-top: -4px; }
  .terugblik .score { grid-row: span 3; }
}
/* liggende telefoon: veld links, de rest rechts */
@media (max-height: 540px) and (min-aspect-ratio: 4/3) {
  .spel { grid-template-columns: minmax(0, 1fr) minmax(16rem, 40%); grid-template-rows: auto auto minmax(0, 1fr); }
  .spel-kop { grid-column: 1 / -1; height: calc(58px + env(safe-area-inset-top)); }
  .opdracht { grid-column: 2; grid-row: 2; text-align: left; }
  .veld { grid-column: 1; grid-row: 2 / span 2; margin: 0 8px 10px 12px; }
  .onder { grid-column: 2; grid-row: 3; align-content: start; min-height: 0; }
  .opdracht h2 { font-size: 1.4rem; }
}

/* ---------- oefenen, uitslag, records */
.lijst h2, .uitslag h2 { margin: 0; font-size: 2rem; letter-spacing: -.02em; text-align: center; }
.lijst > .binnen > p { text-align: center; margin: 4px 0 16px; font-weight: 500; }
.oefen-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 10px; margin-bottom: 18px; }
.tegel { border: 0; border-radius: 18px; padding: 12px 12px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 104px; color: #fff; }
.tegel .em { font-size: 1.6rem; line-height: 1; }
.tegel b { font-size: 1.08rem; font-weight: 600; line-height: 1.1; margin-top: auto; }
.tegel small { font-size: .88rem; font-weight: 500; opacity: .95; }
.tegel.donker { color: var(--inkt); }
.uitslag .kop { text-align: center; font-weight: 600; font-size: 1.1rem; margin-top: 4px; }
.uitslag .kop small { display: block; font-weight: 500; opacity: .75; font-size: .95rem; }
.totaal { text-align: center; font-size: clamp(4.4rem, 22vw, 6rem); font-weight: 700; line-height: 1; letter-spacing: -.05em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.totaal small { font-size: .34em; opacity: .55; letter-spacing: 0; }
.nieuw-record { display: table; margin: 4px auto 0; background: #F6B500; color: var(--inkt); font-weight: 600; border-radius: 99px; padding: .28rem .85rem; }
.vijf { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; margin: 16px 0 0; }
.vijf div { aspect-ratio: 3 / 4; border-radius: 14px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 7px 6px 6px; }
.vijf div.donker { color: var(--inkt); }
.vijf span { font-size: 1.15rem; }
.vijf b { font-size: clamp(1.2rem, 6vw, 1.6rem); text-align: center; font-weight: 700; }
.per { margin: 14px 0 0; padding: 0; list-style: none; }
.per li { display: grid; grid-template-columns: 1.8rem 1fr auto; gap: 8px; align-items: baseline; padding: 7px 2px; border-bottom: 2px dotted rgba(42,26,46,.18); }
.per li b { font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.per li small { grid-column: 2 / span 2; font-size: .9rem; opacity: .75; margin-top: -2px; }
.knoppen { display: grid; gap: 10px; margin-top: 18px; }
.sb-plek { margin-top: 14px; }
.later { text-align: center; font-size: .92rem; opacity: .75; margin: 12px 0 0; }
.recs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.recs div { background: #fff; border-radius: 18px; padding: 12px 14px; box-shadow: 0 2px 0 rgba(42,26,46,.1); }
.recs b { display: block; font-size: 1.9rem; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.recs span { font-weight: 500; font-size: .95rem; }
.staafjes { display: flex; align-items: flex-end; gap: 5px; height: 130px; background: #fff; border-radius: 18px; padding: 22px 12px 26px; position: relative; margin-bottom: 18px; }
.staafjes i { flex: 0 0 calc((100% - 65px) / 14); background: #D63F24; border-radius: 6px 6px 3px 3px; position: relative; min-height: 4px; }
.staafjes i::before { content: attr(data-t); position: absolute; left: 50%; top: -17px; transform: translateX(-50%); font-style: normal; font-size: .7rem; font-weight: 600; }
.staafjes i::after { content: attr(data-d); position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%); font-style: normal; font-size: .72rem; white-space: nowrap; opacity: .7; }
.staafjes:empty::before { content: "Nog geen dagrondes gespeeld."; margin: auto; font-weight: 500; opacity: .7; }
h3.sub { margin: 18px 0 8px; font-size: 1.2rem; }

/* ---------- instellingen */
dialog { border: 0; border-radius: 24px; padding: 0; max-width: min(26rem, calc(100vw - 32px)); width: 100%; background: var(--creme); color: var(--inkt); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(42,26,46,.55); }
dialog .in { padding: 20px 20px 18px; }
dialog h2 { margin: 0 0 10px; font-size: 1.6rem; }
.schakel { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 2px dotted rgba(42,26,46,.18); font-weight: 500; }
.schakel small { display: block; font-size: .88rem; opacity: .75; }
.schakel input { -webkit-appearance: none; appearance: none; width: 52px; height: 30px; border-radius: 99px; background: #CDBFAE; position: relative; cursor: pointer; margin: 0; }
.schakel input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.schakel input:checked { background: #0A8656; }
.schakel input:checked::after { left: 25px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--inkt); color: #fff; font-weight: 600; padding: .65rem 1.2rem; border-radius: 99px; z-index: 60; pointer-events: none; text-align: center; max-width: calc(100vw - 32px); }
.toast:empty { display: none; }
.sb-blok { background: #fff !important; border-radius: 16px !important; }
</style>
</head>
<body data-pagina="opgevoel" data-scherm="start">
<a class="terug" href="./" aria-label="Terug naar het rommelhoekje" title="Terug naar het rommelhoekje"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<div class="hoek">
  <button class="rondje" id="b-stop" type="button" aria-label="Stoppen en terug naar het menu" title="Stoppen"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
  <button class="rondje" id="b-geluid" type="button" aria-pressed="true" aria-label="Geluid" title="Geluid aan of uit"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="golfjes" d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="streep" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
</div>

<section class="scherm licht" id="s-start">

<script>
(function () {
  try { const h = sessionStorage.getItem('koppel-herstel'); if (h) { const d = JSON.parse(h); for (const [k, v] of Object.entries(d)) { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
    // welke versie van de server nu op dit apparaat staat (zie koppelSync), zodat de volgende keer gewoon verder gaat
    const v = JSON.parse(sessionStorage.getItem('koppel-herstel-v') || 'null'), K = JSON.parse(localStorage.getItem('rommelhoekje-koppel') || 'null');
    if (v && K && K.code === v.code) { K.staat = Object.assign(K.staat || {}, v.staat || {}); localStorage.setItem('rommelhoekje-koppel', JSON.stringify(K)); }
    sessionStorage.removeItem('koppel-herstel'); sessionStorage.removeItem('koppel-herstel-v'); if (!['koppel-hulp', 'koppel-vervangen', 'koppel-samen', 'koppel-geweigerd', 'koppel-opnieuw', 'koppel-terug'].some(x => sessionStorage.getItem(x))) sessionStorage.setItem('koppel-melding', '1'); } } catch (e) {}
})();
(function () {
  // rommelhoekje-speler: gedeeld door alle pagina's van de site (zelfde adres = zelfde opslag)
  const SKEY = 'rommelhoekje-speler';
  let speler = null;
  try { speler = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { speler = null; }
  const bewaar = () => { try { if (speler) localStorage.setItem(SKEY, JSON.stringify(speler)); else localStorage.removeItem(SKEY); } catch (e) {} };

  // instellingen.json staat in de map van de site en wordt door de werkplaats beheerd
  const klaar = fetch('instellingen.json?' + Math.floor(Date.now() / 600000), { cache: 'no-cache' })
    .then(r => (r.ok ? r.json() : {})).catch(() => ({}))
    .then(inst => {
      inst = inst || {};
      // bezoekersteller van Cloudflare: geen cookies, geen persoonsgegevens
      if (inst.analyticsToken && /^[a-f0-9]{16,64}$/i.test(inst.analyticsToken) && !document.querySelector('script[src*="cloudflareinsights"]')) {
        const s = document.createElement('script');
        s.defer = true; s.src = 'https://static.cloudflareinsights.com/beacon.min.js?token=' + encodeURIComponent(inst.analyticsToken);
        document.head.appendChild(s);
      }
      return inst;
    });
  const adres = inst => (inst.scoreUrl || '').replace(/\/+$/, '');
  function nieuwGeheim() {
    if (window.crypto && crypto.getRandomValues) { const a = new Uint8Array(18); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, '0')).join(''); }
    return Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2);
  }
  async function mijnId() {
    if (!speler || !window.crypto || !crypto.subtle) return null;
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rommelhoekje:' + speler.geheim));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
  }
  const laatst = {};
  // ---------- alle spellen bijwerken, vanaf elke pagina van de site
  // Elk spel bewaart zijn beste score in deze browser. Doe je mee, dan sturen we die vanzelf door,
  // ook als je niet op de scorebordpagina komt. Alleen wat nieuw of beter is, gaat de deur uit.
  const lees = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  // De Vlaaienbakker: een getal boven 10^300 staat in zijn opslag op dat plafond, en precies als tekst in s.groot[pad] ("4.2e400").
  // vbLog geeft de 10-log (0 of niets: -Infinity), net als de scoreserver.
  const vbLog = (s, pad) => {
    if (!s) return -Infinity;
    const P = pad.startsWith('gilde.') ? 1e270 : 1e300, x = pad.split('.').reduce((o, k) => (o == null ? undefined : o[k]), s);
    const r = s.groot && /^\s*(\d+(?:\.\d+)?)(?:e([+-]?\d+))?\s*$/i.exec(String(s.groot[pad] || '')), g = r && parseFloat(r[1]) > 0 ? Math.log10(parseFloat(r[1])) + (r[2] ? parseInt(r[2], 10) : 0) : NaN;
    if (typeof x !== 'number' || !isFinite(x)) return isFinite(g) ? g : -Infinity;
    if (isFinite(g) && x >= P / 1e20) return g;
    return x > 0 ? Math.log10(x) : -Infinity;
  };
  // spellen die hun score als 10-log sturen, en borden die een oude scoreserver nog niet kent (dan zeggen we niets)
  const LOG_SPEL = { vlaai: 1 }, NIEUW_BORD = { oerknal: 1, vbpres: 1 };
  const vkey = spel => (LOG_SPEL[spel] ? spel + '~log' : spel);
  const BRONNEN = {
    gevoel: () => { const s = lees('opgevoel-v1'); return s && s.stat && s.stat.dag && s.stat.dag.best ? [s.stat.dag.best, (s.reeks && s.reeks.lengte) || 0] : null; },
    groepjes: () => { const s = lees('rommelgroepjes-v1'); if (!s || !s.p) return null; let b = 0, r = 0, v = -9, z = 0; for (const d of Object.keys(s.p).map(Number).filter(n => n > 0).sort((a, c) => a - c)) { const x = String(s.p[d]); if (x[0] === 'w') { r = d === v + 1 ? r + 1 : 1; v = d; b = Math.max(b, r); } if ((x[0] === 'w' || x[0] === 'a') && x[1] === '0') z++; } return b ? [b, z] : null; },
    reclame: () => { const s = lees('reclame-v1'); if (!s || !s.s) return null; let n = 0; for (const v of Object.values(s.s)) for (const c of String(v)) n += Math.min(3, +c || 0); return n ? [n, (s.dag && s.dag.b) || 0] : null; },
    huis: () => { const s = lees('huisopstelten-v1'); return s && s.besteDag > 0 ? [Math.round(s.besteDag), Object.values(s.k || {}).reduce((n, k) => n + ((k && k.s) || []).filter(Boolean).length, 0)] : null; },
    duiker: () => { const s = lees('rubendeduiker-v1'); return s && s.beste && s.beste.avond > 0 ? [Math.round(s.beste.avond), Object.keys(s.boek || {}).length] : null; },
    wheels: () => { const s = lees('rommelwheels-v1'); if (!s || !s.levels) return null; let p = 0, st = 0; for (const r of Object.values(s.levels)) { p += r.punten || 0; st += (r.gehaald ? 1 : 0) + (r.alle ? 1 : 0) + (r.heel ? 1 : 0); } return p ? [p, st] : null; },
    vlaai: () => { const s = lees('vlaaienbakker-v1'), L = vbLog(s, 'totaal'); return L >= 0 ? [L, Math.max(0, vbLog(s, 'vpsNu'))] : null; },
    oerknal: () => { const s = lees('vlaaienbakker-v1'), o = s && s.oer; return o && o.n > 0 ? [Math.floor(Math.pow(10, Math.min(15, vbLog(s, 'oer.ooit')))), o.n] : null; },
    vbpres: () => { const s = lees('vlaaienbakker-v1'); return s && Array.isArray(s.pres) && s.pres.length ? [s.pres.length, s.mijl || 0] : null; },
    woord: () => { const s = lees('rommelwoord-stats-v1'); return s && s.besteReeks > 0 ? [s.besteReeks, s.gewonnen || 0] : null; },
    poker: () => { const s = lees('rommelpoker-record'); return s && s.verst > 0 ? [s.verst, Math.round(s.beste || 0)] : null; },
    bel: () => { const s = lees('rommelbel-v1'); return s && s.eindeloos ? [s.eindeloos, Object.values(s.sterren || {}).reduce((a, b) => a + b, 0)] : null; },
    rob: () => { const s = lees('rommelrob-v1'); return s && s.best ? [s.best, s.totaal || 0] : null; },
    arend: () => { const s = lees('rommelarend-v1'); if (!s) return null; const p = (s.ontdekt || []).length * 100 + (s.veren || []).length * 25 + Object.values(s.races || {}).reduce((a, r) => a + ({ goud: 300, zilver: 200, brons: 100 }[r.medaille] || 0), 0); return p ? [p, (s.ontdekt || []).length] : null; },
    kroon: () => { const s = lees('rommelkroon-v1'); if (!s || !s.opgelost) return null; const o = Object.values(s.opgelost); return o.length ? [o.length, o.reduce((a, x) => a + x.tijd, 0)] : null; },
    ritme: () => { const s = lees('rommelritme-v1'); if (!s || !s.best) return null; const som = Object.values(s.best).reduce((a, b) => a + b, 0); return som > 0 ? [som, Object.values(s.pogingen || {}).reduce((a, b) => a + b, 0)] : null; },
    vlieger: () => { const s = lees('vouwvlieger-v1'); return s && s.best > 0 ? [s.best, s.sterren || 0] : null; },
    beest: () => { const s = lees('rommelbeesten-v1'); if (!s || !s.bezit) return null; let u = 0, t = 0; for (const [id, b] of Object.entries(s.bezit)) { const n = (b[0] || 0) + (b[1] || 0); t += n; if (n > 0 && /^zs/.test(id)) u++; } return u ? [u, t] : null; },
  };
  const VKEY = 'rommelhoekje-verstuurd';
  const onthoud = (spel, score, extra) => { const v = lees(VKEY) || {}, k = vkey(spel); const o = v[k]; if (!o || o.naam !== speler.naam || score > o.s || (score === o.s && extra > o.e)) { v[k] = { s: score, e: extra, naam: speler.naam }; try { localStorage.setItem(VKEY, JSON.stringify(v)); } catch (e) {} } };
  let bezig = false;
  async function synchroniseer() {
    if (bezig || !speler || !speler.naam) return; bezig = true;
    try {
      const inst = await klaar; if (!adres(inst)) return;
      const v = lees(VKEY) || {};
      for (const [spel, bron] of Object.entries(BRONNEN)) {
        let w = null; try { w = bron(); } catch (e) {}
        if (!w) continue;
        const o = v[vkey(spel)];
        if (o && o.naam === speler.naam && o.s >= w[0] && o.e >= w[1]) continue;
        await API.stuur(spel, w[0], w[1]);
      }
    } finally { bezig = false; }
  }

  const API = {
    klaar,
    actief: () => klaar.then(inst => !!adres(inst)),
    doetMee: () => !!(speler && speler.naam),
    naam: () => (speler && speler.naam) || '',
    mijnId,
    // meedoen of je naam veranderen; een lege naam = stoppen
    async zetNaam(naam) {
      naam = String(naam || '').replace(/\s+/g, ' ').trim().slice(0, 16);
      if (!naam) { speler = null; bewaar(); return { ok: true }; }
      const bestond = !!(speler && speler.geheim);
      speler = { geheim: (speler && speler.geheim) || nieuwGeheim(), naam };
      bewaar();
      let uitslag = { ok: true };
      const inst = await klaar;
      if (bestond && adres(inst)) {
        try { const r = await metTijd(adres(inst) + '/naam', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ geheim: speler.geheim, naam }) }); const j = await r.json().catch(() => ({})); if (!r.ok) { uitslag = { ok: false, fout: j.fout || 'Naam veranderen lukte niet.' }; document.dispatchEvent(new CustomEvent('scorebord-fout', { detail: uitslag.fout })); } } catch (e) {}
      }
      document.dispatchEvent(new CustomEvent('scorebord-naam'));
      for (const [spel, w] of Object.entries(laatst)) { delete laatst[spel]; await API.stuur(spel, w[0], w[1], true); }
      await synchroniseer();
      return uitslag;
    },
    // een score insturen (de server bewaart alleen je beste). De Vlaaienbakker stuurt de 10-log (LOG_SPEL): dan gaat ook het gewone getal
    // mee (hooguit 10^300), zodat een oudere scoreserver hem nog aanneemt.
    async stuur(spel, score, extra, direct) {
      laatst[spel] = [score, extra || 0];
      if (!API.doetMee()) return null;
      const inst = await klaar; if (!adres(inst)) return null;
      const rauw = L => (L < 15 ? Math.round(Math.pow(10, L)) : Math.pow(10, Math.min(300, L)));
      const lijf = LOG_SPEL[spel] ? { spel, naam: speler.naam, geheim: speler.geheim, score: rauw(score), extra: rauw(extra || 0), log: score, elog: extra || 0 } : { spel, naam: speler.naam, geheim: speler.geheim, score, extra: extra || 0 };
      try {
        const r = await metTijd(adres(inst) + '/score', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, keepalive: true, body: JSON.stringify(lijf) });
        const j = await r.json().catch(() => ({}));
        if (r.ok) onthoud(spel, score, extra || 0);
        if (!r.ok && j.fout && !NIEUW_BORD[spel]) document.dispatchEvent(new CustomEvent('scorebord-fout', { detail: j.fout }));
        return r.ok ? j : null;
      } catch (e) { return null; }
    },
    async lijsten() {
      const inst = await klaar; if (!adres(inst)) return null;
      const r = await metTijd(adres(inst) + '/scores', { cache: 'no-store' });
      return r.ok ? r.json() : null;
    },
    async stopEnVerwijder() {
      const inst = await klaar;
      if (speler && adres(inst)) { try { await metTijd(adres(inst) + '/verwijder', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ geheim: speler.geheim }) }); } catch (e) {} }
      speler = null; bewaar();
      document.dispatchEvent(new CustomEvent('scorebord-naam'));
    },
    // een klein blokje om mee te doen, voor in een spel
    async blokje(el, wat) {
      if (!el) return;
      el.dataset.sbWat = wat || 'je score';
      if (!(await API.actief())) { el.hidden = true; return; }
      tekenBlok(el);
    },
  };
  function tekenBlok(el) {
    el.hidden = false; el.innerHTML = '';
    el.classList.add('sb-blok');
    const p = document.createElement('p');
    if (API.doetMee()) {
      p.innerHTML = 'Je doet mee aan het <a href="scorebord.html">scorebord</a> als <b></b>.';
      p.querySelector('b').textContent = speler.naam;
      el.appendChild(p);
      return;
    }
    p.textContent = 'Zet ' + el.dataset.sbWat + ' op het scorebord van het rommelhoekje. Kies een naam:';
    const f = document.createElement('form'); f.className = 'sb-mee';
    f.innerHTML = '<input maxlength="16" placeholder="Je naam" aria-label="Je naam voor het scorebord" autocomplete="nickname"><button type="submit">Doe mee</button>';
    f.addEventListener('submit', async e => { e.preventDefault(); const n = f.querySelector('input').value.trim(); if (n.length < 2) { f.querySelector('input').focus(); return; } await API.zetNaam(n); });
    const k = document.createElement('small'); k.textContent = 'We bewaren alleen je naam en je beste score. Je kunt altijd stoppen op de scorebordpagina.';
    el.appendChild(p); el.appendChild(f); el.appendChild(k);
  }
  document.addEventListener('scorebord-naam', () => document.querySelectorAll('[data-sb-wat]').forEach(el => { if (!el.hidden) tekenBlok(el); }));
  // stijl voor het blokje, met de kleuren van de site
  const st = document.createElement('style');
  st.textContent = '.sb-blok{background:var(--papier,#FBF6E9);color:var(--inkt,#1F2333);border-radius:8px;padding:.6rem .8rem;margin-top:.8rem;font-size:.92rem;line-height:1.4;text-align:left}.sb-blok p{margin:0 0 .4rem}.sb-blok p:last-child{margin:0}.sb-blok a{color:var(--rood-d,#9E2430);font-weight:700}.sb-mee{display:flex;gap:.4rem;flex-wrap:wrap}.sb-mee input{flex:1 1 8rem;min-width:0;font:inherit;padding:.4rem .6rem;border-radius:6px;border:2px solid var(--manila-d,#D9BE78);background:#fff}.sb-mee button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:.4rem .8rem;background:var(--rood,#C8323C);color:#fff;cursor:pointer}.sb-blok small{display:block;color:var(--zacht,#5E5643);margin-top:.35rem;font-size:.78rem}';
  document.head.appendChild(st);

  // ==== REGELS begin
  // De regels voor het koppelen: hoe twee versies van een spel samengaan. Deze tekst staat letterlijk hetzelfde in het gedeelde
  // scorebord-blok van de site en in de scoreserver (de controle van de gedeelde blokken kijkt dat na). Verander hem dus altijd op allebei.
  //   b = de gezamenlijke basis (de laatste versie waar beide apparaten het over eens waren; mag ontbreken),
  //   s = wat de server al had (dat kwam eerst binnen), i = wat er nu binnenkomt (dat kwam later).
  // De soorten regels: samen (wat op een van de twee gehaald is, blijft), beste (hoogste of snelste), teller (wat er op elk apparaat bij
  // kwam, telt op; zonder basis de hoogste), keuze (een instelling: de laatste verandering wint), lopend (iets dat nog bezig is: de laatste
  // versie, nooit gemengd), eerste (dagpuzzels: de eerste uitslag van een dag telt) en geheel (één hele versie wint: die met de meeste
  // voortgang). Nooit geld, muntjes, kaarten of spullen samenvoegen: dan zou je iets kunnen verdubbelen. Een nieuw spel? Zet het in SPEL.
  const REGELS = (() => {
    const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
    const getal = (x, d = 0) => (typeof x === 'number' && isFinite(x) ? x : d);
    const lijst = x => (Array.isArray(x) ? x : []);
    const aantal = o => (isObj(o) ? Object.keys(o).length : 0);

  try { if (sessionStorage.getItem('koppel-samen')) { sessionStorage.removeItem('koppel-samen'); addEventListener('load', () => setTimeout(() => toonKoppelMelding('Wat je op je andere apparaat deed, is erbij gezet.'), 900)); } } catch (e) {}
  try { const w = sessionStorage.getItem('koppel-geweigerd'); if (w) { sessionStorage.removeItem('koppel-geweigerd'); addEventListener('load', () => setTimeout(() => alert('Je voortgang ging sneller dan de server kon controleren (' + w + '), dus hij is teruggezet naar de laatste goedgekeurde stand.\n\nSpeel je hetzelfde spel in twee tabbladen of op twee apparaten tegelijk? Gebruik er dan één tegelijk, dan gebeurt dit niet meer. Klopt er iets niet, laat het Ruben weten via de ideeënbox.'), 400)); } } catch (e) {}
  // op de homepage en het scorebord een knopje
  if (['index', '', 'scorebord'].includes(pagina)) addEventListener('DOMContentLoaded', () => { stijl(); const b = document.createElement('button'); b.className = 'kp-knopje'; b.type = 'button'; b.textContent = (leesK() || {}).code ? 'Apparaten gekoppeld' : 'Koppel je apparaten'; b.onclick = () => { openKoppel(); }; document.body.appendChild(b); });

    });
  }));
  API.synchroniseer = synchroniseer;
  window.Scorebord = API;
  // bij elk bezoek, en als je even naar een ander tabblad gaat
  klaar.then(() => setTimeout(synchroniseer, 1500));
  document.addEventListener('visibilitychange', () => { if (document.hidden) synchroniseer(); });
})();

<script>
/* ================================================================ REKEN
   Alle berekeningen van Op Gevoel, zonder DOM: zo zijn ze met Node te testen.
   Elke uitdaging telt op dezelfde manier: precies goed = 100 punten, op de
   grens (het 'nulpunt') of verder ernaast = 0, en daartussen gelijkmatig.
   Afstanden zijn in veldmaten: het speelveld is 1 bij 1, op elk scherm. */
const REKEN = (() => {
  const R = {};
  R.lin = (fout, nul) => Math.round(100 * Math.max(0, Math.min(1, 1 - fout / nul)));
  R.NUL = { cirkel: 0.3, seconde: 0.2, midden: 0.1, kleur: 30, hoek: 30, lijn: 0.05, drieen: 0.08, evenlang: 0.3, stippen: Math.LN2, waterpas: 6, maat: 0.2, zwaartepunt: 0.25, halfvol: 0.2, spiegel: 0.15, muur: 0.3 };

  // ---------- zaadjes: dezelfde opgave voor iedereen op dezelfde dag
  R.hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  R.rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  R.tussen = (r, a, b) => a + (b - a) * r();
  R.heel = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  R.kies = (r, l) => l[Math.floor(r() * l.length)];
  R.teken = r => (r() < 0.5 ? -1 : 1);
  R.schud = (r, l) => { for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; } return l; };

  // ---------- meetkunde
  const af = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  R.afstand = af;
  R.graden = rad => rad * 180 / Math.PI;
  // een getekende lijn opnieuw bemonsteren op gelijke afstanden, zodat snel of langzaam tekenen niet uitmaakt
  R.herbemonster = (p, n) => {
    const L = [0];
    for (let i = 1; i < p.length; i++) L.push(L[i - 1] + af(p[i], p[i - 1]));
    const tot = L[L.length - 1], uit = [];
    if (p.length < 2 || tot === 0) return { p: p.slice(), lengte: tot };
    let j = 0;
    for (let k = 0; k < n; k++) {
      const s = tot * k / (n - 1);
      while (j < p.length - 2 && L[j + 1] < s) j++;
      const d = L[j + 1] - L[j] || 1, t = Math.min(1, Math.max(0, (s - L[j]) / d));
      uit.push([p[j][0] + (p[j + 1][0] - p[j][0]) * t, p[j][1] + (p[j + 1][1] - p[j][1]) * t]);
    }
    return { p: uit, lengte: tot };
  };
  // het midden van de cirkel die het best bij de punten past (kleinste kwadraten)
  R.pasCirkel = p => {
    let mx = 0, my = 0;
    for (const [x, y] of p) { mx += x; my += y; }
    mx /= p.length; my /= p.length;
    let uu = 0, vv = 0, uv = 0, uuu = 0, vvv = 0, uvv = 0, vuu = 0;
    for (const [x, y] of p) { const u = x - mx, v = y - my; uu += u * u; vv += v * v; uv += u * v; uuu += u * u * u; vvv += v * v * v; uvv += u * v * v; vuu += v * u * u; }
    const det = uu * vv - uv * uv;
    if (!(Math.abs(det) > 1e-14)) return null;
    const e = (uuu + uvv) / 2, f = (vvv + vuu) / 2;
    return [mx + (e * vv - uv * f) / det, my + (uu * f - e * uv) / det];
  };
  // de rechte lijn die het best bij de punten past: midden m, richting u, loodrecht n
  R.pasLijn = p => {
    let mx = 0, my = 0;
    for (const [x, y] of p) { mx += x; my += y; }
    mx /= p.length; my /= p.length;
    let xx = 0, yy = 0, xy = 0;
    for (const [x, y] of p) { const u = x - mx, v = y - my; xx += u * u; yy += v * v; xy += u * v; }
    const hoek = 0.5 * Math.atan2(2 * xy, xx - yy), u = [Math.cos(hoek), Math.sin(hoek)];
    return { m: [mx, my], u, n: [-u[1], u[0]] };
  };
  R.oppervlak = poly => { let a = 0; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) a += poly[j][0] * poly[i][1] - poly[i][0] * poly[j][1]; return a / 2; };
  R.zwaartepuntVan = poly => {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const k = poly[j][0] * poly[i][1] - poly[i][0] * poly[j][1];
      a += k; cx += (poly[j][0] + poly[i][0]) * k; cy += (poly[j][1] + poly[i][1]) * k;
    }
    a /= 2;
    return [cx / (6 * a), cy / (6 * a)];
  };
  R.binnen = (pt, poly) => {
    let in_ = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) in_ = !in_;
    }
    return in_;
  };
  R.spiegelVan = (P, C, hoek) => {
    const d = [Math.cos(hoek), Math.sin(hoek)], v = [P[0] - C[0], P[1] - C[1]], t = v[0] * d[0] + v[1] * d[1];
    return [C[0] + 2 * t * d[0] - v[0], C[1] + 2 * t * d[1] - v[1]];
  };
  // de kleinste hoek tussen twee richtingen (in radialen), in graden van 0 tot 180
  R.hoekTussen = (a, b) => { let d = Math.abs(a - b) % (2 * Math.PI); if (d > Math.PI) d = 2 * Math.PI - d; return R.graden(d); };

  // ---------- 1. perfecte cirkel: rond + een kwart van het gat tussen begin en eind, gemeten tegen de straal
  R.cirkel = (ruw, stip) => {
    if (!ruw || ruw.length < 6) return { ongeldig: 'Teken een cirkel in één beweging.' };
    const q = R.herbemonster(ruw, 256).p;
    let c = R.pasCirkel(q);
    if (!c) return { ongeldig: 'Dat is nog geen cirkel. Teken hem helemaal rond!' };
    // hoe ver ga je rond het midden? Verder dan een hele ronde telt alleen de eerste ronde.
    const hoek = [Math.atan2(q[0][1] - c[1], q[0][0] - c[0])];
    for (let i = 1; i < q.length; i++) { const a = Math.atan2(q[i][1] - c[1], q[i][0] - c[0]), v = hoek[i - 1]; hoek.push(v + Math.atan2(Math.sin(a - v), Math.cos(a - v))); }
    const zwaai = Math.abs(hoek[hoek.length - 1] - hoek[0]);
    if (zwaai < 1.5 * Math.PI) return { ongeldig: 'Dat is nog geen hele cirkel. Teken hem helemaal rond!' };
    let p = q;
    if (zwaai > 2 * Math.PI) {
      // knip precies op een hele ronde
      const i = hoek.findIndex(a => Math.abs(a - hoek[0]) >= 2 * Math.PI), v = Math.abs(hoek[i - 1] - hoek[0]), w = Math.abs(hoek[i] - hoek[0]), t = (2 * Math.PI - v) / (w - v || 1);
      p = q.slice(0, i).concat([[q[i - 1][0] + (q[i][0] - q[i - 1][0]) * t, q[i - 1][1] + (q[i][1] - q[i - 1][1]) * t]]);
      c = R.pasCirkel(p) || c;
    }
    const d = p.map(x => af(x, c)), r = d.reduce((a, b) => a + b, 0) / d.length;
    if (r < 0.08) return { ongeldig: 'Die is wel heel klein. Teken hem wat groter!' };
    if (stip && af(stip, c) > r) return { ongeldig: 'Teken hem om de stip heen!' };
    const rond = Math.sqrt(d.reduce((a, b) => a + (b - r) * (b - r), 0) / d.length) / r;
    const gat = af(p[0], p[p.length - 1]) / r;
    // hoe uitgerekt (een ei of een ellips)? verhouding van de langste en kortste kant
    let xx = 0, yy = 0, xy = 0;
    for (const [x, y] of p) { const u = x - c[0], v = y - c[1]; xx += u * u; yy += v * v; xy += u * v; }
    const s = Math.sqrt((xx - yy) * (xx - yy) + 4 * xy * xy), rek = Math.sqrt((xx + yy + s) / Math.max(1e-12, xx + yy - s));
    const fout = rond + 0.25 * gat;
    return { score: R.lin(fout, R.NUL.cirkel), fout, c, r, rond, gat, rek, p };
  };
  // ---------- 2. op de seconde: hoeveel je ernaast zat, gemeten tegen de doeltijd
  R.seconde = (t, T) => { const fout = Math.abs(t - T) / T; return { score: R.lin(fout, R.NUL.seconde), fout, verschil: t - T }; };
  // ---------- 3. het midden: afstand tot het echte midden, gemeten tegen de lengte van de lijn
  R.midden = (pin, a, b) => {
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], L = af(a, b), fout = af(pin, m) / L;
    const u = [(b[0] - a[0]) / L, (b[1] - a[1]) / L], deel = ((pin[0] - a[0]) * u[0] + (pin[1] - a[1]) * u[1]) / L;
    return { score: R.lin(fout, R.NUL.midden), fout, m, deel };
  };
  // ---------- 4. kleurgeheugen: het verschil zoals ogen het zien (CIEDE2000)
  R.hsvNaarRgb = (h, s, v) => {
    h = ((h % 360) + 360) % 360;
    const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  };
  R.rgbNaarLab = ([r, g, b]) => {
    const f = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    const lr = f(r), lg = f(g), lb = f(b);
    const X = (0.4124564 * lr + 0.3575761 * lg + 0.1804375 * lb) / 0.95047;
    const Y = 0.2126729 * lr + 0.7151522 * lg + 0.0721750 * lb;
    const Z = (0.0193339 * lr + 0.1191920 * lg + 0.9503041 * lb) / 1.08883;
    const k = t => (t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116);
    const fx = k(X), fy = k(Y), fz = k(Z);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  };
  R.dE00 = ([L1, a1, b1], [L2, a2, b2]) => {
    const rad = Math.PI / 180, deg = 180 / Math.PI, p7 = Math.pow(25, 7);
    const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cm = (C1 + C2) / 2;
    const G = 0.5 * (1 - Math.sqrt(Math.pow(Cm, 7) / (Math.pow(Cm, 7) + p7)));
    const a1p = (1 + G) * a1, a2p = (1 + G) * a2, C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
    const h = (a, b) => { if (a === 0 && b === 0) return 0; const t = Math.atan2(b, a) * deg; return t < 0 ? t + 360 : t; };
    const h1p = h(a1p, b1), h2p = h(a2p, b2), dLp = L2 - L1, dCp = C2p - C1p;
    let dhp = 0;
    if (C1p * C2p !== 0) { dhp = h2p - h1p; if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360; }
    const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dhp / 2 * rad);
    const Lm = (L1 + L2) / 2, Cmp = (C1p + C2p) / 2;
    let hm;
    if (C1p * C2p === 0) hm = h1p + h2p;
    else if (Math.abs(h1p - h2p) <= 180) hm = (h1p + h2p) / 2;
    else hm = (h1p + h2p + (h1p + h2p < 360 ? 360 : -360)) / 2;
    const T = 1 - 0.17 * Math.cos((hm - 30) * rad) + 0.24 * Math.cos(2 * hm * rad) + 0.32 * Math.cos((3 * hm + 6) * rad) - 0.20 * Math.cos((4 * hm - 63) * rad);
    const dT = 30 * Math.exp(-Math.pow((hm - 275) / 25, 2)), Rc = 2 * Math.sqrt(Math.pow(Cmp, 7) / (Math.pow(Cmp, 7) + p7));
    const Sl = 1 + 0.015 * (Lm - 50) * (Lm - 50) / Math.sqrt(20 + (Lm - 50) * (Lm - 50)), Sc = 1 + 0.045 * Cmp, Sh = 1 + 0.015 * Cmp * T;
    const Rt = -Math.sin(2 * dT * rad) * Rc;
    return Math.sqrt(Math.pow(dLp / Sl, 2) + Math.pow(dCp / Sc, 2) + Math.pow(dHp / Sh, 2) + Rt * (dCp / Sc) * (dHp / Sh));
  };
  R.kleur = (doel, jij) => {
    const A = R.rgbNaarLab(doel), B = R.rgbNaarLab(jij), dE = R.dE00(A, B);
    return { score: R.lin(dE, R.NUL.kleur), dE, dL: B[0] - A[0] };
  };
  // ---------- 5. hoek maken: het verschil in graden
  R.hoek = (alfa, doel) => { const fout = Math.abs(alfa - doel); return { score: R.lin(fout, R.NUL.hoek), fout, verschil: alfa - doel }; };
  // ---------- 6. rechte lijn: gemiddelde afwijking van de best passende rechte lijn, gemeten tegen de lengte
  R.lijn = (ruw, A, B) => {
    if (!ruw || ruw.length < 4) return { ongeldig: 'Trek een lijn van stip naar stip.' };
    const { p, lengte } = R.herbemonster(ruw, 200), L = af(p[0], p[p.length - 1]);
    if (A && B && L < 0.6 * af(A, B)) return { ongeldig: 'Trek hem helemaal van stip naar stip!' };
    if (lengte > 1.6 * L) return { ongeldig: 'In één keer, en niet heen en weer!' };
    const f = R.pasLijn(p), d = p.map(([x, y]) => (x - f.m[0]) * f.n[0] + (y - f.m[1]) * f.n[1]);
    const rms = Math.sqrt(d.reduce((a, b) => a + b * b, 0) / d.length), fout = rms / L;
    return { score: R.lin(fout, R.NUL.lijn), fout, L, p, d, m: f.m, u: f.u, n: f.n };
  };
  // ---------- 7. in drieën: gemiddelde afwijking van de twee sneden, gemeten tegen de lengte
  R.drieen = (s1, s2) => {
    const a = Math.min(s1, s2), b = Math.max(s1, s2), fout = (Math.abs(a - 1 / 3) + Math.abs(b - 2 / 3)) / 2;
    return { score: R.lin(fout, R.NUL.drieen), fout, stukken: [a, b - a, 1 - b] };
  };
  // ---------- 8. even lang: het verschil in lengte
  R.evenlang = (L, L0) => { const fout = Math.abs(L - L0) / L0; return { score: R.lin(fout, R.NUL.evenlang), fout, verhouding: L / L0 }; };
  // ---------- 9. stippen tellen: de verhouding (de helft zeggen is even erg als het dubbele)
  R.stippen = (gok, N) => { const fout = Math.abs(Math.log(Math.max(1, gok) / N)); return { score: R.lin(fout, R.NUL.stippen), fout }; };
  // ---------- 10. waterpas: hoeveel graden de horizon nog scheef staat
  R.waterpas = a => { const fout = Math.abs(a); return { score: R.lin(fout, R.NUL.waterpas), fout }; };
  // ---------- 11. op de maat: tempoafwijking + de helft van hoe onregelmatig je tikt
  R.maat = (tikken, T) => {
    if (!tikken || tikken.length < 3) return { score: 0, fout: Infinity, tempo: 1, wiebel: 1, bpm: 0 };
    const iv = []; for (let i = 1; i < tikken.length; i++) iv.push(tikken[i] - tikken[i - 1]);
    const gem = iv.reduce((a, b) => a + b, 0) / iv.length, sd = Math.sqrt(iv.reduce((a, b) => a + (b - gem) * (b - gem), 0) / iv.length);
    const tempo = Math.abs(gem - T) / T, wiebel = sd / gem, fout = tempo + 0.5 * wiebel;
    return { score: R.lin(fout, R.NUL.maat), fout, tempo, wiebel, bpm: 60000 / gem, sneller: gem < T };

      : bezig
        ? `<b>Ga verder met de dagronde</b><span>${bezig.s.length} van de 5 gedaan · ${bezig.s.reduce((a, b) => a + b, 0)} punten</span>${em}${pijl}`
        : `<b>Dagronde</b><span>${esc(langDatum(dag))} · voor iedereen dezelfde</span>${em}${pijl}`;
    $('b-dag').setAttribute('aria-label', gedaan ? `Dagronde gespeeld: ${gedaan.t} van de 500. Bekijk je uitslag.` : bezig ? 'Ga verder met de dagronde' : 'Speel de dagronde van vandaag');
    const c = [];
    if (O.stat.dag.best) c.push(chip('🏆 Beste dagronde ' + O.stat.dag.best));
    if (reeksNu()) c.push(chip('🔥 ' + reeksNu() + (reeksNu() === 1 ? ' dag' : ' dagen') + ' op rij'));
    if (O.stat.dag.n > 1) c.push(chip('Ø ' + gemiddelde(O.stat.dag)));
    $('start-chips').innerHTML = c.join('');
  }

  function toonOefen() {
    toonScherm('oefen');
    $('oefen-raster').innerHTML = IDS.map(id => {
      const u = UIT[id], r = O.records[id];
      return `<button class="tegel${u.donker ? ' donker' : ''}" type="button" data-id="${id}" style="background:${u.kleur}"><span class="em" aria-hidden="true">${u.emoji}</span><b>${esc(u.naam)}</b><small>${r && r.n ? 'beste ' + r.best : 'nog niet gespeeld'}</small></button>`;
    }).join('');
  }

  function toonUitslag(rd, alleenKijken) {
    toonScherm('uitslag');
    const best = O.stat[rd.modus === 'dag' ? 'dag' : 'vrij'].best;
    $('u-kop').innerHTML = rd.modus === 'dag' ? `Dagronde<small>${esc(langDatum(rd.dag))}</small>` : 'Vrij spel<small>5 willekeurige uitdagingen</small>';
    telOp($('u-totaal'), rd.t, '<small>/500</small>');
    $('u-totaal').setAttribute('aria-label', `${rd.t} van de 500 punten`);
    $('u-record').innerHTML = rd.nieuw && !alleenKijken ? '<span class="nieuw-record">🎉 Nieuw record!</span>' : '';
    $('u-vijf').innerHTML = rd.ids.map((id, i) => { const u = UIT[id]; return `<div class="${u.donker ? 'donker' : ''}" style="background:${u.kleur}" role="img" aria-label="${esc(u.naam)}: ${rd.s[i]} punten"><span aria-hidden="true">${u.emoji}</span><b aria-hidden="true">${rd.s[i]}</b></div>`; }).join('');
    const c = [chip('🏆 Beste ' + best)];
    if (rd.modus === 'dag' && reeksNu()) c.push(chip('🔥 ' + reeksNu() + (reeksNu() === 1 ? ' dag' : ' dagen') + ' op rij'));
    const st = O.stat[rd.modus === 'dag' ? 'dag' : 'vrij']; if (st.n > 1) c.push(chip('Ø ' + gemiddelde(st)));
    $('u-chips').innerHTML = c.join('');
    $('u-per').innerHTML = rd.ids.map((id, i) => `<li><span aria-hidden="true">${UIT[id].emoji}</span><span>${esc(UIT[id].naam)}</span><b>${rd.s[i]}</b>${rd.r && rd.r[i] ? `<small>${esc(rd.r[i])}</small>` : ''}</li>`).join('');
    const kn = $('u-knoppen'); kn.innerHTML = '';
    const knop = (t, soort, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'pil breed ' + soort; b.textContent = t; b.addEventListener('click', fn); kn.appendChild(b); return b; };
    const deel = knop('Deel je uitslag', 'donker', () => deelUitslag(rd));
    if (rd.modus === 'dag') knop('Vrij spelen', 'rand', () => startRonde('vrij'));
    else knop('Nog een ronde', 'rand', () => startRonde('vrij'));
    knop('Naar het menu', 'rand', toonStart);
    const sb = $('sb-gevoel');
    if (rd.modus === 'dag' && window.Scorebord) Scorebord.blokje(sb, 'je dagscore'); else sb.hidden = true;
    $('u-later').textContent = rd.modus === 'dag' ? 'Morgen staat er een nieuwe dagronde klaar.' : 'Alleen de dagronde telt mee voor het scorebord.';
    setTimeout(() => deel.focus({ preventScroll: true }), 50);
  }

  function deelTekst(rd) {
    const url = /^https?:/.test(location.href) ? location.origin + location.pathname : 'https://www.rubensrommelhoekje.nl/opgevoel.html';
    const kop = rd.modus === 'dag' ? `Op Gevoel ${kortDatum(rd.dag)} · ${rd.t}/500` : `Op Gevoel vrij spel · ${rd.t}/500`;
    const r = reeksNu();
    return [kop, rd.ids.map((id, i) => `${UIT[id].emoji} ${rd.s[i]}`).join('  '), rd.modus === 'dag' && r > 1 ? `🔥 ${r} dagen op rij` : '', url].filter(Boolean).join('\n');
  }
  async function deelUitslag(rd) {
    const tekst = deelTekst(rd);
    if (navigator.share && matchMedia('(pointer: coarse)').matches) { try { await navigator.share({ text: tekst }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(tekst); toast('Gekopieerd! Plak het waar je wilt.'); return; } catch (e) {}
    try { const t = document.createElement('textarea'); t.value = tekst; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); if (ok) { toast('Gekopieerd! Plak het waar je wilt.'); return; } } catch (e) {}
    window.prompt('Kopieer je uitslag:', tekst);
  }

  function toonRecords() {
    toonScherm('records');
    const d = O.stat.dag, v = O.stat.vrij;
    const vak = (b, t) => `<div><b>${b}</b><span>${t}</span></div>`;
    $('r-recs').innerHTML = vak(d.best || '–', 'beste dagronde') + vak(d.n ? gemiddelde(d) : '–', 'gemiddelde dagronde') + vak(reeksNu(), 'dagen op rij') + vak(O.reeks.beste, 'langste reeks') + vak(d.n, 'dagrondes gespeeld') + vak(v.best || '–', 'beste vrij spel');
    const dagen = Object.keys(O.dagen).sort().slice(-14);
    $('r-staaf').innerHTML = dagen.map(k => `<i style="height:${Math.max(4, O.dagen[k].t / 5)}%" data-t="${O.dagen[k].t}" data-d="${kortDatum(k).replace(/ .*/, '')}" title="${esc(kortDatum(k))}: ${O.dagen[k].t}" aria-label="${esc(kortDatum(k))}: ${O.dagen[k].t} punten"></i>`).join('');
    $('r-per').innerHTML = IDS.map(id => {
      const u = UIT[id], r = O.records[id];
      return `<button class="tegel${u.donker ? ' donker' : ''}" type="button" data-id="${id}" style="background:${u.kleur}"><span class="em" aria-hidden="true">${u.emoji}</span><b>${esc(u.naam)}</b><small>${r && r.n ? `beste ${r.best} · gem. ${Math.round(r.som / r.n)} · ${r.n}×` : 'nog niet gespeeld'}</small></button>`;
    }).join('');
  }

  // ================================================================ knoppen en invoer
  $('b-dag').addEventListener('click', () => { Geluid.wek(); const dag = vandaag(); if (O.dagen[dag]) toonUitslag(Object.assign({ modus: 'dag', dag }, O.dagen[dag]), true); else startRonde('dag'); });
  $('b-vrij').addEventListener('click', () => { Geluid.wek(); startRonde('vrij'); });
  $('b-oefen').addEventListener('click', toonOefen);
  $('b-records').addEventListener('click', toonRecords);
  $('oefen-raster').addEventListener('click', e => { const t = e.target.closest('[data-id]'); if (t) { Geluid.wek(); startRonde('oefen', [t.dataset.id]); } });
  $('r-per').addEventListener('click', e => { const t = e.target.closest('[data-id]'); if (t) { Geluid.wek(); startRonde('oefen', [t.dataset.id]); } });
  document.addEventListener('click', e => { const t = e.target.closest('[data-naar]'); if (!t) return; if (t.dataset.naar === 'oefen') toonOefen(); else toonStart(); });
  $('b-volgende').addEventListener('click', volgende);
  $('b-nogeens').addEventListener('click', () => { if (performance.now() < volgendeVanaf) return; ronde.s = []; ronde.r = []; startUitdaging(); });
  $('b-stop').addEventListener('click', () => {
    const dag = ronde && ronde.modus === 'dag';
    stopActief(); toonStart();
    if (dag) toast('Je dagronde wacht op je. Je gaat verder waar je was.');
  });
  // geluid aan of uit
  function zetGeluidKnop() { const k = $('b-geluid'); k.setAttribute('aria-pressed', O.inst.geluid ? 'true' : 'false'); k.setAttribute('aria-label', O.inst.geluid ? 'Geluid staat aan' : 'Geluid staat uit'); }
  $('b-geluid').addEventListener('click', () => { O.inst.geluid = !O.inst.geluid; bewaar(); zetGeluidKnop(); if (O.inst.geluid) Geluid.klik(); else Geluid.uit(); });
  zetGeluidKnop();
  // instellingen
  const dlg = $('d-inst');
  $('b-inst').addEventListener('click', () => {
    $('i-geluid').checked = O.inst.geluid; $('i-trillen').checked = O.inst.trillen; $('i-kleur').checked = O.inst.geenKleur; $('i-geluidsuit').checked = O.inst.geenGeluid;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  });
  const instWeg = () => { O.inst.geluid = $('i-geluid').checked; O.inst.trillen = $('i-trillen').checked; O.inst.geenKleur = $('i-kleur').checked; O.inst.geenGeluid = $('i-geluidsuit').checked; bewaar(); zetGeluidKnop(); toonStart(); };
  dlg.addEventListener('change', instWeg);
  $('b-inst-dicht').addEventListener('click', () => { instWeg(); if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); });

  // het speelveld: muis, vinger en pen
  doek.addEventListener('pointerdown', e => {
    laatsteInvoer = 'wijzer';
    if (!A || A.af || wijzer !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); Geluid.wek();
    wijzer = e.pointerId; try { doek.setPointerCapture(e.pointerId); } catch (x) {}
    const p = naarVeld(e);
    if (A.loep && e.pointerType !== 'mouse') { loep.aan = true; loep.p = p; }
    if (A.neer) A.neer(p, e);
  });
  doek.addEventListener('pointermove', e => {
    if (e.pointerId !== wijzer || !A) return;
    const lijst = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const x of (lijst.length ? lijst : [e])) { const p = naarVeld(x); if (A.beweeg) A.beweeg(p, x); if (loep.aan) loep.p = p; }
    if (A.voorspel && e.getPredictedEvents) A.voorspel(e.getPredictedEvents().map(naarVeld));
  });
  const laatLos = e => { if (e.pointerId !== wijzer) return; wijzer = null; loep.aan = false; if (A && A.los) A.los(naarVeld(e), e); };
  doek.addEventListener('pointerup', laatLos);
  doek.addEventListener('pointercancel', laatLos);
  doek.addEventListener('wheel', e => { if (A && A.wiel && !A.af) { e.preventDefault(); A.wiel(e); } }, { passive: false });
  doek.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('pointerdown', e => { if (e.target !== doek) laatsteInvoer = 'wijzer'; }, true);
  document.addEventListener('keydown', e => {
    if (e.key === 'Tab' || e.key.startsWith('Arrow') || e.key === 'Enter' || e.key === ' ') laatsteInvoer = 'toets';
    if (document.body.dataset.scherm !== 'spel' || !A || dlg.open) return;
    if (A.af) {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat && e.target.tagName !== 'BUTTON') { e.preventDefault(); if (ronde.modus === 'oefen') $('b-nogeens').click(); else volgende(); }
      return;
    }
    if (A.toets && A.toets(e)) e.preventDefault();
  });
  document.addEventListener('keyup', e => { if (A && !A.af && A.toetsOp) A.toetsOp(e); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && A && !A.af && A.los && wijzer === null) A.los([0, 0], {}); });
  addEventListener('blur', () => { if (A && !A.af && A.toetsOp) A.toetsOp({ key: ' ' }); });
  // een tikje op het geluid of een knop maakt de geluidskaart wakker (nodig op telefoons)
  addEventListener('pointerdown', () => Geluid.wek(), { once: true, capture: true });

  // ================================================================ scorebord en testhaak
  if (window.Scorebord && O.stat.dag.best) Scorebord.stuur('gevoel', O.stat.dag.best, reeksNu());
  window.__opgevoel = {
    REKEN: R, UIT, IDS,
    staat: () => O,
    ronde: () => ronde,
    actief: () => A,
    veld: () => Object.assign({}, V),
    // veldmaten naar schermpunten, voor tests met een echte muis of vinger
    naarScherm: p => { const r = doek.getBoundingClientRect(); return [r.left + V.ox + p[0] * V.S, r.top + V.oy + p[1] * V.S]; },
    dagIds, dagVolgorde, startRonde, toonStart, toonRecords, toonOefen,
    volgende: () => { volgendeVanaf = 0; volgende(); },
    // alleen voor tests: rond de uitdaging die nu loopt af met een vaste score
    klaarMet: score => { if (A && !A.af) klaar({ score, regel: 'test' }); },
    wis: () => { O = leeg(); bewaar(); toonStart(); },
    herlaad: () => { O = laad(); },
  };
  toonStart();
})();
</script>
</body>
</html>
