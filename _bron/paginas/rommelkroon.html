    const leeg = [...Array(n).keys()].filter(r => cel[r * n + opl[r]] !== 2);
    if (!leeg.length) return;
    const r = leeg[Math.floor(Math.random() * leeg.length)], i = r * n + opl[r]; zet(i, 2); $('bord').children[i].classList.add('hint');
  });
  $('b-terug').addEventListener('click', () => { bewaarBezig(); clearInterval(klok); $('spel').hidden = true; $('overzicht').hidden = false; tekenOverzicht(); });
  // ---------------- venster
  function dialoog(html) { $('dlg-in').innerHTML = html; if (!$('dlg').open) $('dlg').showModal(); }
  $('dlg').addEventListener('click', e => { const k = e.target.closest('[data-k]'); if (e.target === $('dlg')) $('dlg').close(); if (!k) return; $('dlg').close(); if (k.dataset.k === 'volgende') start(nr + 1); if (k.dataset.k === 'overzicht') { $('spel').hidden = true; $('overzicht').hidden = false; tekenOverzicht(); } });
  $('b-regels').addEventListener('click', () => dialoog(`<h2>Spelregels</h2><p>Zet in elke <b>rij</b>, elke <b>kolom</b> en elk <b>gekleurd vlak</b> precies één kroon.</p><p>Kronen mogen elkaar <b>niet raken</b>, ook niet schuin.</p><p>Tik één keer voor een kruisje (hier kan geen kroon), nog eens voor een kroon, en nog eens om het vakje leeg te maken. Sleep over het bord om snel kruisjes te zetten. Met <b>Automatische kruisjes</b> zet het spel zelf kruisjes op plekken die niet meer kunnen.</p><p>Elke puzzel heeft precies één oplossing, dus je hoeft nooit te gokken. Een hint kost 15 seconden.</p><div class="balk"><button class="knop hoofd" data-k="dicht" type="button">Begrepen</button></div>`));
  // ---------------- scorebord
  function stuurScore() { if (window.Scorebord) Scorebord.stuur('kroon', aantalKlaar(), Object.values(opslag.opgelost).reduce((a, o) => a + o.tijd, 0)); }
  tekenOverzicht();
  if (!localStorage.getItem(KEY)) setTimeout(() => $('b-regels').click(), 400);
  if (window.Scorebord) { stuurScore(); Scorebord.blokje($('sb-kroon'), 'opgeloste puzzels'); }
  window.__kroon = { start, zet, get cel() { return cel; }, PUZZELS, opslag };
})();
</script>
