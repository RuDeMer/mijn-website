<style>
:root { --nacht: #10283E; --papier: #FBF6E9; --manila: #F2DDA0; --inkt: #231A26; --rood: #C8323C; --goud: #E9B949; --zee: #2C86A8; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; background: #0B1C2C; color: var(--inkt); font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-tap-highlight-color: transparent; }
.kop { display: flex; align-items: center; gap: .7rem; padding: .4rem .8rem; background: var(--nacht); color: var(--papier); z-index: 5; flex: none; }

/* ===== de interface: een havenlogboek met pixelranden, labeltape en koperen instrumenten ===== */

.knop.hoofd { background: var(--rood); color: #fff; } .knop.goud { background: var(--goud); } .knop[aria-pressed="false"] { opacity: .6; } .knop:disabled { opacity: .45; cursor: default; }
/* getrapte pixelhoeken */
.pixhoek { clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 2px 4px, 2px 2px, 4px 2px); }

#veld .knop { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 1rem; letter-spacing: .01em; border-radius: 0; padding: .5rem .95rem .6rem; background: #FBF4E2; color: var(--inkt); border: 3px solid var(--inktrand); box-shadow: inset 0 -4px 0 rgba(60,40,30,.22), inset 0 3px 0 rgba(255,255,255,.7); transition: transform .06s; }

#veld .knop.hoofd { background: #C8323C; color: #FFF6E8; box-shadow: inset 0 -4px 0 #8E1F2A, inset 0 3px 0 #E8606A; text-shadow: 0 2px 0 #7A1A24; }
#veld .knop.goud { background: #E9B949; color: #2A1E10; box-shadow: inset 0 -4px 0 #B98C25, inset 0 3px 0 #FFE29A; }
#veld .knop:disabled { opacity: .5; filter: grayscale(.5); }
#veld .knop:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #FFFFFF, inset 0 0 0 6px #2F6FB5; }
.kop .knop:focus-visible { outline: 3px solid #2F6FB5; outline-offset: 2px; }
#veld { position: relative; flex: 1; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: #06121E; }
#doek { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
#zwart { position: absolute; inset: 0; background: #06121E; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 19; } /* onder de vensters (20) en gesprekken (25): die zijn altijd te zien */
#zwart.aan { opacity: 1; }
/* ---- kaarten: papier in een inktrand, met een koperen lijntje en de kop op labeltape */
.scherm { position: absolute; inset: 0; display: grid; place-items: center; padding: .8rem; z-index: 20; background: radial-gradient(ellipse at center, rgba(6,18,30,.35), rgba(6,18,30,.72)); overflow: auto; }
.kaart { --kx: 1.35rem; --kb: 1.2rem; position: relative; max-width: 34rem; width: 100%; max-height: calc(100% - .5rem); overflow: auto; padding: 1.25rem var(--kx) var(--kb); color: var(--inkt);
  background: #FBF4E2 repeating-linear-gradient(0deg, transparent 0 23px, rgba(47,76,143,.07) 23px 24px);
  border: 4px solid var(--inktrand); border-bottom-width: 9px;
  box-shadow: inset 0 0 0 3px #FFFBF0, inset 0 0 0 5px var(--koper), inset 0 0 0 7px #FBF4E2; }
.kaart.breed { max-width: 46rem; }

.kaart h2:not([style]) { display: inline-block; margin: 0 0 .7rem; padding: .2rem .7rem .25rem; font-family: var(--pix); font-weight: 600; font-size: 1.3rem; letter-spacing: .04em; color: #F4F1E8; background: var(--tape); transform: rotate(-1deg); box-shadow: 0 2px 0 rgba(0,0,0,.25); clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 50%, 100% 100%, 0 100%, 5px 50%); text-shadow: 0 -1px 0 #000; }
.kaart h3 { margin: .9rem 0 .3rem; font-family: var(--pix); font-weight: 600; font-size: 1.05rem; color: #2F4C8F; } .kaart p { margin: .45rem 0; line-height: 1.5; }
.rij { display: flex; gap: .55rem; flex-wrap: wrap; margin-top: .9rem; } .rij .knop { font-size: 1.05rem; }
/* de knoppen onderaan een venster blijven altijd in beeld, ook als het venster moet scrollen (liggende telefoon) */
.kaart > .rij:last-child { position: sticky; z-index: 1; bottom: calc(7px - var(--kb)); margin: .9rem calc(7px - var(--kx)) calc(7px - var(--kb)); padding: .7rem calc(var(--kx) - 7px) calc(var(--kb) - 7px); background: linear-gradient(rgba(251,244,226,0), #FBF4E2 .6rem); }
.klein { font-size: .87rem; color: #5E5040; }
.lijst { display: grid; gap: .45rem; margin: .55rem 0; }
.regel { display: flex; align-items: center; gap: .65rem; background: #FFFDF6; padding: .5rem .7rem; box-shadow: inset 0 0 0 2px #3A2E3A, inset 0 -4px 0 2px #E9DFC6; }
.regel canvas, .tegel canvas { image-rendering: pixelated; flex: none; }
.regel .naam { font-weight: 800; } .regel .meer { margin-left: auto; text-align: right; font-weight: 700; white-space: nowrap; font-family: var(--pix); }
.regel.kies { cursor: pointer; transition: transform .06s; } .regel.kies:hover { background: #FFF6DE; } .regel.kies:active { transform: translateY(1px); }
.regel.kies[aria-pressed="true"] { background: #FFE9A8; box-shadow: inset 0 0 0 3px var(--inktrand), inset 0 -4px 0 3px #E9B949; }
.regel.kies[aria-pressed="true"] .naam::before { content: "✓ "; color: #2E6A2E; }
.regel.kies:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #2F6FB5, inset 0 -4px 0 3px #9FC4E8; }
.regel.uit { opacity: .55; filter: grayscale(.4); }
.tegels { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.2rem, 1fr)); gap: .5rem; margin: .5rem 0; }
.tegel { background: #FFFDF6; padding: .55rem; text-align: center; font-size: .85rem; box-shadow: inset 0 0 0 2px #3A2E3A, inset 0 -4px 0 2px #E9DFC6; }
.tegel b { display: block; } .tegel.onbekend { opacity: .55; }
button.tegel { font: inherit; color: inherit; border: 0; cursor: pointer; width: 100%; }
button.tegel:hover { box-shadow: inset 0 0 0 2px #3A2E3A, inset 0 -4px 0 2px #F2C85A; } button.tegel:focus-visible { outline: 3px solid #2F6FB5; outline-offset: 2px; }
.boek-kop { margin: .8rem 0 .2rem; font-size: 1rem; } .boek-kop small { font-weight: 400; color: #5A4E40; }
.geld { font-weight: 800; color: #2E6A2E; }
.tabs { display: flex; gap: .25rem; flex-wrap: wrap; margin: .2rem 0 .7rem; border-bottom: 3px solid var(--inktrand); padding-bottom: 0; }
.tabs button { font-family: var(--pix); font-weight: 600; font-size: .98rem; border: 0; padding: .4rem .85rem .35rem; background: #EDE2C6; color: #4A3E30; cursor: pointer; box-shadow: inset 0 0 0 2px #3A2E3A; clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%, 0 4px); }
.tabs button[aria-selected="true"] { background: var(--marine); color: #F4E2B0; box-shadow: inset 0 0 0 2px var(--inktrand), inset 0 3px 0 2px #2E4A6E; }
.tabs button:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #2F6FB5; }
.sterren { color: #C99A2E; font-size: 1.6rem; letter-spacing: .08em; text-shadow: 0 2px 0 #7A5A1A; }
.stempel { display: inline-block; transform: rotate(-6deg); border: 3px solid var(--rood); color: var(--rood); font-family: var(--pix); font-weight: 700; padding: .1rem .55rem; letter-spacing: .08em; box-shadow: inset 0 0 0 2px rgba(200,50,60,.25); }
/* titelscherm */
.kaart.titelkaart { text-align: left; max-width: 36rem; }
.kaart.titelkaart h1 { font-size: clamp(2.6rem, 10vw, 4rem); color: #F2C85A; text-shadow: 3px 0 0 #1A1420, -3px 0 0 #1A1420, 0 3px 0 #1A1420, 0 -3px 0 #1A1420, 3px 3px 0 #1A1420, -3px 3px 0 #1A1420, 3px -3px 0 #1A1420, -3px -3px 0 #1A1420, 0 7px 0 #2F4C8F, 3px 7px 0 #2F4C8F, -3px 7px 0 #2F4C8F; margin-bottom: .6rem; }
.kaart.titelkaart h1 small { color: #2F4C8F; text-shadow: none; margin-top: .9rem; }
/* ---- gesprek: patrijspoort met het portret, de naam op labeltape */
#gesprek { position: absolute; left: 50%; bottom: .7rem; transform: translateX(-50%); width: min(46rem, calc(100% - 1rem)); z-index: 25; display: flex; gap: .9rem; align-items: center; padding: .85rem 1rem .85rem .85rem; cursor: pointer;
  background: #FBF4E2; border: 4px solid var(--inktrand); border-bottom-width: 8px; box-shadow: inset 0 0 0 3px #FFFBF0, inset 0 0 0 5px var(--koper); }
#gesprek canvas { width: 84px; height: 80px; image-rendering: pixelated; flex: none; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #DCEFF6, #9FC9DC); box-shadow: 0 0 0 4px var(--koper), 0 0 0 7px var(--inktrand), inset 0 -6px 0 rgba(20,35,58,.18); margin: 6px; }

@keyframes wip { 50% { transform: translateY(3px); } }
/* ---- HUD: koperen instrumentplaatjes met pixel-iconen */
#hud { position: absolute; left: .5rem; top: .5rem; right: .5rem; z-index: 10; display: flex; gap: .45rem; align-items: flex-start; pointer-events: none; flex-wrap: wrap; }
.hud-blok { display: flex; align-items: center; gap: .45rem; background: linear-gradient(#1C3150, #14233A); color: #FFF6E0; padding: .32rem .6rem .36rem .45rem; font-family: var(--pix); font-weight: 600; font-size: 1rem; line-height: 1.05; box-shadow: inset 0 0 0 2px var(--inktrand), inset 0 0 0 4px #8A6A2A, inset 0 0 0 5px var(--koperlicht), inset 0 -3px 0 5px rgba(0,0,0,.25); }
.hud-blok > div { min-width: 0; }
.hud-blok span, .regel .meer, .bon, .geld { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud-blok small { font-family: var(--pix); }
.hud-blok small { display: block; font-weight: 500; font-size: .8rem; color: #F0D27A; letter-spacing: .04em; margin-bottom: .1rem; }

.zuurstof { width: min(16rem, 46vw); } .zuurstof > div { flex: 1; }

.balk.laag i { background: repeating-linear-gradient(90deg, #FFD86A 0 7px, #D9A63E 7px 9px); } .balk.kritiek i { background: repeating-linear-gradient(90deg, #FF6A72 0 7px, #C8323C 7px 9px); animation: knipper .6s steps(2) infinite; }

.sterren-klein { color: #F2C85A; letter-spacing: .05em; }
/* ---- aanraakbediening: koperen knoppen */

<script>
(function () {

    if (v && K && K.code === v.code) { K.staat = Object.assign(K.staat || {}, v.staat || {}); localStorage.setItem('rommelhoekje-koppel', JSON.stringify(K)); }
    sessionStorage.removeItem('koppel-herstel'); sessionStorage.removeItem('koppel-herstel-v'); if (!['koppel-hulp', 'koppel-vervangen', 'koppel-samen', 'koppel-geweigerd', 'koppel-opnieuw', 'koppel-terug'].some(x => sessionStorage.getItem(x))) sessionStorage.setItem('koppel-melding', '1'); } } catch (e) {}
})();
(function () {
  // rommelhoekje-speler: gedeeld door alle pagina's van de site (zelfde adres = zelfde opslag)
  const SKEY = 'rommelhoekje-speler';
  let speler = null;
  try { speler = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { speler = null; }

    .then(r => (r.ok ? r.json() : {})).catch(() => ({}))

    });
  const adres = inst => (inst.scoreUrl || '').replace(/\/+$/, '');
  function nieuwGeheim() {

  }
  async function mijnId() {

  }
  const laatst = {};
  // ---------- alle spellen bijwerken, vanaf elke pagina van de site
  // Elk spel bewaart zijn beste score in deze browser. Doe je mee, dan sturen we die vanzelf door,
  // ook als je niet op de scorebordpagina komt. Alleen wat nieuw of beter is, gaat de deur uit.
  const lees = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  // De Vlaaienbakker: een getal boven 10^300 staat in zijn opslag op dat plafond, en precies als tekst in s.groot[pad] ("4.2e400").
  // vbLog geeft de 10-log (0 of niets: -Infinity), net als de scoreserver.
  const vbLog = (s, pad) => {
    if (!s) return -Infinity;
    const P = pad.startsWith('gilde.') ? 1e270 : 1e300, x = pad.split('.').reduce((o, k) => (o == null ? undefined : o[k]), s);
    const r = s.groot && /^\s*(\d+(?:\.\d+)?)(?:e([+-]?\d+))?\s*$/i.exec(String(s.groot[pad] || '')), g = r && parseFloat(r[1]) > 0 ? Math.log10(parseFloat(r[1])) + (r[2] ? parseInt(r[2], 10) : 0) : NaN;
    if (typeof x !== 'number' || !isFinite(x)) return isFinite(g) ? g : -Infinity;

  };
  // spellen die hun score als 10-log sturen, en borden die een oude scoreserver nog niet kent (dan zeggen we niets)
  const LOG_SPEL = { vlaai: 1 }, NIEUW_BORD = { oerknal: 1, vbpres: 1 };
  const vkey = spel => (LOG_SPEL[spel] ? spel + '~log' : spel);
  const BRONNEN = {
    gevoel: () => { const s = lees('opgevoel-v1'); return s && s.stat && s.stat.dag && s.stat.dag.best ? [s.stat.dag.best, (s.reeks && s.reeks.lengte) || 0] : null; },
    groepjes: () => { const s = lees('rommelgroepjes-v1'); if (!s || !s.p) return null; let b = 0, r = 0, v = -9, z = 0; for (const d of Object.keys(s.p).map(Number).filter(n => n > 0).sort((a, c) => a - c)) { const x = String(s.p[d]); if (x[0] === 'w') { r = d === v + 1 ? r + 1 : 1; v = d; b = Math.max(b, r); } if ((x[0] === 'w' || x[0] === 'a') && x[1] === '0') z++; } return b ? [b, z] : null; },
    reclame: () => { const s = lees('reclame-v1'); if (!s || !s.s) return null; let n = 0; for (const v of Object.values(s.s)) for (const c of String(v)) n += Math.min(3, +c || 0); return n ? [n, (s.dag && s.dag.b) || 0] : null; },
    huis: () => { const s = lees('huisopstelten-v1'); return s && s.besteDag > 0 ? [Math.round(s.besteDag), Object.values(s.k || {}).reduce((n, k) => n + ((k && k.s) || []).filter(Boolean).length, 0)] : null; },
    duiker: () => { const s = lees('rubendeduiker-v1'); return s && s.beste && s.beste.avond > 0 ? [Math.round(s.beste.avond), Object.keys(s.boek || {}).length] : null; },
    wheels: () => { const s = lees('rommelwheels-v1'); if (!s || !s.levels) return null; let p = 0, st = 0; for (const r of Object.values(s.levels)) { p += r.punten || 0; st += (r.gehaald ? 1 : 0) + (r.alle ? 1 : 0) + (r.heel ? 1 : 0); } return p ? [p, st] : null; },
    vlaai: () => { const s = lees('vlaaienbakker-v1'), L = vbLog(s, 'totaal'); return L >= 0 ? [L, Math.max(0, vbLog(s, 'vpsNu'))] : null; },
    oerknal: () => { const s = lees('vlaaienbakker-v1'), o = s && s.oer; return o && o.n > 0 ? [Math.floor(Math.pow(10, Math.min(15, vbLog(s, 'oer.ooit')))), o.n] : null; },
    vbpres: () => { const s = lees('vlaaienbakker-v1'); return s && Array.isArray(s.pres) && s.pres.length ? [s.pres.length, s.mijl || 0] : null; },
    woord: () => { const s = lees('rommelwoord-stats-v1'); return s && s.besteReeks > 0 ? [s.besteReeks, s.gewonnen || 0] : null; },
    poker: () => { const s = lees('rommelpoker-record'); return s && s.verst > 0 ? [s.verst, Math.round(s.beste || 0)] : null; },
    bel: () => { const s = lees('rommelbel-v1'); return s && s.eindeloos ? [s.eindeloos, Object.values(s.sterren || {}).reduce((a, b) => a + b, 0)] : null; },
    rob: () => { const s = lees('rommelrob-v1'); return s && s.best ? [s.best, s.totaal || 0] : null; },
    arend: () => { const s = lees('rommelarend-v1'); if (!s) return null; const p = (s.ontdekt || []).length * 100 + (s.veren || []).length * 25 + Object.values(s.races || {}).reduce((a, r) => a + ({ goud: 300, zilver: 200, brons: 100 }[r.medaille] || 0), 0); return p ? [p, (s.ontdekt || []).length] : null; },
    kroon: () => { const s = lees('rommelkroon-v1'); if (!s || !s.opgelost) return null; const o = Object.values(s.opgelost); return o.length ? [o.length, o.reduce((a, x) => a + x.tijd, 0)] : null; },
    ritme: () => { const s = lees('rommelritme-v1'); if (!s || !s.best) return null; const som = Object.values(s.best).reduce((a, b) => a + b, 0); return som > 0 ? [som, Object.values(s.pogingen || {}).reduce((a, b) => a + b, 0)] : null; },
    vlieger: () => { const s = lees('vouwvlieger-v1'); return s && s.best > 0 ? [s.best, s.sterren || 0] : null; },
    beest: () => { const s = lees('rommelbeesten-v1'); if (!s || !s.bezit) return null; let u = 0, t = 0; for (const [id, b] of Object.entries(s.bezit)) { const n = (b[0] || 0) + (b[1] || 0); t += n; if (n > 0 && /^zs/.test(id)) u++; } return u ? [u, t] : null; },
  };
  const VKEY = 'rommelhoekje-verstuurd';
  const onthoud = (spel, score, extra) => { const v = lees(VKEY) || {}, k = vkey(spel); const o = v[k]; if (!o || o.naam !== speler.naam || score > o.s || (score === o.s && extra > o.e)) { v[k] = { s: score, e: extra, naam: speler.naam }; try { localStorage.setItem(VKEY, JSON.stringify(v)); } catch (e) {} } };

  async function synchroniseer() {

      }

  }

  const API = {
    klaar,
    actief: () => klaar.then(inst => !!adres(inst)),
    doetMee: () => !!(speler && speler.naam),
    naam: () => (speler && speler.naam) || '',
    mijnId,
    // meedoen of je naam veranderen; een lege naam = stoppen
    async zetNaam(naam) {
      naam = String(naam || '').replace(/\s+/g, ' ').trim().slice(0, 16);
      if (!naam) { speler = null; bewaar(); return { ok: true }; }
      const bestond = !!(speler && speler.geheim);
      speler = { geheim: (speler && speler.geheim) || nieuwGeheim(), naam };
      bewaar();

      const inst = await klaar;
      if (bestond && adres(inst)) {
        try { const r = await metTijd(adres(inst) + '/naam', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ geheim: speler.geheim, naam }) }); const j = await r.json().catch(() => ({})); if (!r.ok) { uitslag = { ok: false, fout: j.fout || 'Naam veranderen lukte niet.' }; document.dispatchEvent(new CustomEvent('scorebord-fout', { detail: uitslag.fout })); } } catch (e) {}
      }

    },
    // een score insturen (de server bewaart alleen je beste). De Vlaaienbakker stuurt de 10-log (LOG_SPEL): dan gaat ook het gewone getal

    async stuur(spel, score, extra, direct) {
      laatst[spel] = [score, extra || 0];
      if (!API.doetMee()) return null;
      const inst = await klaar; if (!adres(inst)) return null;
      const rauw = L => (L < 15 ? Math.round(Math.pow(10, L)) : Math.pow(10, Math.min(300, L)));
      const lijf = LOG_SPEL[spel] ? { spel, naam: speler.naam, geheim: speler.geheim, score: rauw(score), extra: rauw(extra || 0), log: score, elog: extra || 0 } : { spel, naam: speler.naam, geheim: speler.geheim, score, extra: extra || 0 };
      try {
        const r = await metTijd(adres(inst) + '/score', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, keepalive: true, body: JSON.stringify(lijf) });
        const j = await r.json().catch(() => ({}));
        if (r.ok) onthoud(spel, score, extra || 0);
        if (!r.ok && j.fout && !NIEUW_BORD[spel]) document.dispatchEvent(new CustomEvent('scorebord-fout', { detail: j.fout }));
        return r.ok ? j : null;
      } catch (e) { return null; }
    },
    async lijsten() {
      const inst = await klaar; if (!adres(inst)) return null;
      const r = await metTijd(adres(inst) + '/scores', { cache: 'no-store' });

    },
    async stopEnVerwijder() {
      const inst = await klaar;
      if (speler && adres(inst)) { try { await metTijd(adres(inst) + '/verwijder', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ geheim: speler.geheim }) }); } catch (e) {} }
      speler = null; bewaar();
      document.dispatchEvent(new CustomEvent('scorebord-naam'));
    },
    // een klein blokje om mee te doen, voor in een spel
    async blokje(el, wat) {
      if (!el) return;
      el.dataset.sbWat = wat || 'je score';
      if (!(await API.actief())) { el.hidden = true; return; }
      tekenBlok(el);
    },
  };
  function tekenBlok(el) {

    el.classList.add('sb-blok');
    const p = document.createElement('p');
    if (API.doetMee()) {
      p.innerHTML = 'Je doet mee aan het <a href="scorebord.html">scorebord</a> als <b></b>.';
      p.querySelector('b').textContent = speler.naam;
      el.appendChild(p);
      return;
    }
    p.textContent = 'Zet ' + el.dataset.sbWat + ' op het scorebord van het rommelhoekje. Kies een naam:';
    const f = document.createElement('form'); f.className = 'sb-mee';
    f.innerHTML = '<input maxlength="16" placeholder="Je naam" aria-label="Je naam voor het scorebord" autocomplete="nickname"><button type="submit">Doe mee</button>';
    f.addEventListener('submit', async e => { e.preventDefault(); const n = f.querySelector('input').value.trim(); if (n.length < 2) { f.querySelector('input').focus(); return; } await API.zetNaam(n); });

  const st = document.createElement('style');
  st.textContent = '.sb-blok{background:var(--papier,#FBF6E9);color:var(--inkt,#1F2333);border-radius:8px;padding:.6rem .8rem;margin-top:.8rem;font-size:.92rem;line-height:1.4;text-align:left}.sb-blok p{margin:0 0 .4rem}.sb-blok p:last-child{margin:0}.sb-blok a{color:var(--rood-d,#9E2430);font-weight:700}.sb-mee{display:flex;gap:.4rem;flex-wrap:wrap}.sb-mee input{flex:1 1 8rem;min-width:0;font:inherit;padding:.4rem .6rem;border-radius:6px;border:2px solid var(--manila-d,#D9BE78);background:#fff}.sb-mee button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:.4rem .8rem;background:var(--rood,#C8323C);color:#fff;cursor:pointer}.sb-blok small{display:block;color:var(--zacht,#5E5643);margin-top:.35rem;font-size:.78rem}';
  document.head.appendChild(st);

  // ==== REGELS begin
  // De regels voor het koppelen: hoe twee versies van een spel samengaan. Deze tekst staat letterlijk hetzelfde in het gedeelde
  // scorebord-blok van de site en in de scoreserver (de controle van de gedeelde blokken kijkt dat na). Verander hem dus altijd op allebei.
  //   b = de gezamenlijke basis (de laatste versie waar beide apparaten het over eens waren; mag ontbreken),
  //   s = wat de server al had (dat kwam eerst binnen), i = wat er nu binnenkomt (dat kwam later).
  // De soorten regels: samen (wat op een van de twee gehaald is, blijft), beste (hoogste of snelste), teller (wat er op elk apparaat bij
  // kwam, telt op; zonder basis de hoogste), keuze (een instelling: de laatste verandering wint), lopend (iets dat nog bezig is: de laatste
  // versie, nooit gemengd), eerste (dagpuzzels: de eerste uitslag van een dag telt) en geheel (één hele versie wint: die met de meeste
  // voortgang). Nooit geld, muntjes, kaarten of spullen samenvoegen: dan zou je iets kunnen verdubbelen. Een nieuw spel? Zet het in SPEL.
  const REGELS = (() => {
    const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
    const getal = (x, d = 0) => (typeof x === 'number' && isFinite(x) ? x : d);
    const lijst = x => (Array.isArray(x) ? x : []);
    const aantal = o => (isObj(o) ? Object.keys(o).length : 0);
    const som = o => (isObj(o) ? Object.values(o).reduce((a, x) => a + getal(x), 0) : 0);
    // hetzelfde, ook als de velden in een andere volgorde staan
    const zelfde = (a, b) => { if (a === b) return true; if (typeof a !== typeof b || !a || !b || typeof a !== 'object') return false; if (Array.isArray(a)) return Array.isArray(b) && a.length === b.length && a.every((x, k) => zelfde(x, b[k])); if (Array.isArray(b)) return false; const ka = Object.keys(a).filter(k => a[k] !== undefined), kb = Object.keys(b).filter(k => b[k] !== undefined); return ka.length === kb.length && ka.every(k => zelfde(a[k], b[k])); };
    const num = x => typeof x === 'number' && isFinite(x);
    // ---------- de soorten regels, voor één waarde
    const keuze = (b, s, i, c) => (!c.basis ? (i === undefined ? s : i) : zelfde(i, b) ? s : zelfde(s, b) ? i : i);
    const lopend = keuze;
    const eerste = (b, s, i) => (s === undefined ? i : s);
    const max = (b, s, i) => (num(s) && num(i) ? Math.max(s, i) : num(i) ? i : num(s) ? s : i === undefined ? s : i);
    // de snelste tijd: alleen getallen boven 0 tellen (0 betekent: nog geen tijd)
    const snelste = (b, s, i) => { const g = [s, i].filter(x => num(x) && x > 0); return g.length ? Math.min(...g) : i === undefined ? s : i; };

// ===================== RUBEN (klein hoofd voor in het duikpak) =====================
// het hoofd in driekwart, naar rechts kijkend: kuif die naar achteren zwiept, pilotenbril, snorretje, sikje
// uitdr: 'gewoon', 'blij', 'schrik', 'denk'; knip: ogen dicht
function rubenHoofd(uitdr = 'gewoon', knip = false) {
  const R = new Pix(22, 20);
  // haar: achterhoofd, kruin en kuif voorop
  R.ovaal(9.5, 6, 7, 5.2, 'H');
  R.ovaal(14, 3.6, 4.6, 3, 'H');
  R.blok(3, 5, 7, 12, 'H');
  // gezicht
  const gez = { 5: [11, 16], 6: [9, 17], 7: [8, 17], 8: [8, 17], 9: [8, 17], 10: [8, 18], 11: [8, 17], 12: [8, 17], 13: [9, 17], 14: [9, 17], 15: [10, 16], 16: [11, 16], 17: [12, 15] };
  for (const [y, [a, b]] of Object.entries(gez)) R.rij(+y, a, b, 'S');
  // oor
  R.blok(5, 9, 7, 12, 'S'); R.p(5, 9, 'H'); R.p(6, 10, 'r'); R.p(6, 11, 'r'); R.p(7, 12, 's');
  // nek
  R.blok(8, 15, 11, 19, 'S'); R.rij(18, 8, 11, 's'); R.rij(19, 8, 11, 's'); R.p(11, 16, 's'); R.p(11, 17, 's');
  R.omlijn();
  // haarlokken: zwiep van voorboven naar achteren
  for (const [x, y] of [[16, 1], [15, 1], [14, 1], [13, 2], [12, 2], [11, 3], [10, 3], [9, 4], [8, 4], [7, 5], [6, 6], [5, 7], [17, 3], [16, 3], [15, 4], [14, 4], [13, 5], [12, 5], [4, 9], [4, 10]]) R.p(x, y, 'h');
  for (const [x, y] of [[13, 1], [12, 1], [11, 2], [10, 2], [16, 2], [15, 2], [9, 3]]) R.p(x, y, 'j');
  R.p(17, 5, 'H'); R.p(17, 6, 'h'); R.p(16, 5, 'h'); // kuif valt iets over het voorhoofd
  R.p(8, 6, 'H'); R.p(8, 7, 'H'); R.p(8, 8, 'h'); // bakkebaard
  // schaduw onder de kaak en achterkant van het gezicht
  R.p(9, 13, 's'); R.p(9, 14, 's'); R.p(10, 15, 's'); R.p(8, 11, 's'); R.p(8, 12, 's');
  // wenkbrauwen
  R.rij(6, 10, 12, 'B'); R.rij(6, 15, 16, 'B'); if (uitdr === 'schrik') { R.rij(5, 10, 12, 'B'); R.rij(6, 10, 12, 'S'); R.rij(5, 15, 16, 'B'); R.rij(6, 15, 16, 'S'); }
  // bril: bovenbalk, groot glas dichtbij, smaller glas verderop, pootje naar het oor
  R.rij(7, 9, 17, 'G'); R.p(12, 7, 'g'); R.p(13, 7, 'g');
  R.lijn(8, 8, 6, 9, 'G');
  for (const y of [8, 9, 10]) { R.p(9, y, 'G'); R.rij(y, 10, 12, 'L'); R.p(13, y, 'G'); R.rij(y, 15, 16, 'L'); R.p(17, y, 'G'); }
  R.p(14, 8, 'S'); R.p(14, 9, 's'); R.p(14, 10, 'S');
  R.rij(11, 10, 12, 'G'); R.p(9, 11, 'S'); R.rij(11, 15, 16, 'G');
  R.p(10, 8, 'w'); R.p(15, 8, 'w');
  if (knip) { R.rij(9, 11, 12, 'r'); R.p(16, 9, 'r'); }
  else if (uitdr === 'schrik') { R.p(11, 8, 'E'); R.p(11, 9, 'E'); R.p(12, 9, 'w'); R.p(16, 9, 'E'); R.p(16, 8, 'E'); }
  else if (uitdr === 'blij') { R.p(11, 9, 'E'); R.p(12, 8, 'E'); R.p(10, 9, 'E'); R.p(16, 9, 'E'); R.p(15, 9, 'E'); }
  else { R.p(11, 9, 'E'); R.p(12, 9, 'E'); R.p(11, 8, 'E'); R.p(16, 9, 'E'); R.p(16, 8, 'E'); }
  // neus
  R.p(18, 10, 'S'); R.p(18, 11, 's'); R.p(17, 12, 'r'); R.p(16, 12, 's');
  // snor
  R.rij(13, 13, 16, 'M'); R.p(17, 13, 'M'); R.p(12, 14, 'M');
  // mond
  if (uitdr === 'blij') { R.rij(14, 13, 16, 'e'); R.rij(15, 13, 15, 'm'); R.p(17, 14, 'm'); R.p(14, 14, 'w'); R.p(15, 14, 'w'); }
  else if (uitdr === 'schrik') { R.blok(14, 14, 15, 15, 'e'); R.p(16, 14, 'm'); }
  else if (uitdr === 'denk') { R.rij(14, 13, 16, 'm'); }
  else { R.rij(14, 13, 15, 'm'); R.p(16, 14, 'm'); R.p(17, 13, 'm'); R.p(12, 14, 's'); }
  // sikje
  if (uitdr !== 'blij') { R.p(15, 15, 'M'); R.p(14, 15, 's'); }
  R.rij(16, 13, 16, 'M'); R.rij(17, 13, 15, 'M'); R.p(12, 16, 's');
  return R;
}

// gewrichten berekenen: van een punt, een lengte en een hoek (0 = recht omlaag, positief = naar voren/rechts)
function been(x, y, l1, a1, l2, a2) { const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1; return [kx, ky, kx + Math.sin(a2) * l2, ky + Math.cos(a2) * l2]; }

// ===================== MENSEN: gasten, personeel, Ruben op het land en de figuren uit het verhaal =====================
// Elk lichaamsdeel wordt apart getekend, met eigen licht, schaduw en randje, en dan op elkaar gelegd.
// Iedereen kijkt naar de speler, een tikje gedraaid naar rechts; spiegelen gebeurt bij het tekenen. Licht van rechtsboven.

const TINT = new Map();
function tint(c, t) { const k = c + '|' + t; let v = TINT.get(k); if (!v) { v = t > 0 ? mix(hexVan(c), '#FFF4D6', t) : mix(hexVan(c), '#1C1424', -t); TINT.set(k, v); } return v; }
// een dik, taps toelopend stuk (arm, been) met ronde uiteinden
function capsule(P, x0, y0, x1, y1, r0, r1, c) {
  const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy || 1e-6, R = Math.max(r0, r1) + 1;
  for (let y = Math.floor(Math.min(y0, y1) - R); y <= Math.ceil(Math.max(y0, y1) + R); y++)
    for (let x = Math.floor(Math.min(x0, x1) - R); x <= Math.ceil(Math.max(x0, x1) + R); x++) {
      const t = klem(((x - x0) * dx + (y - y0) * dy) / L2, 0, 1), px = x0 + dx * t - x, py = y0 + dy * t - y, r = r0 + (r1 - r0) * t;
      if (px * px + py * py <= r * r + .2) P.p(x, y, c);
    }
}
// belichten: rand rechts en boven lichter, links en onder donkerder; 'breed' geeft een tweede schaduwrand
function belicht(P, breed = 0, sterk = 1) {
  const { w, h, d } = P, uit = d.slice(), leeg = (x, y) => x < 0 || y < 0 || x >= w || y >= h || !d[y * w + x];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = d[y * w + x]; if (!v || v[0] === '!') continue;
    const l = leeg(x - 1, y), o = leeg(x, y + 1), r = leeg(x + 1, y), b = leeg(x, y - 1);
    if (l || o) uit[y * w + x] = tint(v, -.2 * sterk);
    else if (breed && (leeg(x - 2, y) || (breed > 1 && leeg(x, y + 2)))) uit[y * w + x] = tint(v, -.1 * sterk);
    else if (b || r) uit[y * w + x] = tint(v, .16 * sterk);
  }
  P.d = uit; return P;
}
function rand(P) { return P.omlijn(); }
function laag(w = 40, h = 72) { return new Pix(w, h); }

// Iedereen kijkt naar de speler, een klein beetje gedraaid naar de kant waar hij heen loopt (rechts).

const KAPSELS = ['kort', 'krul', 'staart', 'knot', 'lang', 'bob', 'kaal', 'stekel', 'zij', 'vlecht'];
const OOG = '#241A22';
// D: hoe ver het gezicht naar de looprichting gedraaid is (0 = recht naar de speler, 2 = driekwart, bij lopen)
function hoofdVorm(R, hu, o = {}, D = 0) {
  const b = o.breedHoofd ? .8 : 0;
  R.ovaal(14.5, 12.5, 10 + b, 10, hu);
  R.veelhoek(D ? [[5, 13], [24.5, 13], [24.2, 19], [21.8, 23.2], [17.6, 25.2], [12.8, 24.4], [7.6, 21]] : [[5, 13], [24.5, 13], [23.5, 19], [20, 23.4], [15.6, 25.2], [11.2, 24], [7, 20.4]], hu);
  if (o.dubbeleKin) R.ovaal(15.5 + D, 24.6, 5.2, 1.8, hu);
}
// huid belichten als een bol, licht van rechtsboven
function huidLicht(R, hu, D = 0) {
  const hs = tint(hu, -.15), hl = tint(hu, .14);
  for (let y = 0; y < 30; y++) for (let x = 0; x < 30; x++) {
    if (R.g(x, y) !== hu) continue;
    const a = ((x - 16.5 - D * .4) / 11.5) ** 2 + ((y - 11.5) / 13) ** 2;
    if (a > .93) R.p(x, y, hs);
    else if (((x - 18 - D * .5) / 4) ** 2 + ((y - 7.5) / 2.2) ** 2 < 1) R.p(x, y, hl);
  }
}
const NEK = c => tint(c, -.2);
function nek(R, hu) { R.blok(12, 21, 17, 27, NEK(hu)); R.blok(16, 23, 17, 27, tint(hu, -.1)); }
function nekSchaduw(R, hu) { const n = NEK(hu), d = tint(hu, -.34); for (let x = 12; x <= 17; x++) for (let y = 21; y < 28; y++) if (R.g(x, y) === n && R.g(x, y - 1) && R.g(x, y - 1) !== n) { R.p(x, y, d); break; } }
// gedraaid zie je alleen het oor aan de kant van de speler, op de zijkant van het hoofd
function oren(R, hu, D = 0) {
  const hs = tint(hu, -.16), hd = tint(hu, -.3);
  if (D) {
    const rim = tint(hu, -.38), opp = tint(hu, -.08), bin = tint(hu, -.27);
    R.ovaal(8.4, 16.5, 1.6, 2.3, opp);

    R.p(9, 16, bin); R.p(9, 17, bin); R.p(8, 17, bin); R.p(8, 15, tint(hu, .08));
    return;
  }
  R.ovaal(4.3, 16, 1.6, 2.4, hs); R.p(4, 16, hd); R.p(4, 17, hd); R.ovaal(24.9, 16, 1.2, 2, hu); R.p(25, 16, hs);
}
// tekent het gezicht D pixels verder naar de looprichting
function verschoven(R, D) { if (!D) return R; return { p: (x, y, c) => R.p(x + D, y, c), g: (x, y) => R.g(x + D, y), rij: (y, a, b, c) => R.rij(y, a + D, b + D, c), blok: (x0, y0, x1, y1, c) => R.blok(x0 + D, y0, x1 + D, y1, c) }; }

// ---- het haar: eerst een vorm, dan licht en lokken
function haarLaag(o, D = 0) {
  const H = new Pix(30, 30), ha = o.haar, st = o.haarStijl || 'kort', r = D ? 1.6 : 0;
  // een kap over de schedel met een pony; aan de zijkanten tot 'zij' naar beneden (gedraaid: de achterkant links verder omlaag)
  const kap = (zij, pony = 8.6) => {
    for (let y = 0; y < 30; y++) for (let x = 0; x < 30; x++) {
      const a = ((x - 14.5) / 10.8) ** 2 + ((y - 12) / 10.6) ** 2; if (a > 1) continue;
      const lijn = x < 7 + D * .6 || x > 22.5 + D * .5 ? zij + (D && x < 6.4 ? 3.5 : 0) : pony + (x > 10 + D && x < 15 + D ? .6 : 0) + Math.sin(x * 1.3) * .5;
      if (y <= lijn) H.p(x, y, ha);
    }
  };
  switch (st) {
    case 'kaal': if (D) { for (let y = 10; y < 19; y++) { H.p(4, y, ha); H.p(5, y, ha); if (y < 14) { H.p(6, y, ha); H.p(7, y, ha); } } break; }
      for (let y = 10; y < 18; y++) { H.p(4, y, ha); H.p(5, y, ha); H.p(24, y, ha); if (y < 15) { H.p(6, y, ha); H.p(23, y, ha); } } break;

// ---- een vis uit een paar getallen; beeldje 0-3 = staartslag
function visPix(o, beeld = 0) {
  const L = o.len, H = o.h, R = new Pix(L + 12, H * 2 + 10), kl = o.kl;
  const cy = H + 4, sx = 8, buig = [-1, 0, 1, 0][beeld % 4];
  const prof = t => Math.pow(Math.sin(Math.PI * Math.pow(klem(t, 0, 1), o.kop || .8)), .7);
  const dy = x => Math.round(buig * Math.max(0, .45 - x / L) / .45 * 1.6);
  // staart
  const st = o.staart || 'vork', ty = buig * 2;
  for (let i = 0; i <= 6; i++) {
    let hw = st === 'vork' ? (i < 2 ? 1 + i * .6 : 2 + i * .75) : st === 'rond' ? 1.2 + Math.sin(i / 6 * Math.PI) * 2.4 + i * .3 : st === 'haai' ? 1 + i * .4 : 1 + i * .6;
    for (let y = -Math.round(hw); y <= Math.round(hw * (st === 'haai' ? .4 : 1)); y++) {
      if (st === 'vork' && i > 3 && Math.abs(y) < (i - 3) * 1.1) continue;
      R.p(sx - i + 1, cy + y + Math.round(ty * i / 6) + (st === 'haai' ? -Math.round(i * .4) : 0), kl.v);
    }
  }
  // lijf met tegenkleuring
  for (let x = 0; x < L; x++) {
    const t = x / (L - 1), hw = Math.max(1, prof(t) * H), d = dy(x);
    for (let y = -Math.round(hw); y <= Math.round(hw * (o.buik || 1)); y++) R.p(sx + x, cy + y + d, y < -hw * .2 ? kl.R : y > hw * .4 ? kl.U : kl.M);
  }
  // rugvin en buikvin
  if (o.rugvin !== false) for (let x = Math.round(L * .32); x < Math.round(L * .62); x++) { const hw = prof(x / (L - 1)) * H; R.p(sx + x, cy - Math.round(hw) - 1 + dy(x), kl.v); if (x % 2 === 0 && x < L * .55) R.p(sx + x, cy - Math.round(hw) - 2 + dy(x), kl.v); }
  for (let x = Math.round(L * .4); x < Math.round(L * .52); x++) { const hw = prof(x / (L - 1)) * H; R.p(sx + x, cy + Math.round(hw * (o.buik || 1)) + 1 + dy(x), kl.v); }
  // patroon
  if (o.patroon === 'strepen') for (let x = 4; x < L - 5; x++) for (let y = -H; y < 0; y++) if (R.g(sx + x, cy + y + dy(x)) === kl.R && ((x + y * 1.5) % 5 + 5) % 5 < 1.6) R.p(sx + x, cy + y + dy(x), kl.D);
  if (o.patroon === 'banden') for (let x = 3; x < L - 4; x++) if (Math.floor((x + 1) / 3) % 2 === 0) for (let y = -H; y <= Math.round(H * .3); y++) { const v = R.g(sx + x, cy + y + dy(x)); if (v === kl.R || v === kl.M) R.p(sx + x, cy + y + dy(x), kl.D); }
  if (o.patroon === 'vlekken') for (let x = 3; x < L - 4; x += 3) for (let y = -H; y <= H; y += 3) { const px = sx + x + (y & 1), v = R.g(px, cy + y + dy(x)); if (v === kl.R || v === kl.M) R.p(px, cy + y + dy(x), kl.D); }
  // zijlijn
  for (let x = 3; x < L - 4; x++) if (R.g(sx + x, cy + dy(x)) === kl.M) R.p(sx + x, cy + dy(x), mix(kl.M, kl.R, .45));
  R.omlijn();
  // kieuw, oog met glimlicht, bek
  const ox = sx + L - Math.max(3, Math.round(L * .17)), oy = cy - Math.max(1, Math.round(H * .3));
  for (let y = -Math.round(H * .45); y <= Math.round(H * .5); y++) { const v = R.g(ox - 3, cy + y); if (v === kl.R || v === kl.M || v === kl.U) R.p(ox - 3, cy + y, donker(v, .25)); }
  if (o.groot) { R.blok(ox - 1, oy - 1, ox + 1, oy, '#FFFFFF'); R.p(ox, oy, '#1A1418'); R.p(ox + 1, oy, '#1A1418'); }
  else { R.p(ox, oy, '#FFFFFF'); R.p(ox + 1, oy, '#1A1418'); }
  R.p(sx + L - 1, cy + 1, donker(kl.M, .5));
  if (o.tanden) { R.p(sx + L - 1, cy + 2, '#FFFFFF'); R.p(sx + L - 3, cy + 2, '#FFFFFF'); }
  return R;
}

// ---- Ruben in duikpak: masker met de pilotenbril erachter, haar dat meewappert, rode bies en een gele fles
function duikHoofd(beeld = 0, uitdr = 'gewoon') {
  const R = rubenHoofd(uitdr === 'schrik' ? 'schrik' : 'gewoon', false);
  // masker over de ogen: rubber rand, glas, de bril blijft erachter zichtbaar
  for (let y = 6; y <= 12; y++) for (let x = 8; x <= 19; x++) {
    const rand = y === 6 || y === 12 || x === 8 || x === 19, v = R.g(x, y);
    if (rand) { if (v || x < 19) R.p(x, y, 'P'); continue; }
    if (v === 'G' || v === 'g' || v === 'E' || v === 'w') continue;
    R.p(x, y, (x + y) % 7 === 0 ? 'O' : 'Q');
  }
  R.p(18, 7, 'O'); R.p(17, 7, 'O'); R.p(10, 11, 'p');
  // band om het hoofd
  R.lijn(7, 9, 2, 7, 'P'); R.lijn(7, 10, 2, 8, 'p');
  // ademautomaat in de mond, slang naar achteren
  R.blok(15, 13, 18, 15, 'P'); R.p(18, 13, 'p'); R.p(16, 14, 'p'); R.lijn(15, 16, 10, 19, 'P');
  // haar wappert naar achteren
  const w = [0, 1, 0, -1][beeld % 4];
  for (const [x, y] of [[2, 3 + w], [1, 4 + w], [3, 2], [1, 6 + w], [2, 5], [0, 5 + w]]) R.p(x, y, 'H');
  R.p(2, 4 + w, 'h');
  if (uitdr === 'blij') { R.p(19, 15, 'O'); R.p(20, 13, 'O'); }
  return R;
}
// pose: zwem, richt, net, pak, schrik, blij, rust; kantel -2..2 (positief = kop omlaag); hoek = richting van de arm
function rubenDuik(pose = 'zwem', beeld = 0, kantel = 0, hoek = 0) {
  const ha = pose === 'richt' || pose === 'net' ? Math.round(hoek / (Math.PI / 8)) : 0;
  const sleutel = pose + '|' + (beeld % 8) + '|' + kantel + '|' + ha;
  return zeeBuf('rd|' + sleutel, () => {
    const R = new Pix(80, 64), cx = 40, cy = 32;
    const a = kantel * .32, ax = Math.cos(a), ay = Math.sin(a), bx = ay, by = -ax; // as (vooruit) en rug (omhoog)
    const P = (u, v) => [cx + ax * u + bx * v, cy + ay * u + by * v]; // u langs de as, v naar de rug
    const fase = beeld / 8 * Math.PI * 2, kick = pose === 'rust' ? .15 * Math.sin(fase * .5) : pose === 'schrik' ? .55 * Math.sin(fase * 2) : .42 * Math.sin(fase);
    // benen (achterste eerst), met brede vliezen
    const been = (k, kleur, vin, vinD) => {
      const [hx, hy] = P(-12, 1);
      const dir1 = Math.PI + a + k, dir2 = dir1 - k * .8;
      const kx = hx + Math.cos(dir1) * 9, ky = hy + Math.sin(dir1) * 9, vx = kx + Math.cos(dir2) * 9, vy = ky + Math.sin(dir2) * 9;
      R.lijn(hx, hy, kx, ky, kleur, 5); R.lijn(kx, ky, vx, vy, kleur, 4);
      const d3 = dir2 - k * .7, nx = -Math.sin(d3), ny = Math.cos(d3);
      const f1x = vx + Math.cos(d3) * 13, f1y = vy + Math.sin(d3) * 13;
      R.veelhoek([[vx + nx * 1.5, vy + ny * 1.5], [f1x + nx * 3.5, f1y + ny * 3.5], [f1x - nx * 3.5, f1y - ny * 3.5], [vx - nx * 1.5, vy - ny * 1.5]], vin);
      R.lijn(vx, vy, f1x, f1y, vinD, 1);
    };
    been(-kick, 'W', 'f', 'f');
    // fles op de rug
    const [t1x, t1y] = P(-9, 6), [t2x, t2y] = P(9, 6);
    R.lijn(t1x, t1y, t2x, t2y, 'T', 6); const [u1x, u1y] = P(-8, 8), [u2x, u2y] = P(8, 8); R.lijn(u1x, u1y, u2x, u2y, 'u', 1);
    const [b1x, b1y] = P(-4, 4), [b2x, b2y] = P(-4, 9); R.lijn(b1x, b1y, b2x, b2y, 't', 1); const [c1x, c1y] = P(3, 4), [c2x, c2y] = P(3, 9); R.lijn(c1x, c1y, c2x, c2y, 't', 1);
    const [vx0, vy0] = P(12, 6); R.blok(vx0 - 1, vy0 - 1, vx0 + 1, vy0 + 1, 'x');
    // romp
    const [r1x, r1y] = P(-13, 0), [r2x, r2y] = P(10, 0); R.lijn(r1x, r1y, r2x, r2y, 'W', 10); const [q1x, q1y] = P(0, -1), [q2x, q2y] = P(8, -1); R.lijn(q1x, q1y, q2x, q2y, 'W', 11);
    const [s1x, s1y] = P(-12, 3), [s2x, s2y] = P(9, 3); R.lijn(s1x, s1y, s2x, s2y, 'V', 1);
    const [x1x, x1y] = P(-12, -1), [x2x, x2y] = P(10, -1); R.lijn(x1x, x1y, x2x, x2y, 'X', 1);
    been(kick, 'V', 'F', 'f');
    // hoofd
    const H = duikHoofd(beeld, pose === 'schrik' ? 'schrik' : pose === 'blij' ? 'blij' : 'gewoon');
    const [hx, hy] = P(15, 2); R.plak(H, Math.round(hx - 11), Math.round(hy - 12));
    R.omlijn();
    // voorste arm
    const A = new Pix(R.w, R.h), [sx, sy] = P(7, -2);
    let ex, ey, hx2, hy2;
    if (pose === 'richt' || pose === 'net') { const h = ha * Math.PI / 8; ex = sx + Math.cos(h) * 7; ey = sy + Math.sin(h) * 7; hx2 = ex + Math.cos(h) * 6; hy2 = ey + Math.sin(h) * 6; }
    else if (pose === 'pak') { [ex, ey] = P(13, -6); [hx2, hy2] = P(20, -8); }
    else if (pose === 'blij') { [ex, ey] = P(10, 6); [hx2, hy2] = P(13, 14); }
    else if (pose === 'schrik') { [ex, ey] = P(10, -8); [hx2, hy2] = P(16, -12 - Math.sin(fase * 2) * 2); }
    else { const s = Math.sin(fase) * 1.5; [ex, ey] = P(1, -6); [hx2, hy2] = P(-6 + s, -6); }
    A.lijn(sx, sy, ex, ey, 'W', 3); A.lijn(ex, ey, hx2, hy2, 'W', 3); A.blok(hx2 - 1, hy2 - 1, hx2 + 1, hy2 + 1, 'S');
    if (pose === 'richt') { const h = ha * Math.PI / 8; A.lijn(hx2, hy2, hx2 + Math.cos(h) * 12, hy2 + Math.sin(h) * 12, 'Y', 2); A.lijn(hx2 + Math.cos(h) * 4, hy2 + Math.sin(h) * 4 - 1, hx2 + Math.cos(h) * 16, hy2 + Math.sin(h) * 16 - 1, 'x', 1); }
    if (pose === 'net') { const h = ha * Math.PI / 8; A.ovaal(hx2 + Math.cos(h) * 4, hy2 + Math.sin(h) * 4, 3, 3, '#C9B48A'); A.ovaal(hx2 + Math.cos(h) * 4, hy2 + Math.sin(h) * 4, 1.6, 1.6, null); }
    A.omlijn(); R.plak(A, 0, 0);
    return { pix: R, doek: R.doek(), mond: P(19, -4), hand: [hx2, hy2] };
  });
}

function delftsTegel(T, x, y, motief, s) {

// ---- de muur van de zaal per stijl (x en y in zaalcoördinaten)

// lucht per uur (17 tot 24): [boven, horizon]
const LUCHT_UREN = [[17, '#7FB8E0', '#F6D9A0'], [18.5, '#6A8FCF', '#F6B07A'], [19.5, '#5A5A9A', '#F2805A'], [20.5, '#2E2F66', '#B85A6A'], [21.5, '#161A44', '#3E3468'], [23, '#0A0E26', '#1A2148'], [25, '#070A1C', '#141A3A']];
function luchtOp(uur) {
  let a = LUCHT_UREN[0], b = LUCHT_UREN[LUCHT_UREN.length - 1];
  for (let i = 0; i + 1 < LUCHT_UREN.length; i++) if (uur >= LUCHT_UREN[i][0] && uur <= LUCHT_UREN[i + 1][0]) { a = LUCHT_UREN[i]; b = LUCHT_UREN[i + 1]; break; }
  const t = klem((uur - a[0]) / (b[0] - a[0] || 1), 0, 1);
  return { boven: mix(a[1], b[1], t), horizon: mix(a[2], b[2], t), nacht: klem((uur - 19.8) / 2, 0, 1) };
}

// ===================== DE KAART VAN DE ZEE: een kleine patrijspoort rechtsboven, en een grote kaart als je erop tikt =====================
// De kaart is een verkleinde versie van de zee (1 kaartpixel = 8 pixels zee). Wat je gezien hebt, blijft ontdekt (ST.kaart, per zee
// een code); de rest is donker. De weg terug naar de boot komt uit een afstandskaart vanaf de ladder (een keer per duik uitgerekend).
const KAART = { P: 8, MIST: 32, KLEIN: 60 };

// ---- ontdekt gebied bewaren: een bitje per vak van 32 pixels, als looplengtes (meestal kort) of anders als bits, in base64
function kaartCode(m) {
  const runs = []; let v = 0, n = 0;
  for (let i = 0; i < m.length; i++) { if (m[i] === v) n++; else { runs.push(n); v = m[i]; n = 1; } }

  } catch (e) { m.fill(0); }

// ===================== DE DIJK: de moestuin van Opa Gerrit, de kweek, het wad en de strekdam =====================
// Links van de haven loopt een pad naar de dijk. Van links naar rechts: de strekdam (hengelen), een vlonder langs het wad
// met het mosselperceel en het oesterbed, het wad zelf (schelpen zoeken bij eb), en achter de dijk de moestuin met het
// schuurtje van Opa Gerrit. Rechts loop je terug naar de haven.
const DIJK = {
  W: 900, Y: 306, BED0: 566, BEDSTAP: 34, MAX: 8,
  PLEKKEN: [
    { id: 'hengel', naam: 'Hengelen', x: 44, deur: 44 },
    { id: 'mossel', naam: 'Het mosselperceel', x: 236, deur: 236 },
    { id: 'oester', naam: 'Het oesterbed', x: 330, deur: 330 },
    { id: 'schelp', naam: 'Schelpen zoeken', x: 386, deur: 386 },
    { id: 'schuur', naam: 'Opa Gerrit', x: 838, deur: 832 },
    { id: 'haven', naam: 'Naar de haven', x: 884, deur: 870 },
  ],
};
const bedX = i => DIJK.BED0 + i * DIJK.BEDSTAP;
// eb of vloed: wisselt elk dagdeel, en elke dag begint anders. Zo is er elke dag minstens één keer eb.
const getij = () => (ST.dag + ST.duiken) % 2 === 0 ? 'eb' : 'vloed';
const dijkOpen = () => ST.dag >= 3 || ST.hfd >= 2 || !!ST.vlag.gerrit;
const gewasOpen = id => !GEWASSEN[id].hart || harten('gerrit') >= GEWASSEN[id].hart;
function tuinBed(i) { const b = ST.tuin.b || []; return b[i] && GEWASSEN[b[i][0]] ? b[i] : null; }
// leeg, dorst (vandaag nog geen water), nat (gegeven), of rijp
function bedStand(b) { if (!b) return 'leeg'; if (b[1] >= GEWASSEN[b[0]].dagen) return 'rijp'; return b[2] === ST.dag || (ST.maak && ST.maak.sproeier) ? 'nat' : 'dorst'; }
// 's nachts groeit alles wat die dag water kreeg (of met de sproeier)
function tuinNacht(d) {
  for (const b of ST.tuin.b || []) if (b && GEWASSEN[b[0]] && b[1] < GEWASSEN[b[0]].dagen && (b[2] === d || (ST.maak && ST.maak.sproeier))) b[1]++;
}
const kweekKlaar = id => { const k = ST.kweek[id]; return k > 0 && ST.dag - k >= KWEEK[id].dagen; };

// ---- naar de dijk (vanuit de haven) en terug
async function naarDijk() {
  if (!dijkOpen()) {
    await vraag(`<h2>De dijk</h2><p>Achter de haven loopt een pad naar de dijk. Aan het hek hangt een bordje:</p><p><i>“Moestuin van G. Knol. Even niet storen, ik zit op mijn bankje.”</i></p><p class="klein">Kom over een paar dagen nog eens kijken.</p>`, [{ tekst: 'Oké', waarde: 'ok', soort: 'hoofd' }]);
    return;
  }
  await overgang(() => naarScene('dijk', { x: 860 }));
}
async function dijkPlek(id) {
  GELUID.sfx('klik');
  if (id === 'intro') return gerritIntro();
  if (id === 'haven') return overgang(() => naarScene('haven', { x: 40 }));
  if (id === 'schuur') return gerritSchuur();
  if (id === 'mossel' || id === 'oester') return kweekActie(id);
  if (id === 'schelp') return schelpPlek();
  if (id === 'hengel') return hengelPlek();
  if (id.startsWith('bed')) return bedActie(+id.slice(3));
}

// ---- de moestuin
function bedActie(i) {
  if (i >= ST.tuin.n) { melding('Hier is nog geen bed. Opa Gerrit kan je moestuin groter maken.', '', 3200); return; }
  const b = tuinBed(i), stand = bedStand(b);
  if (stand === 'leeg') return zaai(i);
  if (stand === 'dorst') { geefWater([i]); return; }
  if (stand === 'rijp') { oogst([i]); return; }
  const g = GEWASSEN[b[0]], nog = g.dagen - b[1];
  melding(`${g.naam}: nog ${nog} ${nog === 1 ? 'nacht' : 'nachten'}. ${ST.maak && ST.maak.sproeier ? 'De sproeier geeft ze water.' : 'Ze hebben vandaag al water gehad.'}`, '', 2800);
}
function zaai(i) {
  return new Promise(res => {
    const ids = Object.keys(GEWASSEN);
    const k = paneel(`<h2>Wat ga je zaaien?</h2><p class="klein" style="margin-top:0">Zaaien en water geven, elke dag. Na een paar nachten kun je oogsten. Je hebt ${geldTekst(ST.geld)}.</p><div class="lijst">${ids.map(id => { const g = GEWASSEN[id], open = gewasOpen(id), kan = open && ST.geld >= g.zaad; return `<div class="regel kies ${kan ? '' : 'uit'}" role="button" tabindex="0" data-g="${id}" ${kan ? '' : 'aria-disabled="true"'}>${plaatjeHtml(ingrDoek(id), 2)}<div><div class="naam">${open ? g.naam : '???'}</div><div class="klein">${open ? `${g.dagen} ${g.dagen === 1 ? 'nacht' : 'nachten'} · ${g.porties} porties${ST.groente[id] ? ' · ' + ST.groente[id] + ' in je kast' : ''}` : 'Opa Gerrit geeft je deze zaadjes bij ' + g.hart + ' ' + (g.hart === 1 ? 'hartje' : 'hartjes') + ' vriendschap.'}</div></div><div class="meer">${open ? geldTekst(g.zaad) : ''}</div></div>`; }).join('')}</div><div class="rij"><button class="knop" type="button" id="z-terug">Terug</button></div>`);
    vulPlaatjes(k, ids.map(id => ingrDoek(id)));
    k.querySelectorAll('.regel.kies').forEach(r => { const f = () => {
      const id = r.dataset.g, g = GEWASSEN[id];
      if (!gewasOpen(id)) { GELUID.sfx('fout'); melding('Die zaadjes heb je nog niet. Word eerst beter bevriend met Opa Gerrit.', 'rood', 3000); return; }
      if (ST.geld < g.zaad) { GELUID.sfx('fout'); melding('Daar heb je niet genoeg geld voor.', 'rood'); return; }
      ST.geld -= g.zaad; if (!ST.tuin.b) ST.tuin.b = []; ST.tuin.b[i] = [id, 0, ST.dag]; // zaaien met water erbij
      GELUID.sfx('plof'); sluitPaneel(); bewaar(); if (DK) DK.vonk.push({ x: bedX(i), y: 318, t: 0, soort: 'water' });
      melding(g.naam + ' gezaaid en water gegeven. Kom morgen weer gieten!', '', 2800); res(id);
    }; r.onclick = f; r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
    $('z-terug').onclick = () => { GELUID.sfx('klik'); sluitPaneel(); res(null); };
  });
}
function geefWater(lijst) {
  let n = 0;
  for (const i of lijst) { const b = tuinBed(i); if (b && bedStand(b) === 'dorst') { b[2] = ST.dag; n++; if (DK) DK.vonk.push({ x: bedX(i), y: 318, t: 0, soort: 'water' }); } }
  if (!n) return 0;
  GELUID.sfx('plons'); if (DK) { DK.ruben.gieter = 1.2; } bewaar();
  melding(n === 1 ? 'Water gegeven.' : n + ' bedden water gegeven.', '', 1800); return n;
}
function oogst(lijst) {
  const bij = {}; let n = 0;
  for (const i of lijst) {
    const b = tuinBed(i); if (!b || bedStand(b) !== 'rijp') continue;
    const g = GEWASSEN[b[0]], p = g.porties + (harten('gerrit') >= 4 ? 1 : 0);
    ST.groente[b[0]] = (ST.groente[b[0]] || 0) + p; bij[b[0]] = (bij[b[0]] || 0) + p; ST.tuin.b[i] = null; n++;
    if (DK) DK.vonk.push({ x: bedX(i), y: 312, t: 0, soort: 'oogst', g: b[0] });
  }
  if (!n) return 0;
  ST.stats.oogst = (ST.stats.oogst || 0) + n;
  GELUID.sfx('munt'); bewaar();
  melding('Geoogst: ' + Object.entries(bij).map(([g, p]) => p + ' ' + GEWASSEN[g].naam.toLowerCase()).join(', ') + '. Het ligt in je voorraadkast.', 'goud', 3400);
  return n;
}
const bedden = stand => { const l = []; for (let i = 0; i < ST.tuin.n; i++) if (bedStand(tuinBed(i)) === stand) l.push(i); return l; };

// ---- de kweek: kopen, zaad uitzetten, oogsten
async function kweekActie(id) {
  const K = KWEEK[id];
  if (!K.open()) { melding(K.slot, '', 3400); return; }
  const k = ST.kweek[id];
  if (k === undefined || k === null) {
    const w = await vraag(`<h2>${K.naam}</h2><p>Een bordje van de gemeente: <i>“Te huur, voor altijd. ${geldTekst(K.koop)}.”</i></p><p class="klein">Daarna zet je er zaad in (${geldTekst(K.zaad)}), en na ${K.dagen} dagen oogst je ${K.porties} porties ${SOORTEN[K.soort].naam.toLowerCase()}, vers voor je restaurant. Je hoeft er niets voor te doen.</p>`,
      [{ tekst: 'Kopen voor ' + geldTekst(K.koop), waarde: 'ja', soort: 'hoofd' }, { tekst: 'Nu niet', waarde: 'nee' }]);
    if (w !== 'ja') return;
    if (ST.geld < K.koop) { GELUID.sfx('fout'); melding('Daar heb je nog niet genoeg geld voor.', 'rood'); return; }
    ST.geld -= K.koop; ST.kweek[id] = 0; GELUID.sfx('feest'); bewaar();

    return kweekActie(id);
  }

    const w = await vraag(`<h2>${K.naam}</h2><p>Zaad uitzetten voor ${geldTekst(K.zaad)}? Over ${K.dagen} dagen kun je ${K.porties} porties ${SOORTEN[K.soort].naam.toLowerCase()} oogsten.</p>`, [{ tekst: 'Uitzetten', waarde: 'ja', soort: 'hoofd' }, { tekst: 'Nu niet', waarde: 'nee' }]);
    if (w !== 'ja') return;
    if (ST.geld < K.zaad) { GELUID.sfx('fout'); melding('Daar heb je niet genoeg geld voor.', 'rood'); return; }
    ST.geld -= K.zaad; ST.kweek[id] = ST.dag; GELUID.sfx('plons'); bewaar();
    melding('Uitgezet. Over ' + K.dagen + ' dagen kun je oogsten.', '', 2600); return;
  }
  if (!kweekKlaar(id)) { const nog = K.dagen - (ST.dag - k); melding(`${K.naam}: nog ${nog} ${nog === 1 ? 'dag' : 'dagen'} groeien.`, '', 2400); return; }

// de balk bovenin: op een smal scherm zonder de naam van het spelletje

// ===================== HENGELEN =====================

  doel: 220,

  klaarMet(s, wat) { HG.staat = 'klaar'; HG.t = 0; if (wat) { HG.vangst.push(wat); HG.toon = { id: wat, t: 0 }; } this.zeg(s, 2.6); if (HG.worpen <= 0) { HG.staat = 'einde'; } },
  update(dt) {
    if (!HG) return;

    if (HG.staat === 'gooi' && HG.t > .7) { HG.staat = 'wacht'; HG.t = 0; HG.wachtTot = 1.8 + HG.r() * 4; HG.knabbel = 0; GELUID.sfx('plons'); this.zeg('Wacht tot de dobber onder gaat...', 2); }
    else if (HG.staat === 'wacht') {

// ===================== SCHELPEN ZOEKEN BIJ EB =====================
// Op het natte wad verraden luchtbelletjes en glinsters waar iets zit. Tik er snel op voor het weer weg is. Pas op voor
// krabben: die knijpen (en dat kost tijd). 25 seconden.
const SCHELP_SOORT = [['kokkel', 50], ['schelp', 26], ['krab', 15], ['zeeglas', 7], ['munt', 2]];
const SCHELP_PORTIE = .25; // een handje kokkels per vondst (bij het duiken is een vangst een halve portie)
let SC = null;
SCENES.schelp = {
  doel: 220,
  start() {
    SC = { t: 0, tijd: 25, plekken: [], vonst: [], volgende: .4, r: rng(ST.dag * 433 + 9), tekst: '', tekstT: 0, gat: [], klaar: false, au: 0 };

  },
  stop() {},
  klik(x, y) {
    if (!SC || SC.klaar) return;

    for (const p of SC.plekken) { if (p.weg) continue; const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; beste = p; } }
    SC.gat.push({ x, y, t: 0 });

    beste.weg = true;
    if (beste.s === 'krab') { SC.tijd = Math.max(0, SC.tijd - 2); SC.au = .5; GELUID.sfx('au'); this.zeg('Au! Een krab knijpt je. (-2 seconden)'); return; }
    SC.vonst.push(beste.s); SC.pop = { s: beste.s, x: beste.x, y: beste.y, t: 0 }; GELUID.sfx(beste.s === 'munt' ? 'munt' : 'pak');
  },
  zeg(s, d = 1.8) { SC.tekst = s; SC.tekstT = d; },
  kies() { let x = SC.r() * 100; for (const [s, w] of SCHELP_SOORT) { x -= w; if (x <= 0) return s; } return 'kokkel'; },
  update(dt) {
    if (!SC || SC.klaar) return;
    if (was('pauze')) { DAG.menu(); return; }
    SC.t += dt; SC.tekstT = Math.max(0, SC.tekstT - dt); SC.au = Math.max(0, SC.au - dt);
    for (const g of SC.gat) g.t += dt; SC.gat = SC.gat.filter(g => g.t < .6);
    if (SC.pop) { SC.pop.t += dt; if (SC.pop.t > 1) SC.pop = null; }
    if (SC.tijd > 0) {
      SC.tijd = Math.max(0, SC.tijd - dt);
      SC.volgende -= dt;
      if (SC.volgende <= 0) { const W = BEELD.W, H = BEELD.H; let x, y, ok = false; for (let k = 0; k < 12 && !ok; k++) { x = 16 + SC.r() * (W - 32); y = 30 + SC.r() * (H - 52); ok = SC.plekken.every(p => p.weg || Math.hypot(p.x - x, p.y - y) > 26); } if (ok) SC.plekken.push({ x, y, s: this.kies(), t: 0, duur: 2.2 + SC.r() * 1.2 }); SC.volgende = .7 + SC.r() * .6; }
      for (const p of SC.plekken) p.t += dt; SC.plekken = SC.plekken.filter(p => !p.weg && p.t < p.duur);
      if (SC.tijd <= 0) { SC.plekken = []; this.zeg('Het water komt op! Tijd om te gaan.', 3); GELUID.sfx('bel'); }
    } else if (was('actie') || was('enter')) this.einde();
  },
  async einde() {

    const tel = {}; for (const s of SC.vonst) tel[s] = (tel[s] || 0) + 1;
    if (tel.kokkel) { ST.voorraad.push(['kokkel', SCHELP_PORTIE * tel.kokkel, ST.dag]); ST.boek.kokkel = (ST.boek.kokkel || 0) + tel.kokkel; if (!('kokkels' in ST.recepten)) ST.recepten.kokkels = 0; }
    for (const s of ['schelp', 'zeeglas', 'munt']) if (tel[s]) ST.vondsten[s] = (ST.vondsten[s] || 0) + tel[s];
    ST.dijk.schelp = ST.dag; ST.stats.schelpen = (ST.stats.schelpen || 0) + SC.vonst.length; bewaar();
    const naam = { kokkel: 'kokkels', schelp: 'mooie schelpen', zeeglas: 'zeeglas', munt: 'oude munt' };
    await vraag(`<h2>Schelpen gezocht</h2>${SC.vonst.length ? `<p>Gevonden: ${Object.entries(tel).map(([s, n]) => n + '× ' + naam[s]).join(', ')}.</p>${tel.kokkel ? '<p class="klein">De kokkels liggen vers in je koeling. Kokkels met knoflook staan nu in je receptenschrift.</p>' : ''}` : '<p>Je vond niets. Kijk goed naar de luchtbelletjes in het zand!</p>'}`, [{ tekst: 'Terug naar de dijk', waarde: 1, soort: 'hoofd' }]);
    await overgang(() => naarScene('dijk', { x: 386 }));

    for (let i = 0; i < 6; i++) { const x = hashf(i, 1, 3) * W, y = 20 + hashf(i, 2, 3) * (H - 30), r = 6 + hashf(i, 3, 3) * 12; T.ovaal(x, y, r, r * .4, '#8ABCD0'); T.rect(x - r * .4, y - 1, r * .5, 1, '#D8F0F8'); }
    for (let i = 0; i < 30; i++) { const x = hashf(i, 4, 3) * W, y = hashf(i, 5, 3) * H; T.px(x, y, '#E8DCC0'); }

      else if (p.s === 'krab') { const k = Math.sin(t * 5 + p.y) > 0 ? 1 : 0; T.px(p.x - 2, p.y - k, '#1A1418'); T.px(p.x + 2, p.y - k, '#1A1418'); T.rect(p.x - 3, p.y + 1, 7, 1, '#7A5A3A'); }
      else { const k = p.s === 'munt' ? '#FFE070' : p.s === 'zeeglas' ? '#8AE8C8' : '#FFF6E8', s = Math.sin(t * 7 + p.x) > 0; T.px(p.x, p.y, k); if (s) { T.px(p.x - 1, p.y, k); T.px(p.x + 1, p.y, k); T.px(p.x, p.y - 1, k); T.px(p.x, p.y + 1, k); } }

    if (SC.pop) { const p = SC.pop, pic = p.s === 'kokkel' ? zeedierDoek('kokkel') : vondstDoek(p.s); ctx.drawImage(pic, Math.round(p.x - pic.width / 2), Math.round(p.y - 8 - p.t * 14 - pic.height / 2)); }

    miniBalk(T, ctx, W, 'Schelpen zoeken', `${Math.ceil(SC.tijd)} s · ${SC.vonst.length} gevonden`);
    miniTekst(ctx, SC.tijd > 0 ? (SC.t < 5 ? 'Tik op belletjes en glinsters. Pas op voor krabben!' : '') : (INV.aanraak ? 'Tik om verder te gaan' : 'Klik of spatie: verder'), W / 2, H - 14, '#FBF6E9', true);
    if (SC.tekstT > 0) miniTekst(ctx, SC.tekst, W / 2, Math.round(H / 2) - 4);
  },
};

// ===================== DE DAG: haven, duiken, avond, nacht =====================
const WEER = [{ id: 'zon', naam: 'Zonnig', gasten: 1.15 }, { id: 'wolk', naam: 'Bewolkt', gasten: 1 }, { id: 'wind', naam: 'Frisse wind', gasten: .9 }, { id: 'regen', naam: 'Regen', gasten: .8 }];

  // ---- na het duiken: de vangst en de duik zelf in één keer bewaren; daarna pas de vensters (DAG.hervat)
  async eindeDuik(hoe) {
    if (!D || D.afgerond) return; D.afgerond = true;
    const tas = D.tas.slice();
    if (hoe === 'flauw') { // de helft van het gewicht raak je kwijt

      for (let i = tas.length - 1; i >= 0 && weg > 0; i--) { const it = tas[i]; if (it.verhaal) continue; const w = it.v ? VONDSTEN[it.v].kg : SOORTEN[it.s].kg; tas.splice(i, 1); weg -= w; }
    }
    const vis = {}, vond = {}, nieuw = [];
    for (const it of tas) { if (it.s) vis[it.s] = (vis[it.s] || 0) + 1; else vond[it.v] = (vond[it.v] || 0) + 1; }
    // foto's: die raak je nooit kwijt, ook niet als je zuurstof op was
    const fotos = Object.assign({}, D.fotos), fotoNieuw = Object.keys(fotos).filter(s => !ST.foto[s] && !ST.boek[s] && !vis[s]);
    for (const [s, n] of Object.entries(fotos)) ST.foto[s] = Math.max(ST.foto[s] || 0, n);
    // het Scheepskerkhof: materialen en munten uit de kisten, wat aan een ballon naar boven dreef, en wat er nu open is
    const mat = Object.assign({}, D.mat), munt = D.munt || 0, geborgen = (D.geborgen || []).slice();
    for (const [m, n] of Object.entries(mat)) ST.mat[m] = (ST.mat[m] || 0) + n;
    ST.geld += munt;
    for (const v of geborgen) ST.vondsten[v] = (ST.vondsten[v] || 0) + 1;
    if (!ST.kh || !Array.isArray(ST.kh.open)) ST.kh = { open: [], zag: [] };
    ST.kh.open = [...new Set(ST.kh.open.concat(D.khNieuw || []))]; ST.kh.zag = [...new Set((ST.kh.zag || []).concat([...(D.zag || [])]))];
    const mantelKlaar = D.mantel && D.mantel.length >= 4;
    if (mantelKlaar && !ST.reuzen.mantel) { ST.reuzen.mantel = 1; vond.mantel = (vond.mantel || 0) + 1; }
    const opdr = [];
    for (const o of FOTO_OPDR) {
      if (ST.opdr[o.id]) continue;
      const ok = o.soort ? (fotos[o.soort] || 0) >= (o.sterren || 1) : o.aantal ? Object.keys(fotos).length >= o.aantal : o.mantel ? mantelKlaar : o.rog ? (D.fotoRog || 0) >= 2 : false;
      if (ok) { ST.opdr[o.id] = 1; ST.geld += o.beloning; opdr.push(o.id); }
    }
    for (const [s, n] of Object.entries(vis)) { if (!ST.boek[s]) nieuw.push(s); ST.boek[s] = (ST.boek[s] || 0) + n; const p = SOORTEN[s].porties * n; const v = ST.voorraad.find(q => q[0] === s && q[2] === ST.dag); if (v) v[1] += p; else ST.voorraad.push([s, p, ST.dag]); }
    for (const [id, n] of Object.entries(vond)) ST.vondsten[id] = (ST.vondsten[id] || 0) + n;
    if (!D.nacht) ST.duiken++; else ST.stats.nacht = (ST.stats.nacht || 0) + 1; // een nachtduik is een extraatje na de dienst
    ST.stats.duiken++;
    ST.diepste = Math.max(ST.diepste || 0, Math.round(D.diepsteM));
    // nieuwe recepten leren door een nieuwe soort te vangen
    const geleerd = [];
    for (const [id, r] of Object.entries(RECEPTEN)) if (r.leer && vis[r.leer] && !(id in ST.recepten)) { ST.recepten[id] = 0; geleerd.push(id); }
    // na een nachtduik gaat de nacht verder waar hij was (slapen, de krant)
    const daarna = D.nacht && ST.na && ST.na.soort === 'avond' ? Object.assign({}, ST.na, { stap: 'nacht' }) : null;
    ST.na = { soort: 'duik', hoe, vis, vond, nieuw, geleerd, diepste: Math.round(D.diepsteM), zagKerk: !!D.zagKerk, zagZwaluw: !!D.zagZwaluw, stek: D.stek, nacht: D.nacht, fotos, fotoNieuw, opdr, mat, munt, geborgen, daarna };
    kaartBewaar(); // wat je ontdekt hebt, blijft op de kaart
    eindDeel(); bewaar();
    await overgang(() => naarScene('haven'));
    await this.hervat();

  // ---- na de dienst: het geld, de recensie én de nieuwe dag in één keer bewaren; daarna pas de vensters (DAG.hervat).

    const toon = () => {
      const tabs = [['maken', 'Maken'], ['sloop', 'Uit elkaar halen'], ['verkoop', 'Verkopen']];
      const matRij = `<div class="matrij">${Object.keys(MATERIALEN).map(m => `<span class="matvak">${plaatjeHtml(matDoek(m), 2)}<b>${ST.mat[m] || 0}</b> ${MATERIALEN[m].toLowerCase()}</span>`).join('')}</div>`;
      let inhoud = '', plaatjes = Object.keys(MATERIALEN).map(m => matDoek(m));
      if (tab === 'maken') {
        inhoud = `<p>“Zeg maar wat je nodig hebt. Als jij de materialen brengt, maak ik het.”</p><div class="lijst">${MAAKWERK.map(w => { const s = maakStand(w); return `<div class="regel"><div><div class="naam">${w.naam}${s.tekst ? ' <span class="klein">' + s.tekst + '</span>' : ''}</div><div class="klein">${w.uitleg}</div>${s.kosten ? `<div class="klein kosten">${s.kosten.geld === 0 && Object.keys(s.kosten).length === 1 ? 'gratis' : matHtml(s.kosten)}</div>` : ''}</div><div class="meer">${s.af ? `<span class="klein">${s.af}</span>` : `<button class="knop ${kanBetalen(s.kosten) ? 'goud' : ''}" type="button" data-maak="${w.id}" ${kanBetalen(s.kosten) ? '' : 'disabled'}>Maken</button>`}</div></div>`; }).join('')}</div>`;
      }
      if (tab === 'sloop') {
        const ids = Object.keys(ST.vondsten).filter(id => ST.vondsten[id] > 0 && VONDSTEN[id] && ((VONDSTEN[id].mat && !VONDSTEN[id].trofee) || SLOOP[id]));
        inhoud = ids.length ? `<p>“Geef maar hier. Hamer, beitel, en klaar: materialen.”</p><div class="lijst">${ids.map(id => `<div class="regel">${plaatjeHtml(vondstDoek(id), 2)}<div><div class="naam">${VONDSTEN[id].naam} × ${ST.vondsten[id]}</div><div class="klein">${matHtml(VONDSTEN[id].mat || SLOOP[id], false)}</div></div><div class="meer"><button class="knop" type="button" data-sloop="${id}">Uit elkaar</button></div></div>`).join('')}</div>` : '<p>Je hebt niets om uit elkaar te halen. Geborgen spullen (met een hijsballon) en rommel uit zee kun je hier tot materialen laten maken.</p>';
        plaatjes = plaatjes.concat(ids.map(id => vondstDoek(id)));
      }
      if (tab === 'verkoop') {
        const ids = Object.keys(ST.vondsten).filter(id => ST.vondsten[id] > 0 && VONDSTEN[id] && !VONDSTEN[id].verhaal && !VONDSTEN[id].trofee && !VONDSTEN[id].rommel && VONDSTEN[id].waarde > 0);
        inhoud = ids.length ? `<p>“Ik geef je een eerlijke prijs. Net zo veel als professor Wier, hoor.”</p><div class="lijst">${ids.map(id => `<div class="regel">${plaatjeHtml(vondstDoek(id), 2)}<div><div class="naam">${VONDSTEN[id].naam} × ${ST.vondsten[id]}</div><div class="klein">${VONDSTEN[id].sfeer ? 'Of hang hem op in je restaurant (sfeer +' + VONDSTEN[id].sfeer + ')' : ''}</div></div><div class="meer"><button class="knop" type="button" data-verkoop="${id}">${geldTekst(vondstPrijs(id))}</button></div></div>`).join('')}</div>` : '<p>Je hebt niets om te verkopen.</p>';
        plaatjes = plaatjes.concat(ids.map(id => vondstDoek(id)));
      }
      const k = paneel(`<h2>De Rommelzolder</h2><p class="klein">Mevrouw Snuffel, opkoper van alles wat de zee teruggeeft · <b>${geldTekst(ST.geld)}</b></p>${matRij}<div class="tabs" role="tablist">${tabs.map(([id, n]) => `<button role="tab" type="button" data-tab="${id}" aria-selected="${tab === id}">${n}</button>`).join('')}</div>${inhoud}<div class="rij"><button class="knop hoofd" type="button" id="zl-klaar">Klaar</button></div>`, { breed: true });
      vulPlaatjes(k, plaatjes);
      k.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; GELUID.sfx('klik'); toon(); });
      k.querySelectorAll('[data-maak]').forEach(b => b.onclick = () => {
        const w = MAAKWERK.find(x => x.id === b.dataset.maak), s = maakStand(w); if (!s.kosten || !kanBetalen(s.kosten)) return;
        betaalKosten(s.kosten);
        if (w.soort === 'ballon') ST.maak.ballon = (ST.maak.ballon || 0) + 1; else if (w.soort === 'eens') ST.maak[w.id] = 1; else ST.vondsten[w.id] = (ST.vondsten[w.id] || 0) + 1;
        bewaar(); GELUID.sfx('feest'); melding(w.naam + (w.soort === 'vondst' ? ' staat in je kast. Hang hem op via Het Zilte Huis.' : ' is klaar!'), 'goud', 3200); toon();
      });
      k.querySelectorAll('[data-sloop]').forEach(b => b.onclick = () => {
        const id = b.dataset.sloop; if (!ST.vondsten[id]) return; const m = VONDSTEN[id].mat || SLOOP[id];
        ST.vondsten[id]--; for (const [s, n] of Object.entries(m)) ST.mat[s] = (ST.mat[s] || 0) + n; if (harten('snuffel') >= 4) { const s = Object.keys(m)[0]; ST.mat[s]++; } bewaar(); GELUID.sfx('snij'); toon();
      });
      k.querySelectorAll('[data-verkoop]').forEach(b => b.onclick = () => { const id = b.dataset.verkoop; if (!ST.vondsten[id]) return; ST.vondsten[id]--; ST.geld += vondstPrijs(id); bewaar(); GELUID.sfx('munt'); toon(); });
      $('zl-klaar').onclick = () => { sluitPaneel(); res(); };
    };
    toon();
  });
}

// ---- personeel trainen (in het tabblad Personeel van Verbeteren)
function trainingHtml(k) {
  const [nv, xp] = ST.pnv[k] || [1, 0], volgend = TRAINING[nv + 1], talenten = TALENT[k] || {};
  const talent = Object.entries(talenten).filter(([n]) => nv >= +n).map(([, t]) => t).join(' ');
  return `<div class="klein"><b>Niveau ${nv} van 5</b>${talent ? ' · ' + talent : ''}</div>` + (volgend ? `<div class="klein">Volgende training: ${Math.min(xp, volgend.avonden)} van ${volgend.avonden} avonden ervaring${talenten[nv + 1] ? ' · daarna: ' + talenten[nv + 1].split(':')[0] : ''}</div>` : '<div class="klein">Volleerd!</div>');
}
function trainingKnop(k) {
  const [nv, xp] = ST.pnv[k] || [1, 0], v = TRAINING[nv + 1]; if (!v) return '';
  const kan = xp >= v.avonden && ST.geld >= v.geld;
  return `<button class="knop ${kan ? 'goud' : ''}" type="button" data-train="${k}" ${kan ? '' : 'disabled'}>Training ${geldTekst(v.geld)}</button>`;
}
function train(k) {
  const [nv, xp] = ST.pnv[k] || [1, 0], v = TRAINING[nv + 1]; if (!v || xp < v.avonden || ST.geld < v.geld) return false;
  ST.geld -= v.geld; ST.pnv[k] = [nv + 1, 0]; bewaar(); GELUID.sfx('feest');
  melding(PERSONEEL[k].naam + ' is nu niveau ' + (nv + 1) + '!' + (TALENT[k] && TALENT[k][nv + 1] ? ' Nieuw talent: ' + TALENT[k][nv + 1].split(':')[0] + '.' : ''), 'goud groot', 3600);
  return true;
}

// ---- het huisje in de haven (wordt in tekenHavenVoor getekend): smal, hoog, met een hijsbalk aan de zolder
function tekenZolderHuis(T, ctx, K, open) {
  const x0 = 527, x1 = 557, top = 132;
  // gevel van smalle baksteen, met een klokgevel en een hijsbalk
  hvBaksteen(T, x0, top, x1, K, '#7A4A3E', '#663C32', '#8A7A70', 77);
  T.veelhoek([[x0, top], [x0 + 4, top - 10], [x0 + 6, top - 22], [x1 - 6, top - 22], [x1 - 4, top - 10], [x1, top]], '#7A4A3E');
  for (let y = top - 22; y < top; y += 3) T.rect(x0 + 5, y, x1 - x0 - 10, 1, '#663C32');
  T.lijn(x0, top, x0 + 4, top - 10, '#E2D8C2'); T.lijn(x0 + 4, top - 10, x0 + 6, top - 22, '#E2D8C2'); T.rect(x0 + 6, top - 23, x1 - x0 - 12, 2, '#E2D8C2'); T.lijn(x1, top, x1 - 4, top - 10, '#E2D8C2'); T.lijn(x1 - 4, top - 10, x1 - 6, top - 22, '#E2D8C2');
  // het zolderluik met de hijsbalk, een haak en een touw

  T.rect(x0 + 13, top - 26, 4, 3, '#5A3A22'); T.rect(x0 + 15, top - 30, 14, 3, '#5A3A22'); T.rect(x0 + 15, top - 30, 14, 1, '#8A5A34');
  T.lijn(x0 + 27, top - 27, x0 + 27, top + 6, '#C9B48A'); T.rect(x0 + 25, top + 6, 5, 2, '#5A5F68'); T.px(x0 + 25, top + 8, '#5A5F68');

  // ramen: met gesloten luiken als ze nog dicht is
  for (const wy of [top + 22, top + 66]) { if (open) hvRaam(T, x0 + 8, wy, 14, 26, { nx: 1, ny: 2, kozijn: '#E8E2D2', gordijn: '#E9B949' }); else { T.rect(x0 + 6, wy, 18, 26, '#2E5A4A'); for (let y = wy + 2; y < wy + 26; y += 4) T.rect(x0 + 7, y, 16, 1, '#3E7A64'); T.rect(x0 + 14, wy, 2, 26, '#1E3A30'); } }
  // het uithangbord aan een smeedijzeren arm naast de gevel: op de gevel zelf past de naam niet (en daar zit de deur).
  // Binnenkant 45 x 21 pixels: 5 pixels ruimte links en rechts van ROMMEL, en 3 rijen tussen de twee regels.
  const by = top + 44, bx0 = x1 + 2, bx1 = bx0 + 46, bmx = bx0 + 23;
  T.rect(x1, by - 1, 2, 5, '#2A2230'); T.rect(x1, by, bx1 - x1 + 2, 2, '#2A2230'); T.rect(x1, by, bx1 - x1 + 2, 1, '#4A4250'); // arm
  T.lijn(x1 + 1, by + 12, x1 + 13, by + 2, '#2A2230'); T.px(bx1 + 1, by - 1, '#2A2230'); T.px(bx1 + 2, by - 2, '#2A2230'); // schoor en krulletje
  for (const kx of [bx0 + 5, bx1 - 5]) { T.px(kx, by + 2, '#5A5F68'); T.px(kx, by + 3, '#8A9098'); T.px(kx, by + 4, '#5A5F68'); } // kettinkjes
  T.rect(bx0, by + 5, bx1 - bx0 + 1, 23, '#2A2230'); T.rect(bx0 + 1, by + 6, bx1 - bx0 - 1, 21, open ? '#F2DDA0' : '#C8BCA0');
  T.rect(bx0 + 1, by + 6, bx1 - bx0 - 1, 1, open ? '#FFF0C4' : '#D8D0B8'); T.rect(bx0 + 1, by + 26, bx1 - bx0 - 1, 1, open ? '#D8BE7A' : '#A89C80');

  letters(ctx, 'ROMMEL', bmx, by + 8, '#5A2A2A', 1, 'm'); letters(ctx, 'ZOLDER', bmx, by + 18, '#5A2A2A', 1, 'm');

  const dx = (x0 + x1) / 2;
  T.rect(dx - 8, K - 40, 16, 40, '#E2D8C2'); T.rect(dx - 7, K - 38, 14, 38, open ? '#3A1E14' : '#6A2E2A');

  if (open) {

  }
}

<script>
